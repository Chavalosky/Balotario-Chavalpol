<script>
(function(){
  const topics = DATA.topics;
  const items = DATA.items;
  const itemsByNum = {};
  items.forEach(it => { itemsByNum[it.n] = it; });
  const app = document.getElementById('app');

  let state = {
    screen: 'home',
    materia: 'all',     // all | 0 (comunes) | 1 (especialidad)
    topicIdx: 'all',
    qty: 20,
    timerSec: 0,
    pool: [],
    current: 0,
    answers: [],         // {itemIdx, chosen, correct}
    locked: false,
    timerHandle: null,
    timeLeft: 0,
    examMode: false,
    examSecondsLeft: 0,
    examTimerHandle: null,
    smartMode: false,
    viewerUrl: null,
    viewerName: null,
    prevScreen: null,
    user: null,
    profile: null,
    authError: ''
  };
  const PASS_THRESHOLD = 65;
  const LB_KEY = 'chavalpol:leaderboard';
  const STATS_KEY = 'chavalpol:qstats';
  const DOC_LIST_KEY = 'chavalpol:doclist';
  const MAX_PDF_BYTES = 3.5 * 1024 * 1024; // ~3.5MB raw, safely under the 5MB stored-value limit once base64-encoded

  function letterFor(i){ return String.fromCharCode(65+i); }

  function filteredPool(){
    return items.filter(it => {
      if(state.materia !== 'all' && it.m !== state.materia) return false;
      if(state.topicIdx !== 'all' && it.t !== state.topicIdx) return false;
      return true;
    });
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function topicsForMateria(m){
    const idxs = new Set();
    items.forEach(it => { if(m==='all' || it.m===m) idxs.add(it.t); });
    return Array.from(idxs).sort((a,b)=>a-b);
  }

  function renderHome(){
    const availTopics = topicsForMateria(state.materia);
    const poolCount = filteredPool().length;

    app.innerHTML = `
      <div class="letterhead">
        <div class="lh-top">
          <span>CHAVALPOL · BANCO DE PREGUNTAS 2026</span>
          <span>PROMOCIÓN 2027</span>
        </div>
        <h1 class="lh-title">Balotario Digital</h1>
        <div class="lh-sub">Ascenso por Concurso · Suboficiales de Armas y de Servicios PNP</div>
        ${state.profile ? `<div class="lh-sub" style="margin-top:8px;">👤 ${state.profile.username} · <span id="logoutLink" style="text-decoration:underline;cursor:pointer;">Cerrar sesión</span></div>` : ''}
      </div>

      <div class="stat-row">
        <div class="stat"><div class="num">${items.length}</div><div class="lbl">Preguntas totales</div></div>
        <div class="stat"><div class="num">${topics.length}</div><div class="lbl">Materias</div></div>
        <div class="stat"><div class="num">${poolCount}</div><div class="lbl">En tu filtro</div></div>
      </div>

      <div class="tabs" id="materiaTabs">
        <div class="tab ${state.materia==='all'?'active':''}" data-m="all">Todas</div>
        <div class="tab ${state.materia===0?'active':''}" data-m="0">Materias Comunes</div>
        <div class="tab ${state.materia===1?'active':''}" data-m="1">Especialidad</div>
      </div>

      <div class="card">
        <div class="field">
          <label>Tema / Norma</label>
          <select id="topicSelect">
            <option value="all">Todos los temas (${filteredPool().length} preguntas)</option>
            ${availTopics.map(ti => {
              const c = items.filter(it => it.t===ti && (state.materia==='all'||it.m===state.materia)).length;
              return `<option value="${ti}" ${state.topicIdx===ti?'selected':''}>${topics[ti]} (${c})</option>`;
            }).join('')}
          </select>
        </div>

        <div class="field">
          <label>Cantidad de preguntas</label>
          <div class="qty-group" id="qtyGroup">
            ${[10,20,50,100,'todas'].map(v => {
              const val = v==='todas' ? 'all' : v;
              const active = state.qty===val ? 'active':'';
              return `<div class="qty-btn ${active}" data-qty="${val}">${v==='todas'?'Todas':v}</div>`;
            }).join('')}
          </div>
        </div>

        ${state.qty === 100 ? `
        <div class="field">
          <label>Modalidad</label>
          <div class="exam-note">
            <b>Simulacro oficial:</b> 100 preguntas · duración total 2 horas · nota aprobatoria 65%.
            El cronómetro corre para todo el examen, no por pregunta.
          </div>
        </div>` : `
        <div class="field">
          <label>Cronómetro por pregunta</label>
          <div class="qty-group" id="timerGroup">
            ${[{v:0,l:'Sin límite'},{v:15,l:'15s'},{v:30,l:'30s'},{v:60,l:'60s'}].map(o=>{
              const active = state.timerSec===o.v ? 'active':'';
              return `<div class="qty-btn ${active}" data-timer="${o.v}">${o.l}</div>`;
            }).join('')}
          </div>
        </div>`}

        <button class="btn-primary" id="startBtn">Iniciar simulacro</button>
        <button class="btn-smart" id="smartBtn">🎯 Repaso inteligente (prioriza tus temas débiles)</button>
      </div>

      <div class="card" id="radarCard">
        <div class="field"><label>Radar de puntos débiles</label></div>
        <div id="radarBody">
          <p style="font-size:12.5px;color:var(--muted);">Cargando…</p>
        </div>
      </div>

      <div class="card" id="leaderboardCard">
        <div class="field"><label>Top 10 resultados</label></div>
        <div id="leaderboardBody">
          <p style="font-size:12.5px;color:var(--muted);">Cargando…</p>
        </div>
      </div>

      <div class="card" id="libraryCard">
        <div class="field"><label>📄 Biblioteca de documentos</label></div>
        <div class="upload-row">
          <label class="file-label" id="fileLabel">
            + Agregar PDF para leer después
            <input type="file" id="pdfInput" accept="application/pdf">
          </label>
        </div>
        <div id="libraryBody">
          <p style="font-size:12.5px;color:var(--muted);">Cargando…</p>
        </div>
      </div>

      <footer>Generado a partir del banco oficial CHAVALPOL 2026 · Estudio personal</footer>
    `;

    renderLeaderboard();
    renderRadar('radarBody');
    renderLibrary();

    document.querySelectorAll('#materiaTabs .tab').forEach(tab=>{
      tab.onclick = () => {
        const v = tab.dataset.m;
        state.materia = v==='all' ? 'all' : parseInt(v);
        state.topicIdx = 'all';
        renderHome();
      };
    });

    document.getElementById('topicSelect').onchange = (e) => {
      const v = e.target.value;
      state.topicIdx = v==='all' ? 'all' : parseInt(v);
      renderHome();
    };

    document.querySelectorAll('.qty-btn').forEach(btn=>{
      btn.onclick = () => {
        const v = btn.dataset.qty;
        state.qty = v==='all' ? 'all' : parseInt(v);
        renderHome();
      };
    });

    document.querySelectorAll('[data-timer]').forEach(btn=>{
      btn.onclick = () => {
        state.timerSec = parseInt(btn.dataset.timer);
        renderHome();
      };
    });

    document.getElementById('startBtn').onclick = startQuiz;
    document.getElementById('smartBtn').onclick = startSmartReview;
    document.getElementById('pdfInput').onchange = handlePdfUpload;
    const logoutEl = document.getElementById('logoutLink');
    if(logoutEl) logoutEl.onclick = doLogout;
  }

  async function renderLeaderboard(bodyId){
    const body = document.getElementById(bodyId || 'leaderboardBody');
    if(!body) return;
    let list = [];
    try{
      const { data, error } = await sb.rpc('get_leaderboard');
      if(!error && data) list = data;
    }catch(e){ list = []; }
    if(!list.length){
      body.innerHTML = `<p style="font-size:12.5px;color:var(--muted);">Aún no hay resultados registrados. ¡Termina un simulacro para aparecer aquí!</p>`;
      return;
    }
    body.innerHTML = `
      <table class="leaderboard">
        <thead><tr><th>#</th><th>Usuario</th><th>Mejor %</th><th>Simulacros</th></tr></thead>
        <tbody>
          ${list.map((r,i)=>`
            <tr class="${state.profile && r.username===state.profile.username ? 'me' : ''}">
              <td class="rank">${i+1}</td>
              <td>${r.username || 'Anónimo'}</td>
              <td class="pct ${r.best>=PASS_THRESHOLD?'pass-c':'fail-c'}">${r.best}%</td>
              <td>${r.attempts}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    `;
  }

  async function saveResult(correct, total, pct){
    // Sync aggregate stats to the user's real profile row in Supabase.
    try{
      if(state.user && state.profile){
        const newAttempts = (state.profile.attempts || 0) + 1;
        const newBest = Math.max(state.profile.best || 0, pct);
        const newAnswered = (state.profile.answered || 0) + total;
        const { error } = await sb.from('profiles').update({
          attempts: newAttempts, best: newBest, answered: newAnswered
        }).eq('id', state.user.id);
        if(!error){
          state.profile.attempts = newAttempts;
          state.profile.best = newBest;
          state.profile.answered = newAnswered;
        }
      }
    }catch(e){ /* ignore sync errors */ }

    // Also keep a lightweight local history for quick reference on this device.
    let scope = state.materia==='all' ? 'Todas' : (state.materia===0?'Comunes':'Especialidad');
    if(state.topicIdx !== 'all') scope = topics[state.topicIdx].slice(0,24)+'…';
    const entry = {
      date: new Date().toLocaleDateString('es-PE'),
      scope, correct, total, pct
    };
    try{
      let list = [];
      const res = await window.storage.get(LB_KEY, false);
      if(res && res.value) list = JSON.parse(res.value);
      list.push(entry);
      list.sort((a,b)=> b.pct - a.pct || b.correct - a.correct);
      list = list.slice(0,10);
      await window.storage.set(LB_KEY, JSON.stringify(list), false);
    }catch(e){ /* ignore storage errors */ }
  }

  async function loadQStats(){
    try{
      const res = await window.storage.get(STATS_KEY, false);
      if(res && res.value) return JSON.parse(res.value);
    }catch(e){ /* no data yet */ }
    return {};
  }

  async function saveQStatsMerge(answers, pool){
    const stats = await loadQStats();
    answers.forEach(a => {
      const it = pool[a.itemIdx];
      if(!it) return;
      const key = String(it.n);
      if(!stats[key]) stats[key] = {c:0,t:0};
      stats[key].t += 1;
      if(a.correct) stats[key].c += 1;
    });
    try{ await window.storage.set(STATS_KEY, JSON.stringify(stats), false); }catch(e){ /* ignore */ }
    return stats;
  }

  function aggregateByTopic(stats){
    const agg = {};
    Object.keys(stats).forEach(k => {
      const it = itemsByNum[k];
      if(!it) return;
      if(!agg[it.t]) agg[it.t] = {c:0,t:0};
      agg[it.t].c += stats[k].c;
      agg[it.t].t += stats[k].t;
    });
    return agg;
  }

  async function renderRadar(bodyId){
    const body = document.getElementById(bodyId);
    if(!body) return;
    const stats = await loadQStats();
    const agg = aggregateByTopic(stats);
    const rows = topics.map((name, ti) => {
      const a = agg[ti];
      const pct = a && a.t ? Math.round((a.c/a.t)*100) : null;
      return { ti, name, pct, attempts: a ? a.t : 0 };
    });
    const studied = rows.filter(r => r.pct !== null).sort((a,b) => a.pct - b.pct);
    const unstudied = rows.filter(r => r.pct === null);

    if(studied.length === 0){
      body.innerHTML = `<p style="font-size:12.5px;color:var(--muted);">Aún no hay suficientes intentos registrados. Completa un simulacro para ver tus temas débiles aquí.</p>`;
      return;
    }

    function rowHtml(r){
      const cls = r.pct === null ? 'none' : (r.pct < 50 ? 'weak' : (r.pct < 75 ? 'mid' : 'strong'));
      const pctLabel = r.pct === null ? 'Sin intentos' : `${r.pct}% (${r.attempts})`;
      const width = r.pct === null ? 0 : r.pct;
      return `
        <div class="radar-row">
          <div class="radar-label">${r.name.slice(0,42)}${r.name.length>42?'…':''}</div>
          <div class="radar-track"><div class="radar-fill ${cls}" style="width:${width}%"></div></div>
          <div class="radar-pct">${pctLabel}</div>
        </div>`;
    }

    body.innerHTML = studied.map(rowHtml).join('') + unstudied.map(rowHtml).join('');
  }

  function weightedSample(weightedArr, k){
    const arr = weightedArr.slice();
    const result = [];
    for(let i=0; i<k && arr.length>0; i++){
      const totalW = arr.reduce((s,x)=>s+x.w, 0) || 1;
      let r = Math.random()*totalW;
      let idx = 0;
      for(; idx<arr.length; idx++){ r -= arr[idx].w; if(r<=0) break; }
      if(idx>=arr.length) idx = arr.length-1;
      result.push(arr[idx]);
      arr.splice(idx,1);
    }
    return result;
  }

  async function startSmartReview(){
    const stats = await loadQStats();
    const candidates = filteredPool();
    if(candidates.length === 0) return;
    const weighted = candidates.map(it => {
      const s = stats[String(it.n)];
      let w;
      if(!s || s.t === 0) w = 0.6;
      else { const err = 1 - (s.c/s.t); w = 0.15 + err*0.85; }
      return { it, w };
    });
    const pickCount = state.qty === 'all' ? Math.min(30, weighted.length) : Math.min(state.qty, weighted.length);
    const picked = weightedSample(weighted, pickCount).map(x => x.it);
    if(picked.length === 0) return;

    state.pool = shuffle(picked);
    state.current = 0;
    state.answers = [];
    state.locked = false;
    state.examMode = false;
    state.timerSec = 0;
    state.smartMode = true;
    clearExamTimer();
    state.screen = 'quiz';
    renderQuiz();
  }

  /* ---------- Document library (PDFs for later reading) ---------- */

  async function loadDocList(){
    try{
      const res = await window.storage.get(DOC_LIST_KEY, false);
      if(res && res.value) return JSON.parse(res.value);
    }catch(e){ /* none yet */ }
    return [];
  }

  async function saveDocList(list){
    try{ await window.storage.set(DOC_LIST_KEY, JSON.stringify(list), false); }catch(e){ /* ignore */ }
  }

  function fmtBytes(n){
    if(n < 1024) return n + ' B';
    if(n < 1024*1024) return Math.round(n/1024) + ' KB';
    return (n/(1024*1024)).toFixed(1) + ' MB';
  }

  async function renderLibrary(){
    const body = document.getElementById('libraryBody');
    if(!body) return;
    const list = await loadDocList();
    if(list.length === 0){
      body.innerHTML = `<p style="font-size:12.5px;color:var(--muted);">Aún no has agregado documentos. Sube un PDF (normas, apuntes, resúmenes) para leerlo después aquí mismo.</p>`;
      return;
    }
    body.innerHTML = list.map(d => `
      <div class="doc-item">
        <div class="doc-icon">PDF</div>
        <div class="doc-info">
          <div class="doc-name">${d.name}</div>
          <div class="doc-meta">${fmtBytes(d.size)} · agregado ${d.addedAt}</div>
        </div>
        <div class="doc-actions">
          <button class="doc-btn read" data-read="${d.id}">Leer</button>
          <button class="doc-btn del" data-del="${d.id}">Eliminar</button>
        </div>
      </div>
    `).join('');

    body.querySelectorAll('[data-read]').forEach(btn=>{
      btn.onclick = () => openDocument(btn.dataset.read);
    });
    body.querySelectorAll('[data-del]').forEach(btn=>{
      btn.onclick = () => deleteDocument(btn.dataset.del);
    });
  }

  async function handlePdfUpload(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file) return;
    if(file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){
      alert('Solo se admiten archivos PDF.');
      return;
    }
    if(file.size > MAX_PDF_BYTES){
      alert('El archivo es demasiado grande (máx. ~3.5 MB). Prueba comprimiéndolo o dividiéndolo.');
      return;
    }
    const label = document.getElementById('fileLabel');
    if(label) label.textContent = 'Subiendo…';

    try{
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
      const base64 = dataUrl.split(',')[1];
      const id = 'doc_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);

      await window.storage.set('chavalpol:docfile:' + id, base64, false);

      const list = await loadDocList();
      list.unshift({
        id, name: file.name, size: file.size,
        addedAt: new Date().toLocaleDateString('es-PE')
      });
      await saveDocList(list);
      renderLibrary();
    }catch(err){
      alert('No se pudo guardar el PDF. Intenta de nuevo.');
    } finally {
      if(label) label.innerHTML = `+ Agregar PDF para leer después<input type="file" id="pdfInput" accept="application/pdf">`;
      const input = document.getElementById('pdfInput');
      if(input) input.onchange = handlePdfUpload;
    }
  }

  function b64ToBlob(b64, contentType){
    const byteChars = atob(b64);
    const byteNumbers = new Array(byteChars.length);
    for(let i=0;i<byteChars.length;i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
    const byteArray = new Uint8Array(byteNumbers);
    return new Blob([byteArray], { type: contentType });
  }

  async function openDocument(id){
    const list = await loadDocList();
    const doc = list.find(d => d.id === id);
    if(!doc) return;
    try{
      const res = await window.storage.get('chavalpol:docfile:' + id, false);
      if(!res || !res.value){ alert('No se pudo cargar el archivo.'); return; }
      const blob = b64ToBlob(res.value, 'application/pdf');
      const url = URL.createObjectURL(blob);
      state.viewerUrl = url;
      state.viewerName = doc.name;
      state.prevScreen = state.screen;
      state.screen = 'viewer';
      renderViewer();
    }catch(e){
      alert('No se pudo abrir el archivo.');
    }
  }

  function renderViewer(){
    app.innerHTML = `
      <div class="pdf-viewer">
        <div class="pdf-viewer-bar">
          <div class="pdf-viewer-title">${state.viewerName || 'Documento'}</div>
          <button class="pdf-viewer-close" id="closeViewerBtn">Cerrar</button>
        </div>
        <iframe src="${state.viewerUrl}"></iframe>
      </div>
    `;
    document.getElementById('closeViewerBtn').onclick = closeViewer;
  }

  function closeViewer(){
    if(state.viewerUrl){ URL.revokeObjectURL(state.viewerUrl); state.viewerUrl = null; }
    renderHome();
  }

  async function deleteDocument(id){
    if(!confirm('¿Eliminar este documento de la biblioteca?')) return;
    let list = await loadDocList();
    list = list.filter(d => d.id !== id);
    await saveDocList(list);
    try{ await window.storage.delete('chavalpol:docfile:' + id, false); }catch(e){ /* ignore */ }
    renderLibrary();
  }

  function startQuiz(){
    let pool = filteredPool();
    pool = shuffle(pool);
    if(state.qty !== 'all'){
      pool = pool.slice(0, state.qty);
    }
    if(pool.length === 0) return;
    state.pool = pool;
    state.current = 0;
    state.answers = [];
    state.locked = false;
    state.screen = 'quiz';
    state.examMode = (state.qty === 100);
    state.smartMode = false;
    if(state.examMode){
      state.timerSec = 0;
      state.examSecondsLeft = 2 * 60 * 60; // 2 horas
      startExamTimer();
    } else {
      clearExamTimer();
    }
    renderQuiz();
  }

  function clearExamTimer(){
    if(state.examTimerHandle){
      clearInterval(state.examTimerHandle);
      state.examTimerHandle = null;
    }
  }

  function fmtHMS(totalSec){
    const h = Math.floor(totalSec/3600);
    const m = Math.floor((totalSec%3600)/60);
    const s = totalSec%60;
    return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':');
  }

  function startExamTimer(){
    clearExamTimer();
    state.examTimerHandle = setInterval(() => {
      state.examSecondsLeft -= 1;
      const el = document.getElementById('examTimerNum');
      if(el) el.textContent = fmtHMS(Math.max(0,state.examSecondsLeft));
      const bar = document.getElementById('examTimerFill');
      if(bar){
        const pct = Math.max(0, (state.examSecondsLeft/(2*60*60))*100);
        bar.style.width = pct + '%';
        if(pct <= 15) bar.classList.add('urgent');
      }
      if(state.examSecondsLeft <= 0){
        clearExamTimer();
        state.screen = 'results';
        renderResults();
      }
    }, 1000);
  }

  function renderQuiz(){
    const total = state.pool.length;
    const idx = state.current;
    const it = state.pool[idx];
    const pct = Math.round((idx/total)*100);

    app.innerHTML = `
      ${state.smartMode ? `<div class="smart-badge">🎯 Repaso Inteligente</div>` : ''}
      <div class="progress-wrap">
        <div class="progress-label mono">${idx+1} / ${total}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label mono" id="scoreLive">${state.answers.filter(a=>a.correct).length} ✓</div>
      </div>

      ${state.examMode ? `
      <div class="timer-wrap">
        <div class="timer-label">Examen (2h)</div>
        <div class="timer-track"><div class="timer-fill" id="examTimerFill" style="width:${Math.max(0,(state.examSecondsLeft/(2*60*60))*100)}%"></div></div>
        <div class="timer-label mono" id="examTimerNum">${fmtHMS(Math.max(0,state.examSecondsLeft))}</div>
      </div>` : ''}

      ${state.timerSec > 0 ? `
      <div class="timer-wrap">
        <div class="timer-label">Tiempo</div>
        <div class="timer-track"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
        <div class="timer-label mono" id="timerNum">${state.timerSec}s</div>
      </div>` : ''}

      <div class="expediente">
        <div class="exp-meta">
          <span>${it.m===0?'Materias Comunes':'Materias Especialidad'} · ${topics[it.t].slice(0,40)}${topics[it.t].length>40?'…':''}</span>
          <span class="mono">N° ${it.n}</span>
        </div>
        <div class="stamp" id="stamp"></div>
        <p class="exp-question">${it.q}</p>
        <div class="options" id="options">
          ${it.o.map((opt,i)=>`
            <div class="option" data-i="${i}">
              <span class="letter">${letterFor(i)}</span>
              <span>${opt}</span>
            </div>`).join('')}
        </div>
        <div class="ref-box" id="refBox">
          <b>Ubicación:</b> ${it.u || 'No especificada'}
        </div>
      </div>

      <div class="nav-row">
        <button class="btn-primary" id="nextBtn" disabled>${idx+1===total ? 'Ver resultados' : 'Siguiente pregunta'}</button>
        <button class="btn-secondary" id="quitBtn">Terminar simulacro</button>
      </div>
    `;

    document.querySelectorAll('.option').forEach(opt=>{
      opt.onclick = () => selectOption(parseInt(opt.dataset.i));
    });
    document.getElementById('nextBtn').onclick = nextQuestion;
    document.getElementById('quitBtn').onclick = () => { clearTimer(); clearExamTimer(); state.screen='results'; renderResults(); };

    if(state.timerSec > 0){
      startTimer();
    }
  }

  function clearTimer(){
    if(state.timerHandle){
      clearInterval(state.timerHandle);
      state.timerHandle = null;
    }
  }

  function startTimer(){
    clearTimer();
    state.timeLeft = state.timerSec;
    const fill = document.getElementById('timerFill');
    const num = document.getElementById('timerNum');
    if(!fill || !num) return;
    state.timerHandle = setInterval(() => {
      state.timeLeft -= 1;
      const pct = Math.max(0, (state.timeLeft/state.timerSec)*100);
      fill.style.width = pct + '%';
      num.textContent = Math.max(0,state.timeLeft) + 's';
      if(state.timeLeft <= Math.ceil(state.timerSec*0.3)){
        fill.classList.add('urgent');
      }
      if(state.timeLeft <= 0){
        clearTimer();
        if(!state.locked) selectOption(-1);
      }
    }, 1000);
  }

  function selectOption(i){
    if(state.locked) return;
    clearTimer();
    state.locked = true;
    const it = state.pool[state.current];
    const correct = i === it.a;
    state.answers.push({ itemIdx: state.current, chosen: i, correct });

    document.querySelectorAll('.option').forEach((opt, oi)=>{
      opt.classList.add('locked');
      if(oi === it.a) opt.classList.add('correct');
      if(oi === i && !correct && i !== -1) opt.classList.add('incorrect');
    });

    const stamp = document.getElementById('stamp');
    stamp.textContent = i === -1 ? 'Tiempo agotado' : (correct ? 'Correcto' : 'Incorrecto');
    stamp.className = 'stamp show ' + (correct ? 'ok' : 'no');

    document.getElementById('refBox').classList.add('show');
    document.getElementById('nextBtn').disabled = false;
    document.getElementById('scoreLive').textContent = state.answers.filter(a=>a.correct).length + ' ✓';
  }

  function nextQuestion(){
    clearTimer();
    state.locked = false;
    if(state.current + 1 >= state.pool.length){
      clearExamTimer();
      state.screen = 'results';
      renderResults();
    } else {
      state.current += 1;
      renderQuiz();
    }
  }

  async function renderResults(){
    const total = state.answers.length;
    const correct = state.answers.filter(a=>a.correct).length;
    const pct = total ? Math.round((correct/total)*100) : 0;
    const wrong = state.answers.filter(a=>!a.correct);
    const passed = pct >= PASS_THRESHOLD;

    await saveResult(correct, total, pct);
    await saveQStatsMerge(state.answers, state.pool);

    app.innerHTML = `
      <div class="letterhead">
        <div class="lh-top"><span>RESULTADO DEL SIMULACRO</span><span class="mono">${new Date().toLocaleDateString('es-PE')}</span></div>
        <h1 class="lh-title">Acta de Evaluación</h1>
      </div>

      <div class="card score-hero">
        <div class="score-big">${pct}%</div>
        <div class="score-sub">${correct} correctas de ${total} preguntas · Mínimo aprobatorio ${PASS_THRESHOLD}%</div>
        <div class="verdict ${passed?'pass':'fail'}">${passed?'Aprobado':'Desaprobado'}</div>
      </div>

      ${wrong.length ? `
      <div class="card">
        <div class="field"><label>Preguntas falladas (${wrong.length})</label></div>
        ${wrong.map(w=>{
          const it = state.pool[w.itemIdx];
          return `
          <div class="review-item">
            <div class="review-q">${it.n}. ${it.q}</div>
            <div class="review-a wrong">Tu respuesta: ${letterFor(w.chosen)}) ${it.o[w.chosen]}</div>
            <div class="review-a right">Respuesta correcta: ${letterFor(it.a)}) ${it.o[it.a]}</div>
            <div class="review-ref">${it.u || ''}</div>
          </div>`;
        }).join('')}
      </div>` : `<div class="card"><p style="text-align:center;color:var(--brass-2);font-weight:600;">Sin errores — dominas este tema.</p></div>`}

      <button class="btn-primary" id="retryWrongBtn" ${wrong.length? '' : 'disabled'}>Repasar solo las falladas</button>
      <button class="btn-secondary" id="newQuizBtn">Nuevo simulacro</button>

      <div class="card">
        <div class="field"><label>Radar de puntos débiles</label></div>
        <div id="radarBodyResults"><p style="font-size:12.5px;color:var(--muted);">Cargando…</p></div>
      </div>

      <div class="card">
        <div class="field"><label>Top 10 resultados</label></div>
        <div id="leaderboardBodyResults"><p style="font-size:12.5px;color:var(--muted);">Cargando…</p></div>
      </div>

      <footer>Generado a partir del banco oficial CHAVALPOL 2026 · Estudio personal</footer>
    `;

    renderLeaderboard('leaderboardBodyResults');
    renderRadar('radarBodyResults');

    if(wrong.length){
      document.getElementById('retryWrongBtn').onclick = () => {
        state.pool = wrong.map(w => state.pool[w.itemIdx]);
        state.current = 0;
        state.answers = [];
        state.locked = false;
        state.examMode = false;
        state.screen = 'quiz';
        renderQuiz();
      };
    }
    document.getElementById('newQuizBtn').onclick = () => {
      state.screen = 'home';
      renderHome();
    };
  }

  /* ---------- Auth: phone + password, admin-issued verification code ---------- */

  function normalizePhone(raw){
    return (raw || '').replace(/[^\d]/g, '');
  }

  function fakeEmailForPhone(phone){
    return `tel-${phone}@chavalpol.local`;
  }

  async function fetchProfile(userId){
    const { data, error } = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();
    if(error) return null;
    return data;
  }

  async function initAuth(){
    app.innerHTML = `<div class="auth-wrap"><p style="text-align:center;color:var(--muted);font-size:13px;">Cargando…</p></div>`;
    try{
      const { data: { session } } = await sb.auth.getSession();
      if(session && session.user){
        state.user = session.user;
        state.profile = await fetchProfile(session.user.id);
        if(state.profile && state.profile.approved){
          state.screen = 'home';
          renderHome();
        } else {
          state.screen = 'pending';
          renderPending();
        }
      } else {
        state.screen = 'login';
        renderLogin();
      }
    }catch(e){
      state.screen = 'login';
      renderLogin();
    }
  }

  function renderLogin(){
    app.innerHTML = `
      <div class="auth-wrap">
        <div class="auth-badge">
          <div class="lh-title" style="text-align:center;">CHAVALPOL</div>
        </div>
        <h1 class="auth-title">Iniciar sesión</h1>
        <div class="auth-sub">Balotario Suboficiales de Armas y de Servicios PNP</div>
        <div class="auth-error" id="authErr"></div>
        <div class="auth-field">
          <label>Número de teléfono</label>
          <input type="tel" id="loginPhone" placeholder="999 999 999" inputmode="numeric">
        </div>
        <div class="auth-field">
          <label>Contraseña</label>
          <input type="password" id="loginPass" placeholder="••••••••">
        </div>
        <button class="btn-primary" id="loginBtn">Iniciar sesión</button>
        <div class="auth-switch">¿No tienes cuenta? <a id="goRegister">Regístrate</a></div>
      </div>
    `;
    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('goRegister').onclick = () => { state.authError=''; renderRegister(); };
    document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  }

  function showAuthError(msg){
    const el = document.getElementById('authErr');
    if(!el) return;
    el.textContent = msg;
    el.classList.add('show');
  }

  async function doLogin(){
    const phone = normalizePhone(document.getElementById('loginPhone').value);
    const pass = document.getElementById('loginPass').value;
    if(!phone || !pass){ showAuthError('Ingresa tu teléfono y contraseña.'); return; }
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Ingresando…';
    try{
      const { data: email, error: e1 } = await sb.rpc('get_email_by_phone', { p_phone: phone });
      if(e1 || !email){ showAuthError('No existe una cuenta con ese número.'); return; }
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if(error){ showAuthError('Teléfono o contraseña incorrectos.'); return; }
      state.user = data.user;
      state.profile = await fetchProfile(data.user.id);
      if(state.profile && state.profile.approved){
        state.screen = 'home';
        renderHome();
      } else {
        state.screen = 'pending';
        renderPending();
      }
    }catch(e){
      showAuthError('Ocurrió un error: ' + (e && e.message ? e.message : e));
    }finally{
      btn.disabled = false; btn.textContent = 'Iniciar sesión';
    }
  }

  function renderRegister(){
    app.innerHTML = `
      <div class="auth-wrap">
        <h1 class="auth-title">Crear cuenta</h1>
        <div class="auth-sub">Después de registrarte, pide el código de verificación a tu administrador.</div>
        <div class="auth-error" id="authErr"></div>
        <div class="auth-field">
          <label>Nombre (para la tabla de posiciones)</label>
          <input type="text" id="regName" placeholder="Ej. Juan P.">
        </div>
        <div class="auth-field">
          <label>Número de teléfono</label>
          <input type="tel" id="regPhone" placeholder="999 999 999" inputmode="numeric">
        </div>
        <div class="auth-field">
          <label>Contraseña</label>
          <input type="password" id="regPass" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="auth-field">
          <label>Confirmar contraseña</label>
          <input type="password" id="regPass2" placeholder="Repite tu contraseña">
        </div>
        <button class="btn-primary" id="registerBtn">Registrarme</button>
        <div class="auth-switch">¿Ya tienes cuenta? <a id="goLogin">Inicia sesión</a></div>
      </div>
    `;
    document.getElementById('registerBtn').onclick = doRegister;
    document.getElementById('goLogin').onclick = () => { state.authError=''; renderLogin(); };
  }

  async function doRegister(){
    const username = document.getElementById('regName').value.trim();
    const phone = normalizePhone(document.getElementById('regPhone').value);
    const pass = document.getElementById('regPass').value;
    const pass2 = document.getElementById('regPass2').value;

    if(!username || !phone || !pass){ showAuthError('Completa todos los campos.'); return; }
    if(phone.length < 6){ showAuthError('Ingresa un número de teléfono válido.'); return; }
    if(pass.length < 6){ showAuthError('La contraseña debe tener al menos 6 caracteres.'); return; }
    if(pass !== pass2){ showAuthError('Las contraseñas no coinciden.'); return; }

    const btn = document.getElementById('registerBtn');
    btn.disabled = true; btn.textContent = 'Creando cuenta…';
    const email = fakeEmailForPhone(phone);
    try{
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if(error){
        showAuthError(error.message.includes('registered') ? 'Ese teléfono ya está registrado.' : ('No se pudo crear la cuenta: ' + error.message));
        return;
      }
      if(!data.session){
        // Email confirmation is likely required in the Supabase Auth settings.
        showAuthError('Cuenta creada, pero no se inició sesión automáticamente. Pide al administrador que revise la configuración de Auth (Confirm email debe estar desactivado).');
        return;
      }
      state.user = data.user;
      const { error: profErr } = await sb.from('profiles').insert({
        id: data.user.id, username, phone, email
      });
      if(profErr){ showAuthError('Cuenta creada, pero hubo un problema guardando tu perfil.'); return; }
      state.profile = await fetchProfile(data.user.id);
      state.screen = 'pending';
      renderPending();
    }catch(e){
      showAuthError('Ocurrió un error: ' + (e && e.message ? e.message : e));
    }finally{
      btn.disabled = false; btn.textContent = 'Registrarme';
    }
  }

  function renderPending(){
    app.innerHTML = `
      <div class="auth-wrap">
        <h1 class="auth-title">Verificación pendiente</h1>
        <div class="auth-info">
          Tu cuenta fue creada. Pide a tu administrador el <b>código de verificación</b>
          de 6 caracteres asociado a tu número, e ingrésalo aquí para activar tu cuenta.
        </div>
        <div class="auth-error" id="authErr"></div>
        <div class="auth-field">
          <label>Código de verificación</label>
          <input type="text" id="verifyCode" class="code-input" maxlength="6" placeholder="------">
        </div>
        <button class="btn-primary" id="verifyBtn">Verificar</button>
        <div class="logout-link" id="logoutLink2">Cerrar sesión</div>
      </div>
    `;
    document.getElementById('verifyBtn').onclick = doVerifyCode;
    document.getElementById('logoutLink2').onclick = doLogout;
  }

  async function doVerifyCode(){
    const code = document.getElementById('verifyCode').value.trim();
    if(!code){ showAuthError('Ingresa el código.'); return; }
    const btn = document.getElementById('verifyBtn');
    btn.disabled = true; btn.textContent = 'Verificando…';
    try{
      const { data, error } = await sb.rpc('verify_auth_code', { p_code: code });
      if(error || !data){ showAuthError('Código incorrecto. Verifica con tu administrador.'); return; }
      state.profile = await fetchProfile(state.user.id);
      state.screen = 'home';
      renderHome();
    }catch(e){
      showAuthError('Ocurrió un error: ' + (e && e.message ? e.message : e));
    }finally{
      btn.disabled = false; btn.textContent = 'Verificar';
    }
  }

  async function doLogout(){
    try{ await sb.auth.signOut(); }catch(e){ /* ignore */ }
    state.user = null;
    state.profile = null;
    state.screen = 'login';
    renderLogin();
  }

  initAuth();
})();
</script>
</body>
