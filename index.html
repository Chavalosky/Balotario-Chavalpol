<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balotario PNP · Suboficiales de Armas y Servicios 2026</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12161B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @font-face { font-family: 'system'; src: local('Inter'); }

  :root{
    --ink: #12161B;
    --ink-2: #1B222B;
    --paper: #EDE7D9;
    --paper-2: #E2DAC6;
    --brass: #C08A2E;
    --brass-2: #E4A93F;
    --red-stamp: #9C2B2B;
    --green-stamp: #2F5D3A;
    --line: rgba(237,231,217,0.14);
    --muted: rgba(237,231,217,0.6);
  }

  *{ box-sizing: border-box; }

  html,body{ margin:0; padding:0; height:100%; }

  body{
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(192,138,46,0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(192,138,46,0.06), transparent 45%);
    color: var(--paper);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .mono{ font-family: 'JetBrains Mono', 'Courier New', monospace; }

  .display{
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  #app{
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }

  @media (min-width: 720px){
    #app{ max-width: 860px; padding: 40px 24px 70px; }
    .lh-title{ font-size: 32px; }
    .qty-group{ flex-wrap: nowrap; }
  }
  @media (min-width: 1024px){
    #app{ max-width: 960px; }
    .home-grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items:start; }
    .expediente{ padding: 34px 40px 30px; }
    .exp-question{ font-size: 19px; }
    .option{ font-size: 14.5px; padding: 13px 16px; }
  }

  /* ---------- Header / Letterhead ---------- */
  .letterhead{
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 18px 20px;
    margin-bottom: 22px;
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .letterhead::before{
    content: '';
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 1px solid rgba(192,138,46,0.25);
    pointer-events: none;
  }
  .lh-top{
    display:flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; letter-spacing: 0.12em; color: var(--brass);
    margin-bottom: 10px;
  }
  .lh-title{
    font-size: 26px;
    font-weight: 600;
    color: var(--paper);
    margin: 0;
    line-height: 1.15;
  }
  .lh-sub{
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  /* ---------- Folder tabs ---------- */
  .tabs{ display:flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab{
    flex: 1 1 auto;
    min-width: 120px;
    text-align:center;
    padding: 10px 12px;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s ease;
  }
  .tab:hover{ color: var(--paper); }
  .tab.active{
    background: var(--paper);
    color: var(--ink);
    border-color: var(--paper);
    font-weight: 600;
  }

  .card{
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .field{ margin-bottom: 16px; }
  .field label{
    display:block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--brass-2);
    margin-bottom: 8px;
  }
  select, .qty-group{
    width: 100%;
  }
  select{
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 11px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  .qty-group{ display:flex; gap: 8px; flex-wrap: wrap; }
  .qty-btn{
    flex: 1 1 auto;
    padding: 10px 8px;
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    text-align:center;
  }
  .qty-btn.active{
    background: var(--brass);
    border-color: var(--brass);
    color: var(--ink);
    font-weight: 700;
  }

  .exam-note{
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--muted);
    background: rgba(192,138,46,0.08);
    border: 1px solid rgba(192,138,46,0.3);
    border-radius: 4px;
    padding: 12px 14px;
  }
  .exam-note b{ color: var(--brass-2); }

  .stat-row{
    display:flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .stat{
    flex: 1 1 100px;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 14px;
  }
  .stat .num{ font-size: 22px; font-weight: 700; color: var(--brass-2); }
  .stat .lbl{ font-size: 10px; text-transform:uppercase; letter-spacing:.08em; color: var(--muted); margin-top:2px;}

  .btn-primary{
    display:block;
    width: 100%;
    padding: 15px;
    background: var(--brass);
    color: var(--ink);
    border: none;
    border-radius: 3px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform .1s ease, background .15s ease;
  }
  .btn-primary:hover{ background: var(--brass-2); }
  .btn-primary:active{ transform: scale(0.99); }
  .btn-primary:disabled{ opacity: .4; cursor: not-allowed; }

  .btn-secondary{
    display:block;
    width: 100%;
    padding: 13px;
    background: transparent;
    color: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 13px;
    letter-spacing: 0.03em;
    cursor: pointer;
    margin-top: 10px;
  }
  .btn-secondary:hover{ border-color: var(--brass); color: var(--brass-2); }

  /* ---------- Quiz screen ---------- */
  .progress-wrap{
    display:flex; align-items:center; gap: 12px; margin-bottom: 18px;
  }
  .progress-track{
    flex:1;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--brass);
    transition: width .3s ease;
  }
  .progress-label{ font-size:12px; color: var(--muted); white-space:nowrap; }

  .timer-wrap{
    display:flex; align-items:center; gap: 10px;
    margin-bottom: 14px;
  }
  .timer-ring{
    position: relative;
    width: 42px; height: 42px;
    flex: 0 0 auto;
  }
  .timer-ring svg{ transform: rotate(-90deg); }
  .timer-ring circle{
    fill: none;
    stroke-width: 4;
  }
  .timer-ring .bg{ stroke: var(--line); }
  .timer-ring .fg{
    stroke: var(--brass);
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke .2s ease;
  }
  .timer-ring .fg.urgent{ stroke: var(--red-stamp); }
  .timer-num{
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 13px; font-weight: 700; color: var(--paper);
  }
  .timer-track{
    flex: 1;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .timer-fill{
    height: 100%;
    background: var(--brass);
    transition: width 1s linear, background .2s ease;
  }
  .timer-fill.urgent{ background: var(--red-stamp); }
  .timer-label{ font-size: 11px; color: var(--muted); white-space:nowrap; }

  .expediente{
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 24px 22px 20px;
    position: relative;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .exp-meta{
    display:flex; justify-content: space-between;
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(18,22,27,0.5);
    margin-bottom: 14px;
    border-bottom: 1px dashed rgba(18,22,27,0.2);
    padding-bottom: 10px;
  }
  .exp-question{
    font-size: 17px;
    line-height: 1.45;
    font-weight: 600;
    margin: 0 0 18px;
  }
  .options{ display:flex; flex-direction:column; gap: 9px; }
  .option{
    display:flex; gap: 10px; align-items:flex-start;
    text-align:left;
    padding: 12px 14px;
    background: rgba(18,22,27,0.04);
    border: 1px solid rgba(18,22,27,0.14);
    border-radius: 3px;
    cursor:pointer;
    font-size: 14px;
    line-height: 1.4;
    color: var(--ink);
    transition: all .12s ease;
  }
  .option:hover:not(.locked){ background: rgba(18,22,27,0.09); border-color: rgba(18,22,27,0.3); }
  .option .letter{
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: rgba(18,22,27,0.4);
    min-width: 16px;
  }
  .option.correct{
    background: rgba(47,93,58,0.12);
    border-color: var(--green-stamp);
  }
  .option.correct .letter{ color: var(--green-stamp); }
  .option.incorrect{
    background: rgba(156,43,43,0.1);
    border-color: var(--red-stamp);
  }
  .option.incorrect .letter{ color: var(--red-stamp); }
  .option.locked{ cursor: default; }

  .stamp{
    position:absolute;
    top: 14px; right: 18px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.12em;
    padding: 6px 14px;
    border: 3px solid;
    border-radius: 3px;
    transform: rotate(-8deg) scale(1);
    opacity: 0;
    pointer-events:none;
    text-transform: uppercase;
  }
  .stamp.show{
    animation: stampIn .35s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .stamp.ok{ color: var(--green-stamp); border-color: var(--green-stamp); }
  .stamp.no{ color: var(--red-stamp); border-color: var(--red-stamp); }
  @keyframes stampIn{
    0%{ opacity:0; transform: rotate(-8deg) scale(2.2); }
    60%{ opacity: 1; }
    100%{ opacity: 0.92; transform: rotate(-8deg) scale(1); }
  }

  .ref-box{
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed rgba(18,22,27,0.2);
    font-size: 11.5px;
    color: rgba(18,22,27,0.6);
    display:none;
  }
  .ref-box.show{ display:block; }
  .ref-box b{ color: rgba(18,22,27,0.85); }

  .nav-row{ margin-top: 18px; }

  /* ---------- Results ---------- */
  .score-hero{
    text-align:center;
    padding: 30px 20px;
  }
  .score-big{
    font-size: 56px;
    font-weight: 800;
    color: var(--brass-2);
    line-height: 1;
  }
  .score-sub{ color: var(--muted); font-size: 13px; margin-top: 8px; letter-spacing: 0.04em;}

  .verdict{
    display:inline-block;
    margin-top: 14px;
    padding: 8px 20px;
    border: 3px solid;
    border-radius: 3px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transform: rotate(-4deg);
  }
  .verdict.pass{ color: var(--green-stamp); border-color: var(--green-stamp); }
  .verdict.fail{ color: var(--red-stamp); border-color: var(--red-stamp); }

  .leaderboard{ width:100%; border-collapse: collapse; font-size: 12.5px; }
  .leaderboard th{
    text-align:left; font-size: 10px; text-transform:uppercase; letter-spacing:.06em;
    color: var(--brass-2); padding: 6px 8px; border-bottom: 1px solid var(--line);
  }
  .leaderboard td{ padding: 8px; border-bottom: 1px solid var(--line); }
  .leaderboard tr.me{ background: rgba(192,138,46,0.08); }
  .leaderboard td.rank{ font-family:'JetBrains Mono',monospace; color: var(--brass-2); width: 24px; }
  .leaderboard td.pct{ font-weight:700; }
  .leaderboard td.pct.pass-c{ color: #8FCB9E; }
  .leaderboard td.pct.fail-c{ color: #E28888; }

  .radar-row{
    display:flex; align-items:center; gap: 10px;
    padding: 7px 0;
  }
  .radar-label{
    flex: 0 0 44%;
    font-size: 11.5px;
    line-height:1.3;
    color: var(--paper);
  }
  .radar-track{
    flex:1;
    height: 10px;
    background: var(--line);
    border-radius: 5px;
    overflow:hidden;
  }
  .radar-fill{ height:100%; border-radius:5px; }
  .radar-fill.weak{ background: var(--red-stamp); }
  .radar-fill.mid{ background: var(--brass); }
  .radar-fill.strong{ background: var(--green-stamp); }
  .radar-fill.none{ background: rgba(237,231,217,0.15); }
  .radar-pct{
    flex: 0 0 62px;
    text-align:right;
    font-family:'JetBrains Mono',monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .btn-smart{
    display:block;
    width: 100%;
    padding: 14px;
    background: transparent;
    color: var(--green-stamp);
    border: 1.5px solid var(--green-stamp);
    border-radius: 3px;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 10px;
  }
  .btn-smart:hover{ background: rgba(47,93,58,0.12); }

  .smart-badge{
    display:inline-block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--green-stamp);
    border: 1px solid var(--green-stamp);
    border-radius: 3px;
    padding: 3px 9px;
    margin-bottom: 10px;
  }

  /* ---------- Library / PDF docs ---------- */
  .upload-row{
    display:flex; gap: 8px; align-items:center;
    margin-bottom: 14px;
  }
  .file-label{
    flex: 1;
    display:flex; align-items:center; justify-content:center;
    padding: 12px;
    background: var(--ink);
    border: 1px dashed var(--line);
    border-radius: 3px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    text-align:center;
  }
  .file-label:hover{ border-color: var(--brass); color: var(--brass-2); }
  .file-label input{ display:none; }

  .doc-item{
    display:flex; align-items:center; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .doc-item:last-child{ border-bottom:none; }
  .doc-icon{
    flex: 0 0 auto;
    width: 30px; height: 36px;
    background: var(--brass);
    color: var(--ink);
    border-radius: 3px;
    display:flex; align-items:center; justify-content:center;
    font-size: 9px; font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
  }
  .doc-info{ flex:1; min-width:0; }
  .doc-name{ font-size: 13px; color: var(--paper); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .doc-meta{ font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .doc-actions{ display:flex; gap: 6px; flex:0 0 auto; }
  .doc-btn{
    padding: 7px 10px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--paper);
    font-size: 11.5px;
    cursor:pointer;
  }
  .doc-btn.read{ border-color: var(--brass); color: var(--brass-2); }
  .doc-btn.del{ border-color: var(--red-stamp); color: #E28888; }

  .pdf-viewer{
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background: var(--ink);
    z-index: 1000;
    display:flex;
    flex-direction: column;
  }
  .pdf-viewer-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 16px;
    background: var(--ink-2);
    border-bottom: 1px solid var(--line);
  }
  .pdf-viewer-title{
    font-size: 13px;
    color: var(--paper);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    max-width: 70%;
  }
  .pdf-viewer-close{
    background: var(--brass);
    color: var(--ink);
    border:none;
    border-radius:3px;
    padding: 8px 14px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    flex: 0 0 auto;
  }
  .pdf-viewer iframe{ flex:1; border:none; width:100%; }

  /* ---------- Auth screens ---------- */
  .auth-wrap{
    max-width: 420px;
    margin: 0 auto;
    padding-top: 8vh;
  }
  .auth-badge{
    text-align:center;
    margin-bottom: 22px;
  }
  .auth-badge img{ width: 64px; height:64px; border-radius:14px; }
  .auth-title{
    text-align:center;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .auth-sub{
    text-align:center;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 22px;
  }
  .auth-field{ margin-bottom: 14px; }
  .auth-field label{
    display:block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--brass-2);
    margin-bottom: 6px;
  }
  .auth-field input{
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 12px 13px;
    font-size: 15px;
    font-family: inherit;
  }
  .auth-field input:focus{ outline:none; border-color: var(--brass); }
  .auth-error{
    background: rgba(156,43,43,0.12);
    border: 1px solid rgba(156,43,43,0.4);
    color: #E28888;
    border-radius: 3px;
    padding: 10px 12px;
    font-size: 12.5px;
    margin-bottom: 14px;
    display:none;
  }
  .auth-error.show{ display:block; }
  .auth-info{
    background: rgba(192,138,46,0.1);
    border: 1px solid rgba(192,138,46,0.35);
    color: var(--paper);
    border-radius: 4px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .auth-switch{
    text-align:center;
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .auth-switch a{ color: var(--brass-2); cursor:pointer; text-decoration: underline; }
  .code-input{
    text-align:center;
    letter-spacing: 0.4em;
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px !important;
    text-transform: uppercase;
  }
  .logout-link{
    display:block;
    text-align:center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 18px;
    cursor: pointer;
  }
  .logout-link:hover{ color: var(--brass-2); }

  .review-item{
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
  }
  .review-item:last-child{ border-bottom:none; }
  .review-q{ font-size: 13.5px; font-weight:600; margin-bottom:8px; line-height:1.4; }
  .review-a{ font-size: 12.5px; margin: 2px 0; }
  .review-a.wrong{ color: #E28888; }
  .review-a.right{ color: #8FCB9E; }
  .review-ref{ font-size: 11px; color: var(--muted); margin-top:6px; }

  .hidden{ display:none !important; }

  footer{
    text-align:center;
    font-size: 10.5px;
    color: rgba(237,231,217,0.35);
    margin-top: 30px;
    letter-spacing: 0.05em;
  }

  @media (prefers-reduced-motion: reduce){
    .stamp.show{ animation: none; opacity: 0.92; }
  }
</style>
</head>

<script>
// Storage shim: only used when running as a standalone app/PWA (outside the
// Claude artifact sandbox, window.storage won't exist). Mirrors the same
// get/set/delete/list interface using IndexedDB so the app code needs no changes.
if(!window.storage){
  const DB_NAME = 'chavalpol_store', STORE = 'kv';
  function openDB(){
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  window.storage = {
    async get(key){
      const db = await openDB();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE,'readonly');
        const req = tx.objectStore(STORE).get(key);
        req.onsuccess = () => resolve(req.result !== undefined ? {key, value:req.result, shared:false} : null);
        req.onerror = () => reject(req.error);
      });
    },
    async set(key, value){
      const db = await openDB();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).put(value, key);
        tx.oncomplete = () => resolve({key, value, shared:false});
        tx.onerror = () => reject(tx.error);
      });
    },
    async delete(key){
      const db = await openDB();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).delete(key);
        tx.oncomplete = () => resolve({key, deleted:true, shared:false});
        tx.onerror = () => reject(tx.error);
      });
    },
    async list(prefix){
      const db = await openDB();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE,'readonly');
        const req = tx.objectStore(STORE).getAllKeys();
        req.onsuccess = () => {
          let keys = req.result;
          if(prefix) keys = keys.filter(k => String(k).startsWith(prefix));
          resolve({keys});
        };
        req.onerror = () => reject(req.error);
      });
    }
  };

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
}
</script>

RECURSO DE APELACIÓN EN EL PLAZO MÁXIMO DE 10 DÍAS HÁBILES, ANTE LA DENEGATORIA DE LA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA A ENTREGAR LA INFORMACIÓN SOLICITADA?","o":["SE PRORROGA EL PLAZO POR 10 DÍAS HÁBILES POR ÚNICA VEZ.","EL SOLICITANTE PODRÁ DAR POR AGOTADA LA VÍA ADMINISTRATIVA","EL SOLICITANTE PODRÁ INTERPONER RECURSO EXTRAORDINARIO DE QUEJA ANTE LA AUTORIDAD NACIONAL DE TRANSPARENCIA Y ACCESO A LA INFORMACIÓN PÚBLICA.","EL SOLICITANTE PODRÁ RECURRIR ANTE LA AUTORIDAD NACIONAL DE TRANSPARENCIA Y ACCESO A LA INFORMACIÓN PÚBLICA.","EL TRIBUNAL DE TRANSPARENCIA Y ACCESO A LA INFORMACIÓN PÚBLICA TENDRÁ UN PLAZO EXTRAORDINARIO DE 5 DÍAS PARA RESOLVER."],"a":1,"u":"(texto: 11)** [TITULO III]","m":0,"t":7},{"n":535,"q":"¿QUIÉNES ESTÁN OBLIGADAS A INFORMAR SOBRE LAS CARACTERÍSTICAS DE LOS SERVICIOS PÚBLICOS QUE PRESTA, SUS TARIFAS Y SOBRE LAS FUNCIONES ADMINISTRATIVAS QUE EJERCE?","o":["TODA PERSONA SUJETAS AL RÉGIMEN PRIVADO DESCRITAS EN EL INCISO 8 DEL ARTÍCULO PRIMERO DEL TÍTULO PRELIMINAR DE LA LEY 7444 QUE GESTIONEN SERVICIOS PÚBLICOS O EJERZAN FUNCIONES ADMINISTRATIVAS DEL SECTOR PÚBLICO BAJO CUALQUIER MODALIDAD.","TODA PERSONA NATURAL O JURÍDICA SUJETAS AL RÉGIMEN PRIVADO DESCRITAS EN EL INCISO 8 DEL ARTÍCULO PRIMERO DEL TÍTULO PRELIMINAR DE LA LEY 27444 QUE GESTIONEN SERVICIOS PÚBLICOS O EJERZAN FUNCIONES ADMINISTRATIVAS DEL SECTOR PÚBLICO BAJO CUALQUIER MODALIDAD.","LAS PERSONAS JURÍDICAS SUJETAS AL RÉGIMEN PRIVADO DESCRITAS EN EL INCISO 8 DEL ARTÍCULO PRIMERO DEL TÍTULO PRELIMINAR DE LA LEY 27444 QUE GESTIONEN SERVICIOS PÚBLICOS O EJERZAN FUNCIONES ADMINISTRATIVAS DEL SECTOR PÚBLICO BAJO CUALQUIER MODALIDAD.","TODA PERSONA NATURAL O JURÍDICA SUJETAS AL RÉGIMEN ESPECIAL DESCRITAS EN EL INCISO 8 DEL ARTÍCULO PRIMERO DEL TÍTULO PRELIMINAR DE LA LEY 27444 QUE GESTIONEN SERVICIOS PÚBLICOS O EJERZAN FUNCIONES ADMINISTRATIVAS DEL SECTOR PÚBLICO BAJO CUALQUIER MODALIDAD.","LAS PERSONAS JURÍDICAS SUJETAS AL RÉGIMEN ESPECIAL DESCRITAS EN EL INCISO 8 DEL ARTÍCULO PRIMERO DEL TÍTULO PRELIMINAR DE LA LEY 27444 QUE GESTIONEN SERVICIOS PÚBLICOS O EJERZAN FUNCIONES ADMINISTRATIVAS DEL SECTOR PÚBLICO BAJO CUALQUIER MODALIDAD."],"a":2,"u":"(texto: 9)** [TITULO III]","m":0,"t":7},{"n":536,"q":"RESPECTO AL PROCEDIMIENTO DE ACCESO A LA INFORMACIÓN PÚBLICA, SABEMOS QUE TODA SOLICITUD DE INFORMACIÓN DEBE SER DIRIGIDA AL FUNCIONARIO DESIGNADO POR LA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA PARA REALIZAR ESTA LABOR. EN CASO DE QUE ÉSTE NO HUBIERA SIDO DESIGNADO, ¿A QUIÉN SE DIRIGE LA SOLICITUD?","o":["LA SOLICITUD SE DIRIGE A CUALQUIER OTRO FUNCIONARIO PÚBLICO DE LA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA.","LA SOLICITUD SE DIRIGE AL TITULAR DEL PLIEGO.","LA SOLICITUD SE DIRIGE AL DIRECTOR ADMINISTRATIVO DE LA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA O QUIEN HAGA SUS VECES.","LA SOLICITUD SE DIRIGE AL FUNCIONARIO QUE TIENE EN SU PODER LA INFORMACIÓN REQUERIDA O AL SUPERIOR INMEDIATO.","LA SOLICITUD SE DIRIGE A LA SECRETARIA O MESA DE PARTES DE LA OFICINA U ÁREA DE LA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA QUE TENGA LA INFORMACIÓN REQUERIDA."],"a":3,"u":"(texto: 11)** [TITULO III]","m":0,"t":7},{"n":537,"q":"RESPECTO AL PROCEDIMIENTO DE ACCESO A LA INFORMACIÓN PÚBLICA, INDIQUE ¿A QUIÉN DEBE SER DIRIGIDA LA SOLICITUD DE INFORMACIÓN?","o":["AL FUNCIONARIO DESIGNADO POR LA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA PARA REALIZAR ESTA LABOR.","A CUALQUIER FUNCIONARIO PÚBLICO DE LA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA.","AL FUNCIONARIO QUE HACE LAS VECES DE MESA DE PARTES DE LA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA.","AL TITULAR DEL PLIEGO.","AL DIRECTOR ADMINISTRACIÓN DE LA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA O QUIEN HAGA SUS VECES."],"a":0,"u":"(ART: 11)** [TITULO III]","m":0,"t":7},{"n":538,"q":"RESPECTO AL PROCEDIMIENTO DE ACCESO A LA INFORMACIÓN PÚBLICA. ¿QUÉ SUCEDE CUÁNDO EXCEPCIONALMENTE PARA LA ENTIDAD, SEA MATERIALMENTE IMPOSIBLE CUMPLIR CON EL PLAZO SEÑALADO EN EL LITERAL B, DEBIDO A CAUSAS JUSTIFICADAS RELACIONADAS A LA COMPROBADA Y MANIFIESTA FALTA DE CAPACIDAD LOGÍSTICA, U OPERATIVA, O DE RECURSOS HUMANOS DE LA ENTIDAD, O AL SIGNIFICATIVO VOLUMEN DE LA INFORMACIÓN SOLICITADA?","o":["EL SOLICITANTE PUEDE INTERPONER EL RECURSO DE APELACIÓN ANTE EL TRIBUNAL DE TRANSPARENCIA Y ACCESO A LA INFORMACIÓN PÚBLICA.","EL SOLICITANTE PUEDE CONSIDERAR DENEGADO SU PEDIDO.","EL SOLICITANTE PODRÁ RECURRIR EN QUEJA ANTE AUTORIDAD NACIONAL DE TRANSPARENCIA Y ACCESO A LA INFORMACIÓN PÚBLICA.","EL SOLICITANTE PODRÁ DAR POR AGOTADA LA VÍA ADMINISTRATIVA.","POR ÚNICA VEZ LA ENTIDAD DEBE COMUNICAR AL SOLICITANTE LA FECHA EN QUE PROPORCIONARÁ LA INFORMACIÓN SOLICITADA DE FORMA DEBIDAMENTE FUNDAMENTADA."],"a":4,"u":"(texto: 11)** [TITULO III]","m":0,"t":7},{"n":539,"q":"PROMOVER LA TRANSPARENCIA DE LOS ACTOS DEL ESTADO Y REGULAR EL DERECHO FUNDAMENTAL DEL ACCESO A LA INFORMACIÓN CONSAGRADO EN EL NUMERAL 5 DEL ARTÍCULO 2 DE LA CONSTITUCIÓN POLÍTICA DEL PERÚ, CONSTITUYE:","o":["ALCANCE DE LA LEY 27806.","EL OBJETO DE LA LEY 27806.","LA NATURALEZA DE LA LEY 27806.","EL OBJETIVO DE LA LEY 27806.","EL OBJETO DEL REGLAMENTO DE LA LEY 27806."],"a":0,"u":"(texto: 1)** [TITULO I]","m":0,"t":7},{"n":540,"q":"LA PRESENTE LEY TIENE POR FINALIDAD PROMOVER LA TRANSPARENCIA DE LOS ACTOS DEL ESTADO Y REGULAR EL DERECHO FUNDAMENTAL DEL ACCESO A LA INFORMACIÓN CONSAGRADO EN EL:","o":["NUMERAL 2 DEL ARTÍCULO 2 DE LA CONSTITUCIÓN POLÍTICA DEL PERÚ.","NUMERAL 4 DEL ARTÍCULO 2 DE LA CONSTITUCIÓN POLÍTICA DEL PERÚ.","NUMERAL 24 DEL ARTÍCULO 2 DE LA CONSTITUCIÓN POLÍTICA DEL PERÚ.","NUMERAL 1 DEL ARTÍCULO 2 DE LA CONSTITUCIÓN POLÍTICA DEL PERÚ.","NUMERAL 5 DEL ARTÍCULO 2 DE LA CONSTITUCIÓN POLÍTICA DEL PERÚ."],"a":4,"u":"(texto: 1)** [TITULO I]","m":0,"t":7},{"n":541,"q":"PARA EFECTOS DE LA PRESENTE LEY SE ENTIENDE POR ENTIDADES DE LA ADMINISTRACIÓN PÚBLICA A LAS SEÑALADAS EN EL:","o":["ARTÍCULO 1 DEL TÍTULO PRELIMINAR DE LA LEY 27444.","ARTÍCULO 1 DEL TÍTULO III DE LA LEY 27444.","ARTÍCULO SEGUNDO DEL TÍTULO PRELIMINAR DE LA LEY 27444.","ARTÍCULO 2 DEL TÍTULO PRELIMINAR DE LA LEY 27444.","ARTÍCULO PRIMERO DEL TÍTULO SEGUNDO DE LA LEY 27444."],"a":0,"u":"(texto: 2)** [TITULO I]","m":0,"t":7},{"n":542,"q":"RESPECTO AL PROCEDIMIENTO DE ACCESO A LA INFORMACIÓN PÚBLICA, ¿QUÉ SUCEDE EN EL SUPUESTO QUE LA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA NO ESTÉ OBLIGADA A POSEER LA INFORMACIÓN SOLICITADA Y CONOZCA SU UBICACIÓN O DESTINO?","o":["LA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA DEBE PONER EN CONOCIMIENTO DE DICHA CIRCUNSTANCIA AL SOLICITANTE PARA QUE ÉSTE LO RE ENCAUSE.","LA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA DEBE RE ENCAUSAR LA SOLICITUD HACIA LA ENTIDAD OBLIGADA O HACIA LA QUE LA POSEA, Y PONER EN CONOCIMIENTO DE DICHA CIRCUNSTANCIA AL SOLICITANTE","LA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA DEBE DEVOLVER LA SOLICITUD AL SOLICITANTE Y HACERLE CONOCER DICHA CIRCUNSTANCIA.","LA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA DEBE PONER EN CONOCIMIENTO DE DICHA CIRCUNSTANCIA AL SOLICITANTE.","EL SOLICITANTE DEBE RE ENCAUSAR SU PEDIDO HACIA LA ENTIDAD QUE POSEA LA INFORMACIÓN SOLICITADA, PREVIA DEVOLUCIÓN DE SU SOLICITUD, LA MISMA QUE DEBE NOTIFICARSE DENTRO DE LOS 3 DÍAS HÁBILES DE RECIBIDA."],"a":1,"u":"(texto: 11)** [TITULO III]","m":0,"t":7},{"n":543,"q":"RESPECTO AL PROCEDIMIENTO DE ACCESO A LA INFORMACIÓN PÚBLICA, LA DENEGATORIA AL ACCESO A LA INFORMACIÓN SE SUJETA A LO DISPUESTO EN EL SEGUNDO PÁRRAFO DEL ARTÍCULO:","o":["15 DE LA PRESENTE LEY.","7 DE LA PRESENTE LEY.","16 DE LA PRESENTE LEY.","18 DE LA PRESENTE LEY.","13 DE LA PRESENTE LEY."],"a":4,"u":"(texto: 11)** [TITULO III]","m":0,"t":7},{"n":544,"q":"EL MINISTERIO DE ECONOMÍA Y FINANZAS PUBLICARÁ, ADICIONALMENTE A LO ESTABLECIDO EN EL ARTÍCULO 25 DE LA PRESENTE NORMA, LOS PROYECTOS DE LA LEY DE ENDEUDAMIENTO, EQUILIBRIO FINANCIERO Y PRESUPUESTO Y SU EXPOSICIÓN DE MOTIVOS, DENTRO DE:","o":["LOS 2 PRIMEROS DÍAS HÁBILES DE OCTUBRE.","LOS 2 PRIMEROS DÍAS HÁBILES DE AGOSTO.","LOS 2 PRIMEROS DÍAS HÁBILES DE SETIEMBRE.","LOS 2 PRIMEROS DÍAS HÁBILES DE DICIEMBRE.","LOS 2 PRIMEROS DÍAS HÁBILES DE NOVIEMBRE."],"a":2,"u":"(texto: 26)** [TITULO IV] [CAPITULO I]","m":0,"t":7},{"n":545,"q":"RESPECTO A LA DENEGATORIA DE ACCESO A LA INFORMACIÓN PÚBLICA; SI EL REQUERIMIENTO DE INFORMACIÓN NO HUBIERE SIDO SATISFECHO, LA RESPUESTA HUBIERE SIDO AMBIGUA, O NO SE HUBIEREN CUMPLIDO LAS EXIGENCIAS PRECEDENTES, SE CONSIDERARÁ QUE EXISTIÓ:","o":["NEGLIGENCIA EN BRINDARLA.","NEGATIVA EN BRINDARLA.","IMPEDIMENTO EN BRINDARLA.","OBSTRUCCIÓN EN BRINDARLA.","VOLUNTAD MANIFIESTA EN DENEGARLA."],"a":1,"u":"(texto: 13)** [TITULO III]","m":0,"t":7},{"n":546,"q":"RESPECTO A LA DENEGATORIA DE ACCESO A LA INFORMACIÓN PÚBLICA; NO SE PODRÁ NEGAR INFORMACIÓN CUANDO SE SOLICITE QUE ESTA SEA ENTREGADA EN UNA DETERMINADA FORMA O MEDIO, SIEMPRE QUE:","o":["LA ENTIDAD ASUMA EL COSTO QUE SUPONGA EL PEDIDO.","SE TENGA LA LOGÍSTICA NECESARIA PARA ATENDER EL PEDIDO.","EL SOLICITANTE ASUMA EL COSTO QUE SUPONGA EL PEDIDO.","EL PEDIDO NO REPRESENTE NINGÚN COSTO.","EL SOLICITANTE SEA OTRA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA."],"a":2,"u":"(texto: 13)** [TITULO III]","m":0,"t":7},{"n":547,"q":"\"SE APLICA A TODAS LAS INSTITUCIONES INTEGRANTES DEL SISTEMA DE JUSTICIA: PODER JUDICIAL, MINISTERIO PÚBLICO, JUNTA NACIONAL DE JUSTICIA, TRIBUNAL CONSTITUCIONAL Y ACADEMIA DE LA MAGISTRATURA\". EL PÁRRAFO ANTERIOR SE REFIERE A:","o":["ÁMBITO DE APLICACIÓN","TRANSPARENCIA EN LOS PODERES DEL ESTADO.","TRANSPARENCIA EN EL PODER JUDICIAL.","ÁMBITO DE APLICACIÓN DE TRANSPARENCIA EN EL PODER JUDICIAL.","RÉGIMEN DE TRANSPARENCIA EN EL SISTEMA JUDICIAL."],"a":0,"u":"(texto: 38)** [TITULO VI]","m":0,"t":7},{"n":548,"q":"EL MINISTERIO DE ECONOMÍA Y FINANZAS PUBLICARÁ, ADICIONALMENTE A LO ESTABLECIDO EN EL ARTÍCULO 25 DE LA PRESENTE NORMA, LOS INGRESOS Y GASTOS DEL GOBIERNO CENTRAL E INSTANCIAS DESCENTRALIZADAS COMPRENDIDAS EN LA LEY DE PRESUPUESTO DEL SECTOR PÚBLICO, DE CONFORMIDAD CON LOS CLASIFICADORES DE INGRESOS, GASTOS Y FINANCIAMIENTO VIGENTE, TRIMESTRALMENTE, INCLUYENDO EL PRESUPUESTO ANUAL Y EL DEVENGADO, DE AC QUIER OBSTÁCULO QUE SE OPONGA A REGULAR TRAMITACIÓN DEL PROCEDIMIENTO.","LA AUTORIDAD COMPETENTE, PREVIO PEDIDO DE PARTE, DEBE DETERMINAR LA NORMA APLICABLE AL CASO AUN CUANDO NO HAYA SIDO INVOCADA O FUERE ERRÓNEA LA CITA LEGAL.","LA AUTORIDAD COMPETENTE, PREVIO PEDIDO DE PARTE, DEBE EVITAR EL ENTORPECIMIENTO O DEMORA A CAUSA DE DILIGENCIAS INNECESARIAS O MERAMENTE FORMALES.","LA AUTORIDAD COMPETENTE, AUN SIN PEDIDO DE PARTE, DEBE PROMOVER TODA ACTUACIÓN QUE FUESE NECESARIA PARA SU TRAMITACIÓN."],"a":4,"u":"(ART: 145)** [TITULO II] [CAPITULO V]","m":0,"t":9},{"n":720,"q":"¿EN CUÁL DE LOS SIGUIENTES ESCENARIOS UNA MEDIDA CAUTELAR DICTADA EN UN PROCEDIMIENTO ADMINISTRATIVO CADUCA DE PLENO DERECHO?","o":["CUANDO SE EMITE LA RESOLUCIÓN QUE PONE FIN AL PROCEDIMIENTO.","CUANDO TRANSCURRE EL PLAZO FIJADO PARA LA EJECUCIÓN DE LA MEDIDA CAUTELAR.","CUANDO EL ADMINISTRADO SOLICITA EXPRESAMENTE LA CADUCIDAD DE LA MEDIDA Y ESTO ES ACEPTADO POR LA AUTORIDAD.","CUANDO LA ENTIDAD ADMINISTRATIVA DECIDE EN CUALQUIER MOMENTO REVOCAR LA MEDIDA SIN MOTIVACIÓN ALGUNA.","CUANDO SE INTERPONEN RECURSOS ADMINISTRATIVOS CONTRA LA MEDIDA CAUTELAR Y ESTOS NO SON RESUELTOS EN EL PLAZO LEGAL."],"a":0,"u":"(ART: 146)** [TITULO II] [CAPITULO V]","m":0,"t":9},{"n":721,"q":"EN EL IMPULSO Y TRAMITACIÓN DE CASOS DE UNA MISMA NATURALEZA, SE SIGUE RIGUROSAMENTE EL ORDEN DE INGRESO, Y SE RESUELVEN CONFORME LO VAYA PERMITIENDO SU ESTADO, DANDO CUENTA AL SUPERIOR DE LOS MOTIVOS DE DEMORA EN EL CUMPLIMIENTO DE LOS PLAZOS DE LEY, QUE NO PUEDAN SER REMOVIDOS DE OFICIO. EL REFERIDO PÁRRAFO CONSTITUYE UNA REGLA PARA ASEGURAR EL CUMPLIMIENTO DEL PRINCIPIO DE:","o":["LEGALIDAD.","EFICIENCIA.","IMPULSO DE OFICIO.","CELERIDAD.","INFORMALISMO."],"a":3,"u":"(ART: 148)** [TITULO II] [CAPITULO V]","m":0,"t":9},{"n":722,"q":"EN NINGÚN CASO LA AUTORIDAD PODRÁ ALEGAR DEFICIENCIAS DEL ADMINISTRADO NO ADVERTIDAS A LA PRESENTACIÓN DE LA SOLICITUD, COMO FUNDAMENTO PARA DENEGAR SU PRETENSIÓN. EL REFERIDO PÁRRAFO CONSTITUYE UNA REGLA PARA ASEGURAR EL CUMPLIMIENTO DEL PRINCIPIO DE:","o":["LEGALIDAD.","EFICIENCIA.","IMPULSO DE OFICIO.","CELERIDAD.","INFORMALISMO."],"a":3,"u":"(ART: 148)** [TITULO II] [CAPITULO V]","m":0,"t":9},{"n":723,"q":"DEL PROCEDIMIENTO ADMINISTRATIVO.- LOS EXPEDIENTES SON COMPAGINADOS SIGUIENDO EL ORDEN REGULAR DE LOS DOCUMENTOS QUE LO INTEGRAN, FORMANDO CUERPOS CORRELATIVOS QUE NO EXCEDAN DE (......), SALVO CUANDO TAL LÍMITE OBLIGARA A DIVIDIR ESCRITOS O DOCUMENTOS QUE CONSTITUYAN UN SOLO TEXTO, EN CUYO CASO SE MANTENDRÁ SU UNIDAD.","o":["TRESCIENTOS FOLIOS.","QUINIENTOS FOLIOS.","CIEN FOLIOS.","DOSCIENTOS FOLIOS.","CINCUENTA FOLIOS."],"a":3,"u":"(ART: 152)** [TITULO II] [CAPITULO V]","m":0,"t":9},{"n":724,"q":"¿EN QUÉ MOMENTO, LOS ADMINISTRADOS PUEDEN FORMULAR QUEJA CONTRA LOS DEFECTOS DE TRAMITACIÓN Y, EN ESPECIAL, LOS QUE SUPONGAN PARALIZACIÓN, INFRACCIÓN DE LOS PLAZOS ESTABLECIDOS LEGALMENTE, INCUMPLIMIENTO DE LOS DEBERES FUNCIONALES U OMISIÓN DE TRÁMITES QUE DEBEN SER SUBSANADOS?","o":["EN CUALQUIER MOMENTO.","ANTES DEL INICIO DEL PROCEDIMIENTO.","ANTES DE LA RESOLUCIÓN DEFINITIVA DEL ASUNTO EN LA INSTANCIA RESPECTIVA.","ANTES DE LA APORTACIÓN DE PRUEBAS.","ANTES DE LA APELACIÓN."],"a":0,"u":"(ART: 158)** [TITULO II] [CAPITULO V]","m":0,"t":9},{"n":725,"q":"¿QUIEN TIENE A CARGO ASEGURAR LA REGULARIDAD DE LAS DELIBERACIONES Y EJECUTAR SUS ACUERDOS.?","o":["EL SECRETARIO DEL ÓRGANO COLEGIADO.","EL DIRECTOR DEL ÓRGANO COLEGIADO.","EL PRESIDENTE DEL ÓRGANO COLEGIADO.","EL DECANO DEL ÓRGANO COLEGIADO.","EL TITULAR DEL ÓRGANO COLEGIADO."],"a":2,"u":"(ART: 96)** [TITULO II] [CAPITULO II] [SUBCAPITULO V]","m":0,"t":9},{"n":726,"q":"AUTORIDADES DE LOS ÓRGANOS COLEGIADOS.- CADA ÓRGANO COLEGIADO DE LAS ENTIDADES ES REPRESENTADO POR UN (...............), A CARGO DE ASEGURAR LA REGULARIDAD DE LAS DELIBERACIONES Y EJECUTAR SUS ACUERDOS, Y CUENTA CON UN SECRETARIO, A CARGO DE PREPARAR LA AGENDA, LLEVAR, ACTUALIZAR Y CONSERVAR LAS ACTAS DE LAS SESIONES, COMUNICAR LOS ACUERDOS, OTORGAR COPIAS Y DEMÁS ACTOS PROPIOS DE LA NATURALEZA DEL CARGO.","o":["SECRETARIO.","PRESIDENTE.","DIRECTOR.","DECANO.","TITULAR."],"a":1,"u":"(ART: 96)** [TITULO II] [CAPITULO II] [SUBCAPITULO V]","m":0,"t":9},{"n":727,"q":"(.....), ES PROMOVIDO DE OFICIO POR EL ÓRGANO COMPETENTE O INSTANCIA DEL ADMINISTRADO, SALVO QUE POR DISPOSICIÓN LEGAL O POR SU FINALIDAD CORRESPONDA SER INICIADO EXCLUSIVAMENTE DE OFICIO O A INSTANCIA DEL INTERESADO.","o":["LOS PROCEDIMIENTOS DE LA ADMINISTRACIÓN.","LOS ACTOS ADMINISTRATIVOS.","EL PROCEDIMIENTO ADMINISTRATIVO.","LOS ACTOS DE LA ADMINISTRACIÓN.","LOS DOCUMENTOS ADMINISTRATIVOS."],"a":2,"u":"(ART: 103)** [TITULO II] [CAPITULO III]","m":0,"t":9},{"n":728,"q":"RESPECTO A LA FUENTE DE LA COMPETENCIA DE LAS ENTIDADES ADMINISTRATIVAS, ¿CUÁL DE LAS SIGUIENTES AFIRMACIONES DESCRIBE CORRECTAMENTE EL ORIGEN Y REGULACIÓN DE DICHA COMPETENCIA?","o":["LA COMPETENCIA DE LAS ENTIDADES ADMINISTRATIVAS PUEDE ESTABLECERSE VÁLIDAMENTE MEDIANTE ACUERDOS MUNICIPALES Y RESOLUCIONES ADMINISTRATIVAS DE CARÁCTER GENERAL A FALTA DE DISPOSICIÓN CONSTITUCIONAL O LEGAL.","LA COMPETENCIA DE LAS ENTIDADES TIENE SU ORIGEN DIRECTO EN LA PRÁCTICA ADMINISTRATIVA Y LA COSTUMBRE, Y PUEDE SER RECONOCIDA POR REGLAMENTOS EMITIDOS POR LA ADMINISTRACIÓN CENTRAL.","LA COMPETENCIA DE LAS ENTIDADES TIENE SU FUENTE EN LA CONSTITUCIÓN Y LA LEY, Y ES REGLAMENTADA POR NORMAS ADMINISTRATIVAS QUE SE DERIVAN DE DICHAS FUENTES.","LAS ENTIDADES ADQUIEREN COMPETENCIA PRINCIPALMENTE DE LOS TRATADOS INTERNACIONALES RATIFICADOS POR EL ESTADO, EN CUYO CASO LA LEY SOLO TIENE FUNCIÓN INTERPRETATIVA.","EL EJERCICIO DE COMPETENCIA DEVIENE VÁLIDO SIEMPRE QUE PROVENGA DE UNA NORMA REGLAMENTARIA EMITIDA POR LA ENTIDAD INVOLUCRADA, SIN NECESIDAD DE FUNDAMENTO LEGAL EXPLÍCITO."],"a":2,"u":"(ART: 61)** [TITULO II] [CAPITULO II] [SUBCAPITULO II]","m":0,"t":9},{"n":729,"q":"RESPECTO A LA SUPLENCIA DE LOS TITULARES DE ÓRGANOS ADMINISTRATIVOS, ¿CUÁL DE LAS SIGUIENTES AFIRMACIONES ES CORRECTA SOBRE EL PROCESO DE SUPLENCIA TEMPORAL EN CASO DE VACANCIA O AUSENCIA JUSTIFICADA?","o":["LA SUPLENCIA SOLO PROCEDE ANTE LA AUSENCIA DEL TITULAR, EXCLUYENDO CASOS DE VACANCIA DEFINITIVA.","LA SUPLENCIA TEMPORAL ES AUTOMÁTICAMENTE EJERCIDA POR EL SERVIDOR CON MAYOR ANTIGÜEDAD EN LA ENTIDAD, SIN NECESIDAD DE DESIGNACIÓN.","LA SUPLENCIA TEMPORAL CORRESPONDE ÚNICAMENTE AL SUBALTERNO INMEDIATO DEL TITULAR, SIGUIENDO EL ORDEN JERÁRQUICO DEL REGLAMENTO INTERNO.","LA SUPLENCIA DE LOS TITULARES DE ÓRGANOS ADMINISTRATIVOS, EN CASO DE VACANCIA O AUSENCIA JUSTIFICADA, DEBE SER DISPUESTA POR QUIEN TIENE COMPETENCIA PARA REALIZAR EL NOMBRAMIENTO DE DICHO TITULAR.","LA SUPLENCIA SOLO PUEDE DISPONERSE SI LA VACANCIA ES PRODUCTO DE UNA SANCIÓN ADMINISTRATIVA VIGENTE."],"a":3,"u":"(ART: 73)** [TITULO II] [CAPITULO II] [SUBCAPITULO II]","m":0,"t":9},{"n":730,"q":"¿CUÁL ES LA CONSECUENCIA PRINCIPAL RESPECTO DE LAS COSTAS CUANDO UNA ENTIDAD DE LA ADMINISTRACIÓN PÚBLICA SOLICITA LA COLABORACIÓN DE OTRA ENTIDAD?","o":["LA ENTIDAD QUE SOLICITA LA COLABORACIÓN DEBE ASUMIR LOS COSTOS ADMINISTRATIVOS Y TASAS QUE ELLO OCASIONE.","LA ENTIDAD QUE RECIBE LA SOLICITUD PUEDE EXIGIR EL PAGO DE DERECHOS ADMINISTRATIVOS SI ASÍ LO CONSIDERA PERTINENTE.","LA SOLICITUD DE COLABORACIÓN SÍ PUEDE GENERAR EL PAGO DE TASAS, PERO ÚNICAMENTE SI EXISTE UNA DISPOSICIÓN EXPRESA EN UNA REGLAMENTACIÓN INTERNA.","LA SOLICITUD DE COLABORACIÓN NO DETERMINA EL PAGO DE TASA POR DICHO CONCEPTO, SIN PERJUICIO DEL PAGO DE LAS TASAS REGULARES.","EL PAGO DE CUALQUIER CONCEPTO QUEDARÁ A DISCRECIÓN DEL ÓRGANO ADMINISTRATIVO SUPERIOR A AMBAS ENTIDADES."],"a":3,"u":"(ART: 79)** [TITULO II] [CAPITULO II] [SUBCAPITULO III]","m":0,"t":9},{"n":731,"q":"EN TODO CONFLICTO DE COMPETENCIA, EL ÓRGANO A QUIEN SE REMITE EL EXPEDIENTE DICTA RESOLUCIÓN IRRECURRIBLE DENTRO DEL PLAZO DE (....).","o":["TRES DÍAS.","CUATRO DÍAS.","DOS DÍAS.","CINCO DÍAS.","DIEZ DÍAZ."],"a":1,"u":"(ART: 85)** [TITULO II] [CAPITULO II] [SUBCAPITULO IV]","m":0,"t":9},{"n":732,"q":"¿QUIÉN ES COMPETENTE PARA RESOLVER LOS CONFLICTOS POSITIVOS O NEGATIVOS DE COMPETENCIA DENTRO DE UNA MISMA ENTIDAD ADMINISTRATIVA CUANDO EXISTEN DIVERSAS AUTORIDADES INVOLUCRADAS?","o":["EL SUPERIOR JERÁRQUICO COMÚN DE LAS AUTORIDADES EN CONFLICTO.","EL PRESIDENTE DEL CONSEJO DE MINISTROS, POR DELEGACIÓN EXPRESA DEL TITULAR DE LA ENTIDAD.","EL TRIBUNAL CONSTITUCIONAL, POR VÍA DE CONSULTA ADMINISTRATIVA.","LA DEFENSORÍA DEL PUEBLO, COMO ÓRGANO IMPARCIAL EXTERNO A LA ENTIDAD.","EL JUEZ DE LO CONTENCIOSO ADMINISTRATIVO DESIGNADO PARA LA CIRCUNSCRIPCIÓN TERRITORIAL CORRESPONDIENTE."],"a":0,"u":"(ART: 86)** [TITULO II] [CAPITULO II] [SUBCAPITULO IV]","m":0,"t":9},{"n":733,"q":"¿CUÁL DE LAS SIGUIENTES AFIRMACIONES DEFINE CORRECTAMENTE QUIÉNES SON CONSIDERADOS ADMINISTRADOS RESPECTO DE UN PROCEDIMIENTO ADMINISTRATIVO CONCRETO?","o":["SOLAMENTE QUIENES INICIAN UN PROCEDIMIENTO ADMINISTRATIVO PUEDEN SER CONSIDERADOS ADMINISTRADOS, SIN IMPORTAR LA AFECTACIÓN DE INTERESES DE TERCEROS.","SOLO LAS PERSONAS JURÍDICAS, YA QUE SOLO ELLAS PUEDEN OSTENTAR DERECHOS COLECTIVOS ANTE LA ADMINISTRACIÓN PÚBLICA.","QUIENES LO PROMUEVAN COMO TITULARES DE DERECHOS O INTERESES LEGÍTIMOS INDIVIDUALES O COLECTIVOS.","CUALQUIER PERSONA NATURAL O JURÍDICA, INDEPENDIENTEMENTE DE ESTAR INVOLUCRADOS EN EL PROCEDIMIENTO O DE SER AFECTADOS POR LA DECISIÓN ADMINISTRATIVA.","SOLAMENTE TITULARES DE DERECHOS PATRIMONIALES INDIVIDUALES PUEDEN SER ADMINISTRADOS EN EL PROCEDIMIENTO REGULADO POR EL ARTÍCULO 51."],"a":2,"u":"(ART: 51)** [TITULO II] [CAPITULO II] [SUBCAPITULO I]","m":0,"t":9},{"n":734,"q":"LOS ACTOS ADMINISTRATIVOS DEBERÁN EXPRESARSE POR ESCRITO, SALVO QUE POR LA NATURALEZA Y CIRCUNSTANCIA DEL CASO, EL ORDENAMIENTO JURÍDICO HAYA PREVISTO OTRA FORMA, SIEMPRE QUE PERMITA TENER CONSTANCIA DE SU EXISTENCIA, SE REFIERE A UNA:","o":["OBJETO O CONTENIDO DEL ACTO ADMINISTRATIVO.","FORMA DE LOS ACTOS ADMINISTRATIVOS.","MOTIVACIÓN DEL ACTO ADMINISTRATIVO.","REQUISITOS DE VALIDEZ DEL ACTO ADMINIST  71) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":761,"q":"¿QUIÉNES FIRMAN EN EL ACTA SOBRE EL CUMPLIMIENTO DE LOS DERECHOS DEL IMPUTADO?","o":["EL IMPUTADO, EL ABOGADO Y LA POLICÍA NACIONAL","EL ABOGADO DEFENSOR Y EL MINISTERIO PÚBLICO","EL DEFENSOR DEL PUEBLO","LOS FAMILIARES","EL IMPUTADO Y LA AUTORIDAD CORRESPONDIENTE"],"a":4,"u":"(ART: 71) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":762,"q":"¿QUÉ DEBERÁ DE REALIZARSE, SI EL IMPUTADO SE REHÚSA A FIRMAR EN ACTA?","o":["SE HARÁ CONSTAR LA ABSTENCIÓN, Y SE CONSIGNARÁ EL MOTIVO SI LO EXPRESARE.","NO SE HARÁ CONSTAR LA ABSTENCIÓN, SI ASÍ LO EXPRESARE.","SE HARÁ CONSTATAR LA DECISIÓN, Y SE CONSIGNARÁ EL MOTIVO SI LO EXPRESARE.","NO SE HARÁ CONSTAR DICHA OBSERVACIÓN, SIN CONSIGNAR EL MOTIVO SI ASÍ LO EXPRESARE.","NO SE HARÁ CONSTAR LA DECISIÓN."],"a":0,"u":"(ART: 71) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":763,"q":"¿QUIÉN PUEDE ACUDIR EN VÍA DE TUTELA AL JUEZ DE LA INVESTIGACIÓN PREPARATORIA, PARA QUE SUBSANE LA OMISIÓN, O DICTE LA MEDIDA DE CORRECCIÓN O DE PROTECCIÓN QUE CORRESPONDA?","o":["EL IMPUTADO CUANDO CONSIDERE QUE SUS DERECHOS NO SON RESPETADOS, O QUE ES OBJETO DE MEDIDAS LIMITATIVAS","EL PROCESADO CUANDO CONSIDERE QUE SUS DERECHOS NO SON RESPETADOS, O QUE ES OBJETO DE MEDIDAS LIMITATIVAS","EL SENTENCIADO CUANDO CONSIDERE QUE SUS DERECHOS NO SON RESPETADOS, O QUE ES OBJETO DE MEDIDAS LIMITATIVAS","EL INVESTIGADO CUANDO CONSIDERE QUE SUS DERECHOS NO SON RESPETADOS, O QUE ES OBJETO DE MEDIDAS LIMITATIVAS","EL INTERVENIDO CUANDO CONSIDERE QUE SUS DERECHOS NO SON RESPETADOS, O QUE ES OBJETO DE MEDIDAS LIMITATIVAS"],"a":0,"u":"(ART: 71) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":764,"q":"¿QUIÉN SERÁ IDENTIFICADO POR SU NOMBRE, DATOS PERSONALES, SEÑAS PARTICULARES Y, CUANDO CORRESPONDA, POR SUS IMPRESIONES DIGITALES A TRAVÉS DE LA OFICINA TÉCNICA RESPECTIVA?","o":["EL PROCESADO","EL IMPUTADO", RÍA DEL PUEBLO","SER ASISTIDO DESDE LOS ACTOS INICIALES POR UN ABOGADO DEFENSOR","SER ASISTIDO POR UN ASESOR LEGAL DEL PODER JUDICIAL"],"a":3,"u":"(ART: 71) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":768,"q":"LOS JUECES, LOS FISCALES O LA POLICÍA NACIONAL DEBEN HACER SABER AL IMPUTADO DE MANERA INMEDIATA Y COMPRENSIBLE, QUE TIENE DERECHO A:","o":["NEGARSE A MANIFESTAR RESPECTO A LOS MOTIVOS QUE DIO ORIGEN A SU DETENCIÓN","ABSTENERSE DE DECLARAR; Y, SI ACEPTA HACERLO, A QUE SU ABOGADO DEFENSOR ESTÉ PRESENTE","ABSTENERSE DE BRINDAR ENTREVISTAS; Y, SI ASÍ LO QUISIERA, DEBERÁ ESTAR PRESENTE SU ABOGADO DEFENSOR","ABSTENERSE DE EFECTUAR COMENTARIOS ADVERSOS A LA INVESTIGACIÓN DE LA POLICÍA NACIONAL","ABSTENERSE DE EFECTUAR COMENTARIOS ADVERSOS A LA INVESTIGACIÓN DEL MINISTERIO PÚBLICO"],"a":1,"u":"(ART: 71) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":769,"q":"LOS JUECES, LOS FISCALES O LA POLICÍA NACIONAL DEBEN HACER SABER AL IMPUTADO DE MANERA INMEDIATA Y COMPRENSIBLE QUE TIENE DERECHO A:","o":["QUE NO SE LE VIOLENTE FÍSICA NI PSICOLÓGICAMENTE","SER RESPETADO EN TODO MOMENTO, BRINDÁNDOSELE ALIMENTACIÓN COMPLETA Y ABRIGO","PODER ENTABLAR DIÁLOGO CON ALGÚN REPRESENTANTE DE LA CRUZ ROJA INTERNACIONAL","EXPRESAR SU MALESTAR A LA DEFENSORÍA DEL PUEBLO, SOBRE SU DETENCIÓN","QUE NO SE EMPLEE EN SU CONTRA MEDIOS COACTIVOS, INTIMIDATORIOS O CONTRARIOS A SU DIGNIDAD"],"a":4,"u":"(ART: 71) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":770,"q":"AL PROCESADO QUE ALTERE EL ORDEN EN UN ACTO PROCESAL, SE LE APERCIBIRÁ CON LA SUSPENSIÓN DE LA DILIGENCIA Y DE CONTINUARLA.","o":["CON LA SOLA INTERVENCIÓN DE SU ABOGADO DEFENSOR Y DEMÁS SUJETOS PROCESALES","CON LA SOLA INTERVENCIÓN DE SU ABOGADO DEFENSOR Y SIN LA PARTICIPACIÓN DE LOS SUJETOS PROCESALES","CON LA SOLA INTERVENCIÓN DE SU ABOGADO DEFENSOR Y UN REPRESENTANTE LEGAL","CON LA SOLA INTERVENCIÓN DE UN TESTIGO Y DEMÁS SUJETOS PROCESALES","CON LA SOLA INTERVENCIÓN DEL AGRAVIADO Y DEMÁS SUJETOS PROCESALES"],"a":0,"u":"(ART: 73) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":771,"q":"¿QUÉ SUCEDERÍA SI EL ABOGADO DEFENSOR SE SOLIDARIZA Y ABANDONA LA DILIGENCIA?","o":["SERÁ SUSTITUIDO POR UNO NOMBRADO DE PARTE","SERÁ SUSTITUIDO POR UNO NOMBRADO DE OFICIO","NO SERÁ SUSTITUIDO Y CONTINUARÁ EL ABOGADO DE OFICIO","NO SERÁ SUSTITUIDO POR UNO NOMBRADO POR EL MINISTERIO PÚBLICO","SERÁ SUSTITUIDO INMEDIATAMENTE."],"a":1,"u":"(ART: 73)** [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":772,"q":"CUANDO SE ESTABLEZCA LA MINORÍA DE EDAD DEL IMPUTADO, ¿QUIÉN PUEDE SOLICITAR AL JUEZ DE LA INVESTIGACIÓN PREPARATORIA, CORTE LA SECUELA DEL PROCESO Y PONGA AL ADOLESCENTE A DISPOSICIÓN DEL FISCAL DE FAMILIA?","o":["EL ABOGADO DEFENSOR","LOS FAMILIARES","EL FISCAL O CUALQUIERA DE LAS PARTES","EL REPRESENTANTE DE LA DEFENSORÍA DEL PUEBLO","EL JUEZ DE MENORES"],"a":2,"u":"(ART: 74) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":773,"q":"¿QUÉ ACCIONES DICTARÁ EL JUEZ CUANDO SE ACREDITA LA MINORÍA DE EDAD EN LA ETAPA INTERMEDIA O EN EL JUICIO ORAL, PREVIA AUDIENCIA Y CON LA INTERVENCIÓN DE LAS PARTES?","o":["DICTARÁ LOS PROVEÍDOS NECESARIOS","CONSULTARÁ SOBRE LA RESOLUCIÓN CORRESPONDIENTE","IMPARTIRÁ LAS DISPOSICIONES PERTINENTES","DICTARÁ LA RESOLUCIÓN CORRESPONDIENTE","NO DICTARÁ NINGUNA RESOLUCIÓN"],"a":3,"u":"(ART: 74) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":774,"q":"CUANDO SE ESTABLEZCA LA MINORÍA DE EDAD DEL IMPUTADO, EN TODOS LOS CASOS:","o":["SOLAMENTE EN ESTE CASO NO SE DEJARÁ A SALVO EL DERECHO DEL ACTOR CIVIL PARA QUE LO HAGA VALER EN OTRA VÍA ADMINISTRATIVA.","EN TODOS ESTOS CASOS SE DEJARÁ A SALVO EL DERECHO DEL ACTOR CIVIL PARA QUE LO HAGA VALER EN CUALQUIER VÍA.","EN NINGÚN CASO EL ACTOR CIVIL TIENE DERECHO PARA QUE LO HAGA VALER EN LA VÍA PERTINENTE.","NO SE DEJARÁ A SALVO EL DERECHO DEL ACTOR CIVIL PARA QUE LO HAGA PREVALECER EN LA ETAPA INTERMEDIA.","SE DEJARÁ A SALVO EL DERECHO DEL ACTOR CIVIL PARA QUE LO HAGA VALER EN LA VÍA PERTINENTE."],"a":4,"u":"(ART: 74) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":775,"q":"EL JUEZ, A REQUERIMIENTO DEL FISCAL O DE LAS DEMÁS PARTES, PREVIA CONSTATACIÓN, DECLARARÁ CONTUMAZ AL IMPUTADO CUANDO:","o":["NO OBEDEZCA, PESE A DESCONOCER DE SU EMISIÓN, UNA ORDEN DE DETENCIÓN O PRISIÓN","OBEDEZCA, AL TENER CONOCIMIENTO DE SU EMISIÓN, UNA ORDEN DE DETENCIÓN O PRISIÓN","DESACATE, PESE A TENER CONOCIMIENTO DE SU INDUCCIÓN, UNA ORDEN EN SU CONTRA O PRISIÓN","DESOBEDEZCA, PESE A SER CONSCIENTE DE SU EMISIÓN, UNA PAPELETA DE DETENCIÓN O PRIVATIVA DE LIBERTAD","NO OBEDEZCA, PESE A TENER CONOCIMIENTO DE SU EMISIÓN, UNA ORDEN DE DETENCIÓN O PRISIÓN."],"a":4,"u":"(ART: 79) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":776,"q":"EN CASO DE INIMPUTABILIDAD DEL PROCESADO, ¿CUÁNDO DISPONDRÁ EL JUEZ DE LA INVESTIGACIÓN PREPARATORIA LA PRÁCTICA DE UN EXAMEN POR UN PERITO ESPECIALIZADO?.","o":["SEGÚN EL ESTADO DE LA CAUSA, SOLAMENTE DISPONDRÁ A PEDIDO DE PARTE","SEGÚN EL ESTADO DE LA CAUSA, DISPONDRÁ, DE OFICIO O A PEDIDO DE PARTE","SEGÚN EL ESTADO DE SOBRESEIMIENTO, SOLAMENTE DISPONDRÁ DE OFICIO","SEGÚN EL ESTADO DE SOBRESEIMIENTO, SOLAMENTE DISPONDRÁ A PEDIDO DE PARTE","SEGÚN EL CASO DEL JUICIO"],"a":1,"u":"(ART: 75) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":777,"q":"RECIBIDO EL INFORME PERICIAL, PREVIA AUDIENCIA, CON INTERVENCIÓN DE LAS PARTES Y DEL PERITO, SI EL JUEZ CONSIDERA SI EXISTEN INDICIOS SUFICIENTES PARA ESTIMAR ACREDITADO EL ESTADO DE INIMPUTABILIDAD DEL PROCESADO:","o":["NO DICTARÁ RESOLUCIÓN NI PROCEDIMIENTO DE SEGURIDAD","DICTARÁ LA RESOLUCIÓN SOBRE EL RESULTADO DEL EXAMEN MÉDICO, INSTANDO LA INCOACIÓN DEL PROCEDIMIENTO DE SEGURIDAD","DICTARÁ LA RESOLUCIÓN CORRESPONDIENTE INSTANDO LA INCOACIÓN DEL PROCEDIMIENTO DE SEGURIDAD","DICTARÁ LA RESOLUCIÓN CORRESPONDIENTE INSTANDO LA COACCIÓN DEL INICIO DEL PROCEDIMIENTO","DICTARÁ LA RESOLUCIÓN PERTINENTE INSTANDO LA PLANIFICACIÓN DEL PROCEDIMIENTO DE SEGURIDAD"],"a":2,"u":"(ART: 75) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":778,"q":"¿EN QUÉ CONSISTE LA ANOMALÍA PSÍQUICA SOBREVENIDA?","o":["ANTES DE COMETER EL DELITO LE SOBREVIENE ANOMALÍA PSÍQUICA GRAVE AL IMPUTADO","DURANTE LA REALIZACIÓN DEL DELITO LE SOBREVIENE ANOMALÍA PSÍQUICA GRAVE AL IMPUTADO","CUANDO DESPUÉS DE COMETIDO EL DELITO LE SOBREVIENE ANOMALÍA PSÍQUICA GRAVE AL IMPUTADO","CUANDO DESPUÉS DE COMETIDO LA INFRACCIÓN LE SOBREVIENE ANOMALÍA PSÍQUICA AL PROCESADO","CUANDO DESPUÉS DE COMETIDO EL DELITO LE SOBREVIENE ANOMALÍA PSÍQUICA GRAVE AL AGRAVIADO"],"a":2,"u":"(ART: 76) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":779,"q":"ANOMALÍA PSÍQUICA SOBREVENIDA.- SI DEL ANÁLISIS DE LO ACTUADO, EL ÓRGANO JURISDICCIONAL ADVIERTE QUE EL IMPUTADO PRESENTA ANOMALÍA PSÍQUICA GRAVE QUE LE IMPIDE CONTINUAR CON LA CAUSA:","o":["CONSULTARÁ LA SUSPENSIÓN DEL PROCESO HASTA QUE EL TRATAMIENTO DE LA DOLENCIA HAGA POSIBLE REINICIARLO","DISPONDRÁ LA SUSPENSIÓN DEL PROCESADO HASTA QUE EL TRATAMIENTO DE LA DOLENCIA SEA POSIBLE INICIARLO","NO DISPONDRÁ LA SUSPENSIÓN DEL PROCESO Y CONTINUARÁ CON EL TRATAMIENTO DE LA DOLENCIA","DISPONDRÁ LA SUSPENSIÓN DEL PROCESO HASTA QUE EL TRATAMIENTO DE LA DOLENCIA HAGA POSIBLE REINICIARLO","DISPONDRÁ EL TRATAMIENTO HASTA QUE EL IMPUTADO SUPERE SU DOLENCIA"],"a":3,"u":"(ART: 76) [LIBRO PRIMERO] [SECCION IV] [TITULO II] [CAPITULO I]","m":1,"t":10},{"n":780,"q":"ANOMALÍA PSÍQUICA SOBREVENIDA.- ¿CUÁNDO SE IMPEDIRÁ LA DECLARACIÓN DEL IMPUTADO O EL JUICIO?","o":["CUANDO LO DISPONGA EL JUEZ DURANTE EL PROCESO SIN PERJUICIO DE QUE SE PROSIGA CON LA INVESTIGACIÓN DEL HECHO","CUANDO LO DISPONGA EL FISCAL DURANTE EL PROCESO SIN PERJUICIO DE QUE SE PROSIGA CON LA INVESTIGACIÓN DEL HECHO","CUANDO LO ORDENE EL FISCAL EN EL PROCESO SIN PERJUICIO DE QUE SE ":2,"u":"(ART: 389)** [LIBRO SEGUNDO] [TITULO XVIII] [CAPITULO II] [SECCION III]","m":1,"t":11},{"n":1076,"q":"EL MIEMBRO DE LA POLICÍA NACIONAL QUE ACEPTA O RECIBE DONATIVO, PROMESA O CUALQUIER OTRA VENTAJA O BENEFICIO, PARA SÍ O PARA OTRO, PARA REALIZAR U OMITIR UN ACTO EN VIOLACIÓN DE SUS OBLIGACIONES DERIVADAS DE LA FUNCIÓN POLICIAL O EL QUE LAS ACEPTA A CONSECUENCIA DE HABER FALTADO A ELLAS, COMETE DELITO DE:","o":["COHECHO PASIVO PROPIO.","COHECHO PASIVO ESPECÍFICO.","COHECHO PASIVO PROPIO EN EL EJERCICIO DE LA FUNCIÓN POLICIAL.","APROPIACIÓN ILÍCITA.","PECULADO."],"a":2,"u":"(ART: 395-A)** [LIBRO SEGUNDO] [TITULO XVIII] [CAPITULO II] [SECCION IV]","m":1,"t":11},{"n":1077,"q":"EL MIEMBRO DE LA POLICÍA NACIONAL O DEL SISTEMA PENITENCIARIO QUE ACEPTE O RECIBE DONATIVO, PROMESA O CUALQUIER OTRA VENTAJA O BENEFICIO INDEBIDO PARA REALIZAR U OMITIR UN ACTO PROPIO DE SU FUNCIÓN, SIN FALTAR A SU OBLIGACIÓN, O COMO CONSECUENCIA DEL ACTO YA REALIZADO U OMITIDO, COMETE DELITO DE:","o":["PECULADO.","COBRO INDEBIDO.","COHECHO PASIVO PROPIO EN EL EJERCICIO DE LA FUNCIÓN POLICIAL.","COHECHO PASIVO IMPROPIO EN EL EJERCICIO DE LA FUNCIÓN POLICIAL.","COHECHO PASIVO ESPECÍFICO."],"a":3,"u":"(ART: 395-B)** [LIBRO SEGUNDO] [TITULO XVIII] [CAPITULO II] [SECCION IV]","m":1,"t":11},{"n":1078,"q":"EL QUE, INVOCANDO O TENIENDO INFLUENCIAS REALES O SIMULADAS, RECIBE, HACE DAR O PROMETER PARA SÍ O PARA UN TERCERO, DONATIVO O PROMESA O CUALQUIER OTRA VENTAJA O BENEFICIO CON EL OFRECIMIENTO DE INTERCEDER ANTE UN FUNCIONARIO O SERVIDOR PÚBLICO QUE HA DE CONOCER, ESTÉ CONOCIENDO O HAYA CONOCIDO UN CASO JUDICIAL O ADMINISTRATIVO, COMETE DELITO DE:","o":["ENRIQUECIMIENTO ILÍCITO.","TRÁFICO DE INFLUENCIAS.","CONCUSIÓN.","PATROCINIO ILEGAL.","COBRO INDEBIDO."],"a":1,"u":"(ART: 400)** [LIBRO SEGUNDO] [TITULO XVIII] [CAPITULO II] [SECCION IV]","m":1,"t":11},{"n":1079,"q":"EL QUE INSERTA O HACE INSERTAR EN INSTRUMENTO PÚBLICO, DECLARACIONES FALSAS, CONCERNIENTES A HECHOS QUE DEBAN PROBARSE CON EL DOCUMENTO, CON EL OBJETO DE EMPLEARLO COMO SI LA DECLARACIÓN FUERA CONFORME A LA VERDAD, SI DE SU USO PUEDE RESULTAR ALGÚN PERJUICIO, COMETE DELITO:","o":["FALSIFICACIÓN DE DOCUMENTOS.","FALSEDAD GENÉRICA.","PREVARICATO.","FALSEDAD IDEOLÓGICA.","ENCUBRIMIENTO REAL."],"a":3,"u":"(ART: 428)** [LIBRO SEGUNDO] [TITULO XIX] [CAPITULO I]","m":1,"t":11},{"n":1080,"q":"EL QUE OBRA EN DEFENSA DE BIENES JURÍDICOS PROPIOS O DE TERCEROS, CON USO DE LA FUERZA, INCLUIDO EL USO DE LA FUERZA LETAL, SIEMPRE QUE CONCURRAN; SEÑALE LA ALTERNATIVA CORRECTA SEGÚN EL ARTÍCULO 20 DEL CÓDIGO PENAL:","o":["SOLO ESTÁ PERMITIDO CUANDO HAY RIESGO INMINENTE DE MUERTE PARA EL DEFENSOR.","AGRESIÓN ACTUAL, ILEGÍTIMA Y REAL; NECESIDAD RACIONAL DEL MEDIO EMPLEADO Y FALTA DE PROVOCACIÓN SUFICIENTE DE QUIEN HACE LA DEFENSA.","AGRESION ILEGÍTIMA Y REAL; PROPORCIONALIAD ENTRE EL MEDIO DE DEFENSA Y FALTA DE PROVOCACIÓN SUFICIENTE.","LA PROPORCIONALIDAD ENTRE EL MEDIO DE DEFENSA Y LA AGRESIÓN ES EL ÚNICO CRITERIO RELEVANTE.","EL DEFENSOR DEBE ESPERAR A SER ATACADO FÍSICAMENTE ANTES DE REPELER LA AGRESIÓN."],"a":1,"u":"(ART: (ART: 20)** Articulo 20.-Inimputabilidad)**","m":1,"t":11},{"n":1081,"q":"¿CUÁL ES EL CRITERIO QUE SE EXCLUYE PARA LA VALORARIZACIÓN DE LA NECESIDAD RACIONAL DEL MEDIO EMPLEADO, SEGÚN EL ARTÍCULO 20 DEL CÓDIGO PENAL:","o":["EL CRITERIO DE NECESIDAD DE MEDIOS.","EL CRITERIO DE PROPORCIONALIDAD DE MEDIOS.","EL CRITERIO DE LA INMEDIATEZ DE LA AGRESIÓN.","EL CRITERIO DE LA EXISTENCIA DE LESIONES RECÍPROCAS.","EL CRITERIO DEL PELIGRO POTENCIAL DEL DEFENSOR."],"a":1,"u":"(ART: (ART: 20)** Articulo 20.- Inimputabilidad)**","m":1,"t":11},{"n":1082,"q":"RESPECTO A LA FUERZA FÍSICA IRRESISTIBLE COMO CAUSA EXIMENTE PENAL, INDIQUE EL SUPUESTO CORRECTO:","o":["SÓLO EXIME CUANDO LA FUERZA PROVIENE DE LA NATURALEZA, NUNCA DE UN TERCERO.","EXIME DE RESPONSABILIDAD SIEMPRE QUE OBRA POR UNA FUERZA FÍSICA IRRESISTIBLE PROVENIENTE DE UN TERCERO O DE LA NATURALEZA.","EXIME DE RESPONSABILIDAD LA FUERZA DEBE SER MORAL Y NO FÍSICA.","LA FUERZA FÍSICA DEBE SER CONSENTIDA POR EL AGENTE.","EXIME DE RESPONSABILIDAD SIEMPRE QUE EL AGENTE PUDO RESISTIR LA FUERZA PERO DECIDIÓ NO HACERLO."],"a":1,"u":"(ART: (ART: 20)** Articulo 20.- Inimputabilidad)**","m":1,"t":11},{"n":1083,"q":"SEGÚN EL ARTÍCULO 22 DEL CÓDIGO PENAL, ¿EN QUÉ SUPUESTO NO PROCEDERÁ LA REDUCCIÓN DE LA PENA SEÑALADA PARA EL HECHO PUNIBLE COMETIDO POR UN AGENTE ENTRE DIECISÉIS Y MENOS DE VEINTIÚN AÑOS:","o":["CUANDO EL AGENTE INTEGRA UNA ORGANIZACIÓN CRIMINAL AL MOMENTO DEL HECHO.","CUANDO EL DELITO COMETIDO ES EL DE HOMICIDIO SIMPLE.","CUANDO EL AGENTE HA COMETIDO EL DELITO DE APOLOGÍA DE DELITO.","CUANDO EL AGENTE ES REINCIDENTE EN HURTO SIMPLE.","CUANDO EL DELITO COMETIDO ES TRÁFICO ILÍCITO DE DROGAS."],"a":0,"u":"(ART: (ART: 22)** Artículo 22.- Responsabilidad restringida por la edad)**","m":1,"t":11},{"n":1084,"q":"CONFORME AL ARTÍCULO 317, ¿QUÉ FINALIDAD DEBE PERSEGUIR UNA ORGANIZACIÓN CRIMINAL PARA SER CONSIDERADA COMO TAL BAJO EL TIPO PENAL:","o":["DIFUNDIR IDEOLOGÍAS RELIGIOSAS O POLÍTICAS EXTREMISTAS.","OBTENER, DIRECTA O INDIRECTAMENTE, UN BENEFICIO ECONÓMICO U OTRO DE ORDEN MATERIAL.","ELIMINAR LA COMPETENCIA EN EL MERCADO LABORAL.","CONSEGUIR INFLUENCIA EN ORGANIZACIONES SOCIALES SIN OBTENER BENEFICIOS MATERIALES.","REALIZAR ACTIVIDADES ALTRUISTAS MEDIANTE EL USO DE VIOLENCIA."],"a":1,"u":"(ART: (ART: 317)** Articulo 317.- Organizacion criminal)**","m":1,"t":11},{"n":1085,"q":"¿CUÁL DE LAS SIGUIENTES CIRCUNSTANCIAS PUEDE SER CONSIDERADA COMO ATENUANTE SEGÚN EL ARTÍCULO 46 DEL CÓDIGO PENAL PERUANO, EN TANTO NO SEA ELEMENTO CONSTITUTIVO DEL HECHO PUNIBLE, NI ESTÉ PREVISTA ESPECÍFICAMENTE PARA SANCIONARLO:","o":["EJECUTAR LA CONDUCTA PUNIBLE SOBRE RECURSOS PÚBLICOS","EL OBRAR POR MÓVILES NOBLES O ALTRUISTAS","REALIZAR LA CONDUCTA PUNIBLE ABUSANDO EL AGENTE DE SU CARGO","EJECUTAR LA CONDUCTA SOBRE BIENES DE UTILIDAD COMÚN","LA PLURALIDAD DE AGENTES QUE INTERVIENEN EN LA EJECUCIÓN"],"a":1,"u":"(ART: (ART: 46)** Articulo 46.- Circunstancias de atenuacion y agravacion)**","m":1,"t":11},{"n":1086,"q":"EL CÓDIGO PENAL, EN SU ARTÍCULO 46, DETERMINA UNA ATENUANTE SI EL IMPUTADO:","o":["REPARA VOLUNTARIAMENTE EL DAÑO OCASIONADO O LAS CONSECUENCIAS DERIVADAS DEL PELIGRO GENERADO","REALIZA LA CONDUCTA PUNIBLE EMPLEANDO MEDIOS ESPECIALMENTE PELIGROSOS","INTERVIENE CON PLURALIDAD DE AGENTES","ACTÚA ABUSANDO DE SU POSICIÓN ECONÓMICA","EJECUTA EL DELITO COMO PARTE DE UN GRUPO CRIMINAL"],"a":0,"u":"(ART: (ART: 46)** Articulo 46.- Circunstancias de atenuacion y agravacion)**","m":1,"t":11},{"n":1087,"q":"SELECCIONE UNA CIRCUNSTANCIA AGRAVANTE RELACIONADA CON LA CONDICIÓN DE LA VÍCTIMA SEGÚN EL ARTÍCULO 46:","o":["QUE LA VÍCTIMA SEA MENOR DE EDAD O ADULTO MAYOR EN SITUACIÓN DE ESPECIAL VULNERABILIDAD","QUE LA VÍCTIMA SE PRESENTE VOLUNTARIAMENTE ANTE LA AUTORIDAD","QUE LA VÍCTIMA PROCURE DISMINUIR LAS CONSECUENCIAS DEL DELITO","QUE LA VÍCTIMA TENGA ANTECEDENTES PENALES","QUE LA VÍCTIMA SEA FAMILIAR DEL IMPUTADO"],"a":0,"u":"(ART: (ART: 46)** Articulo 46.- Circunstancias de atenuacion y agravacion)**","m":1,"t":11},{"n":1088,"q":"¿CUÁL DE LAS SIGUIENTES CIRCUNSTANCIAS IMPLICA LA IMPOSICIÓN DE CADENA PERPETUA SEGÚN EL ARTÍCULO 129-Q DEL CÓDIGO PENAL PERUANO:","o":["CUANDO EL AGENTE ACTÚA EN CONCURSO CON OTRAS PERSONAS MAYORES DE EDAD.","CUANDO SE EMPLEA VIOLENCIA SIN MEDIACIÓN DE VÍNCULO FAMILIAR.","CUANDO EL AGENTE SE VALE DE SU POSICIÓN, CARGO O VÍNCULO FAMILIAR QUE LE OTORGA PARTICULAR AUTORIDAD SOBRE EL MENOR DE EDAD.","CUANDO EL MENOR COMETE UN DELITO DE HURTO SIMPLE POR INFLUENCIA DEL AGENTE.","CUANDO EL AGENTE ES REINCIDENTE EN DELITOS COMUNES DISTINTOS A LOS SEÑALADOS EN EL ARTÍCULO."],"a":2,"u":"(ART: (ART: 129-Q)** Artículo 129-Q.- Captacion de menores de edad para la comision de delitos)**","m":1,"t":11},{"n":1089,"q":"EL ARTÍCULO 129-Q DEL CÓDIGO PENAL SEÑALA QUE LA PENA AUMENTARÁ SI EL DELITO COMETIDO O INTENTADO POR EL MENOR ES:","o":["LESIONES PERSONALES GRAVES.","ROBO AGR E IMPLIQUE UNA SERIA AMENAZA PARA LA VIDA DURANTE LA COMISIÓN DE UN DELITO PARTICULARMENTE GRAVE.","CUANDO SE GENERE UNA SITUACIÓN DE PAZ Y TRANQUILIDAD COMO CONSECUENCIA DE LA COLABORACIÓN OFRECIDA POR LA PERSONA QUE VAYA A SER INTERVENIDA.","CUANDO SE PRODUZCA UNA SITUACIÓN QUE IMPLIQUE UNA MÍNIMA AMENAZA PARA LA VIDA DURANTE LA COMISIÓN DE UN DELITO PARTICULARMENTE LEVE.","CUANDO LA VIDA DE UNA PERSONA NO ES PUESTA EN RIESGO REAL, INMINENTE Y ACTUAL POR QUIEN SE ESTA FUGANDO."],"a":1,"u":"(texto: 8) (item: 184)** [TITULO II] [CAPITULO II]","m":1,"t":12},{"n":1125,"q":"¿EN QUÉ SITUACIÓN, EL PERSONAL DE LA POLICÍA NACIONAL DEL PERÚ, EXCEPCIONALMENTE, PODRÁ HACER USO DEL ARMA DE FUEGO:","o":["CUANDO SE GENERE UN PELIGRO REAL E INMINENTE DE MUERTE O LESIONES GRAVES COMO CONSECUENCIA DE LA RESISTENCIA OFRECIDA POR LA PERSONA QUE VAYA A SER DETENIDA.","EN DEFENSA PROPIA O DE OTRAS PERSONAS EN CASO DE QUE NO EXISTA PELIGRO REAL E INMINENTE DE MUERTE O LESIONES GRAVES.","CUANDO SE GENERE UN PELIGRO REAL E INMINENTE DE MUERTE O LESIONES MUY GRAVES COMO CONSECUENCIA DE LA RESISTENCIA OFRECIDA POR LA PERSONA QUE VAYA A SER INTERVENIDA.","CUANDO SE GENERE UNA SITUACIÓN DE PAZ Y TRANQUILIDAD COMO CONSECUENCIA DE LA COLABORACIÓN OFRECIDA POR LA PERSONA QUE VAYA A SER INTERVENIDA.","CUANDO SE GENERE UNA SITUACIÓN REAL E INMINENTE DE LESIONES COMO CONSECUENCIA DE LA RESISTENCIA OFRECIDA POR LA PERSONA QUE VAYA A SER INTERVENIDA."],"a":0,"u":"(texto: 8) (item: 184)** [TITULO II] [CAPITULO II]","m":1,"t":12},{"n":1126,"q":"¿EN QUÉ SITUACIÓN, EL PERSONAL DE LA POLICÍA NACIONAL DEL PERÚ, EXCEPCIONALMENTE, PODRÁ HACER USO DEL ARMA DE FUEGO:","o":["CUANDO LA VIDA DE UNA PERSONA NO ES PUESTA EN RIESGO REAL Y ACTUAL POR QUIEN ESTA INTERVENIDO.","CUANDO UNA PERSONA ES PUESTA EN RIESGO REAL E INMINENTE POR QUIEN VA A SER INTERVENIDO.","EN DEFENSA PROPIA O DE OTRAS PERSONAS EN CASO DE QUE NO EXISTA PELIGRO REAL E INMINENTE DE MUERTE O LESIONES GRAVES.","CUANDO LA VIDA DE UNA PERSONA ES PUESTA EN RIESGO REAL, INMINENTE Y ACTUAL POR QUIEN SE ESTA FUGANDO.","CUANDO LA VIDA DE UNA PERSONA ES PUESTA EN RIESGO REAL, INMINENTE Y ACTUAL."],"a":3,"u":"(texto: 8) (item: 184)** [TITULO II] [CAPITULO II]","m":1,"t":12},{"n":1127,"q":"¿EN QUÉ SITUACIÓN, EL PERSONAL DE LA POLICÍA NACIONAL DEL PERÚ, EXCEPCIONALMENTE, PODRÁ HACER USO DEL ARMA DE FUEGO:","o":["CUANDO SE GENERE UN PELIGRO REAL O INMINENTE DE MUERTE DEL PERSONAL POLICIAL U OTRA PERSONA, POR LA ACCIÓN DE QUIEN PARTICIPA DE UNA REUNIÓN TUMULTUARIA VIOLENTA.","CUANDO LA VIDA DE UNA PERSONA ES PUESTA EN RIESGO REAL, INMINENTE Y ACTUAL POR QUIEN ESTA COLABORANDO.","CUANDO SE GENERE UN PELIGRO REAL O INMINENTE DE MUERTE DEL PERSONAL POLICIAL U OTRA PERSONA, POR LA ACCIÓN DE QUIEN PARTICIPA DE UNA REUNIÓN TUMULTUARIA ACTIVA.","CUANDO SE GENERE UNA SITUACIÓN DE PAZ Y TRANQUILIDAD COMO CONSECUENCIA DE LA COLABORACIÓN OFRECIDA POR LA PERSONA QUE VAYA A SER INTERVENIDA.","CUANDO SE GENERE UN CLIMA DE PAZ Y TRANQUILIDAD DEL PERSONAL POLICIAL U OTRA PERSONA, POR LA ACCIÓN DE QUIEN PARTICIPA DE UNA REUNIÓN TUMULTUARIA PACÍFICA."],"a":0,"u":"(texto: 8) (item: 184)** [TITULO II] [CAPITULO II]","m":1,"t":12},{"n":1128,"q":"CON POSTERIORIDAD AL USO DE LA FUERZA EL PERSONAL DE LA POLICÍA NACIONAL DEBERÁ ADOPTAR LAS MEDIDAS NECESARIAS PARA COMUNICAR LO SUCEDIDO A LOS FAMILIARES DE LAS PERSONAS FALLECIDAS, HERIDAS O AFECTADAS O A AQUELLAS QUE ESTAS ÚLTIMAS INDIQUEN, SALVO QUE, SEÑALE LO CORRECTO:","o":["EXISTAN CIRCUNSTANCIAS QUE NO IMPIDAN SU REALIZACIÓN.","NO EXISTAN CIRCUNSTANCIAS QUE IMPIDAN SU REALIZACIÓN.","SE ENCUENTREN EN UNA ZONA PELIGROSA.","NO CUENTEN CON EQUIPOS DE COMUNICACIÓN.","EXISTAN CIRCUNSTANCIAS QUE IMPIDAN SU REALIZACIÓN."],"a":4,"u":"(texto: 9) (item: 184)** [TITULO II] [CAPITULO II]","m":1,"t":12},{"n":1129,"q":"CON POSTERIORIDAD AL USO DE LA FUERZA EL PERSONAL DE LA POLICÍA NACIONAL DEBERÁ PRESENTAR UN INFORME A LA UNIDAD POLICIAL CORRESPONDIENTE INDICANDO LAS CIRCUNSTANCIAS, LOS MEDIOS EMPLEADOS, E  USO DE LA FUERZA, EL PERSONAL DE LA POLICÍA NACIONAL DEL PERÚ TIENE DERECHO A:","o":["RECIBIR FORMACIÓN, CAPACITACIÓN Y ENTRENAMIENTO PERMANENTE DE DEFENSA PERSONAL EN TODOS LOS NIVELES EDUCATIVOS.","RECIBIR FORMACIÓN, CAPACITACIÓN Y ENTRENAMIENTO PERMANENTE SOBRE EL USO INADECUADO DE LA FUERZA EN TODOS LOS NIVELES EDUCATIVOS, EN DERECHOS HUMANOS.","RECIBIR FORMACIÓN, ESPECIALIZACIÓN Y ENTRENAMIENTO PERMANENTE SOBRE EL USO DE LA FUERZA EN UN NIVEL EDUCATIVO.","RECIBIR FORMACIÓN, CAPACITACIÓN Y ENTRENAMIENTO PERMANENTE SOBRE EL USO DE LA FUERZA EN TODOS LOS NIVELES EDUCATIVOS, EN MATERIA DE DERECHOS HUMANOS.","ACATAR DISPOSICIONES U ORDENES SUPERIORES PARA EL USO DE LA FUERZA CUANDO ESTAS SEAN MANIFIESTAMENTE ILÍCITAS O ARBITRARIAS."],"a":3,"u":"(texto: 10) (item: 184)** [TITULO III] [CAPITULO II]","m":1,"t":12},{"n":1133,"q":"EN EL EJERCICIO DE SU FUNCIÓN RELACIONADA AL USO DE LA FUERZA, EL PERSONAL DE LA POLICÍA NACIONAL DEL PERÚ TIENE DERECHO A:","o":["LA ASIGNACIÓN DE ARMAMENTO, VESTUARIO Y EQUIPO QUE GARANTICEN EL USO ADECUADO DEL MATERIAL.","LA ASIGNACIÓN DE ARMAMENTO, VESTUARIO Y EQUIPO QUE GARANTICEN EL USO ADECUADO DEL EQUIPO.","LA ASIGNACIÓN DE ARMAMENTO, VESTUARIO Y EQUIPO QUE GARANTICEN EL USO ADECUADO DE LA FUERZA.","CUANDO AL USAR LA FUERZA SE OCASIONARA LESIONES O MUERTE, SEA ASESORADO POR UN ABOGADO PARTICULAR.","LA ASIGNACIÓN DE ARMAMENTO, VESTUARIO Y EQUIPO QUE IMPIDAN EL USO ADECUADO DE LA FUERZA."],"a":2,"u":"(texto: 10) (item: 184)** [TITULO III] [CAPITULO II]","m":1,"t":12},{"n":1134,"q":"EN EL EJERCICIO DE SU FUNCIÓN RELACIONADA AL USO DE LA FUERZA, EL PERSONAL DE LA POLICÍA NACIONAL DEL PERÚ TIENE DERECHO A:","o":["RECIBIR UNA INDEMNIZACIÓN EN CASO DE LESIONES GRAVES O MUERTE.","RECIBIR TRATAMIENTO Y ASISTENCIA MÉDICA, POR CUENTA DEL ESTADO CUANDO RESULTE AFECTADO EN CUMPLIMIENTO DE SU DEBER.","RECIBIR TRATAMIENTO Y ASISTENCIA MÉDICA, POR CUENTA DEL ESTADO CUANDO RESULTE AFECTADO EN CUMPLIMIENTO DE SU DERECHO.","RESPETO DE SUS DERECHOS FUNDAMENTALES.","LA ASIGNACIÓN DE ARMAMENTO, VESTUARIO Y EQUIPO QUE GARANTICEN EL USO INADECUADO DE LA FUERZA."],"a":1,"u":"(texto: 10) (item: 184)** [TITULO III] [CAPITULO II]","m":1,"t":12},{"n":1135,"q":"EN EL EJERCICIO DE SU FUNCIÓN RELACIONADA AL USO DE LA FUERZA, EL PERSONAL DE LA POLICÍA NACIONAL DEL PERÚ TIENE DERECHO A:","o":["RECIBIR ORIENTACIÓN PSICOLÓGICA POR CUENTA DEL ESTADO PARA SOBRELLEVAR LAS TENSIONES GENERADAS POR EL USO DE LA FUERZA.","RECIBIR ATENCIÓN LEGAL Y MÉDICA, POR CUENTA DEL ESTADO CUANDO RESULTE AFECTADO EN CUMPLIMIENTO DE SU DEBER.","RECIBIR ORIENTACIÓN PSICOLÓGICA POR CUENTA PROPIA PARA SOBRELLEVAR LAS TENSIONES GENERADAS POR EL USO DE LA FUERZA.","LA ASIGNACIÓN DE ARMAMENTO, VESTUARIO Y EQUIPO QUE GARANTICEN EL USO INADECUADO DE LA FUERZA.","RECIBIR ORIENTACIÓN POLÍTICA POR CUENTA DEL ESTADO PARA SOBRELLEVAR LAS TENSIONES GENERADAS POR EL USO DE LA FUERZA."],"a":0,"u":"(texto: 10) (item: 184)** [TITULO III] [CAPITULO II]","m":1,"t":12},{"n":1136,"q":"EL FORTALECER LA LUCHA CONTRA EL TRÁFICO ILÍCITO DE DROGAS - TID EN SUS DIVERSAS MANIFESTACIONES, MEDIANTE LA PREVENCIÓN, INVESTIGACIÓN Y COMBATE DE DICHO DELITO; ASÍ COMO EL APOYO A LA REDUCCIÓN DE LOS CULTIVOS ILEGALES DE HOJA DE COCA. CORRESPONDE A:.","o":["ALCANCE.","OBJETO.","FINALIDAD.","MISIÓN.","VISIÓN."],"a":1,"u":"(texto: 1)** [CAPITULO I]","m":1,"t":13},{"n":1137,"q":"¿QUIÉN CONDUCE Y ARTICULA LA POLÍTICA NACIONAL CONTRA LAS DROGAS CON LOS SECTORES E INSTITUCIONES EN LA LUCHA CONTRA EL TID, CONFORME A LEY?.","o":["CONABI.","ENACO.","POLICÍA NACIONAL DEL PERÚ.","DEVIDA.","CEDRO."],"a":3,"u":"(texto: 2)** [CAPITULO I]","m":1,"t":13},{"n":1138,"q":"¿QUIÉN CONDUCE Y SUPERVISA LAS POLÍTICAS SECTORIALES EN MATERIA DE LUCHA CONTRA LAS DROGAS, INSUMOS QUÍMICOS Y PRODUCTOS FISCALIZADOS DECOMISADOS POR TRÁFICO ILÍCITO DE DROGAS, ERRADICACIÓN DE LOS CULTIVOS ILEGALES Y DESTRUCCIÓN DE DROGAS ILEGALES DECOMISADAS?.","o":["DEVIDA.","POLICÍA NACIONAL DEL PERÚ.","MINISTERIO DEL INTERIOR.","MINISTERI PRESENTE CONCEPTO CORRESPONDE A:","o":["COMISO","HALLAZGO","CADENA DE CUSTODIA","INCAUTACIÓN","INTERVENCIÓN POLICIAL"],"a":1,"u":"PROTOCOLO DE ACTUACIÓN INTERINSTITUCIONAL PARA LA APLICACIÓN DE LA INCAUTACIÓN, COMISIÓN, HALLAZGO Y CADENA DE CUSTODIA. CONCEPTO DE HALLAZGO","m":1,"t":17},{"n":1324,"q":"ES EL PROCEDIMIENTO DESTINADO A GARANTIZAR LA INDIVIDUALIZACIÓN, SEGURIDAD Y PRESERVACIÓN DE LOS ELEMENTOS MATERIALES Y EVIDENCIAS, RECOLECTADOS DE ACUERDO A SU NATURALEZA O INCORPORADOS EN TODA INVESTIGACIÓN DE UN HECHO PUNIBLE, DESTINADOS A GARANTIZAR SU AUTENTICIDAD, PARA LOS EFECTOS DEL PROCESO. LAS ACTAS, RÓTULOS, FORMULARIOS Y EMBALAJES FORMAN PARTE DE LA CADENA DE CUSTODIA. EL PRESENTE CONCEPTO CORRESPONDE A:","o":["COMISO","HALLAZGO","CADENA DE CUSTODIA","INCAUTACIÓN","INTERVENCIÓN POLICIAL"],"a":2,"u":"PROTOCOLO DE ACTUACIÓN INTERINSTITUCIONAL PARA LA APLICACIÓN DE LA INCAUTACIÓN, COMISIÓN, HALLAZGO Y CADENA DE CUSTODIA. CONCEPTO DE CADENA DE CUSTODIA","m":1,"t":17},{"n":1325,"q":"FORTALECER LA ACTUACIÓN INTERINSTITUCIONAL DE LOS OPERADORES DEL SISTEMA DE ADMINISTRACIÓN DE JUSTICIA PENAL DURANTE LOS PROCEDIMIENTOS DE INCAUTACIÓN, COMISO, HALLAZGO Y CADENA DE CUSTODIA. CORRESPONDE A:","o":["FINALIDAD","ALCANCE","OBJETO","FINES","LOGROS"],"a":2,"u":"PROTOCOLO DE ACTUACIÓN INTERINSTITUCIONAL PARA LA APLICACIÓN DE LA INCAUTACIÓN, COMISIÓN, HALLAZGO Y CADENA DE CUSTODIA. OBJETO","m":1,"t":17},{"n":1326,"q":"EL PERSONAL POLICIAL INTERVINIENTE LEVANTARÁ EL ACTA DE INCAUTACIÓN, DONDE SE DETALLARÁN E INDIVIDUALIZARÁN LOS BIENES OBJETO DE INCAUTACIÓN. SEGUIDAMENTE, SE INICIARÁ EL PROCEDIMIENTO DE: (MARQUE LA ALTERNATIVA CORRECTA)","o":["CADENA DE CUSTODIA DE LOS BIENES INCAUTADOS","INSPECCIÓN TÉCNICO POLICIAL","COMUNICAR AL JUEZ DE LA INVESTIGACIÓN PREPARATORIA","COMUNICAR A LOS PERITOS","COMUNICAR AL COMANDO POLICIAL"],"a":0,"u":"PROTOCOLO DE ACTUACIÓN INTERINSTITUCIONAL PARA LA APLICACIÓN DE LA INCAUTACIÓN, COMISIÓN, HALLAZGO Y CADENA DE CUSTODIA. INCAUTACIÓN REALIZADA EN UNA INTERVENCIÓN EN FLAGRANCIA","m":1,"t":17},{"n":1327,"q":"ES TODO ESPACIO FÍSICO, INCLUIDAS LAS ZONAS ADYACENTES, DONDE PRESUNTAMENTE SE HA PERPETRADO O SE HA DEJADO RASTROS DE UNO O MÁS HECHOS PUNIBLES, Y DONDE SE HALLAN INDICIOS Y EVIDENCIAS RELACIONADAS CON EL HECHO A INVESTIGAR. EL PRESENTE CONCEPTO CORRESPONDE A:","o":["LUGAR DE INTERVENCIÓN","ESCENA ABIERTA","ESCENA DEL CRIMEN","ESCENA CERRADA","ESCENA MIXTA"],"a":2,"u":"PROTOCOLO DE ACTUACIÓN INTERINSTITUCIONAL DE PROTECCIÓN E INVESTIGACIÓN DE LA ESCENA DEL CRIMEN. CONCEPTO DE ESCENA DEL CRIMEN","m":1,"t":17},{"n":1328,"q":"PARA EL AISLAMIENTO DEBERÁN EMPLEAR UN MECANISMO IDÓNEO PARA SU DEMARCACIÓN Y ACORDONAMIENTO (CINTA PLÁSTICA, CORDELES, ETC.), DEFINIENDO ADECUADAMENTE SUS LÍMITES Y… (MARQUE LA ALTERNATIVA CORRECTA)","o":["SE REALIZA LA INSPECCIÓN TÉCNICO POLICIAL","SE REALIZA IMÁGENES FOTOGRÁFICAS","ESTABLECIENDO LAS VÍAS DE ENTRADA Y SALIDA DE LA ESCENA AISLADA","SE COMUNICA AL JEFE DE UNIDAD","SE COMUNICA AL JUEZ"],"a":2,"u":"PROTOCOLO DE ACTUACIÓN INTERINSTITUCIONAL DE PROTECCIÓN E INVESTIGACIÓN DE LA ESCENA DEL CRIMEN. PROTECCIÓN DE LA ESCENA","m":1,"t":17},{"n":1329,"q":"EL EQUIPO QUE TENDRÁ A SU CARGO EL PROCESAMIENTO DE LA ESCENA, ESTARÁ CONFORMADO POR: (MARQUE LA ALTERNATIVA CORRECTA)","o":["EL REPRESENTANTE DEL MINISTERIO PÚBLICO","EL REPRESENTANTE DEL PODER JUDICIAL","LOS EFECTIVOS POLICIALES DEL SISTEMA DE INTELIGENCIA POLICIAL","EL PRESENTANTE DE LOS AGRAVIADOS","EFECTIVOS POLICIALES DEL SISTEMA CRIMINALÍSTICO POLICIAL"],"a":4,"u":"PROTOCOLO DE ACTUACIÓN INTERINSTITUCIONAL DE PROTECCIÓN E INVESTIGACIÓN DE LA ESCENA DEL CRIMEN. PROCESAMIENTO E INVESTIGACIÓN DE LA ESCENA DEL CRIMEN","m":1,"t":17},{"n":1330,"q":"EN CASO DE EXISTIR UN SOSPECHOSO, EL PERSONAL POLICIAL POLICÍA TOMARÁ EL CONTROL DE DICHA PERSONA TOMANDO LAS MEDIDAS DE SEGURIDAD CORRESPONDIENTES, A FIN DE EVITAR SU FUGA; DE SER EL CASO, … (MARQUE LA ALTERNATIVA CORRECTA)","o":["PROCEDERÁ A DETENERLO","INDAGAR SUS ANTECEDENTES","LO PONDRÁ A DISPOSICIÓN DEL FISCAL DE TURNO","LO PONDRÁ A DISPOSICIÓN DE LA UNIDAD POLICIAL MÁS CERCANA","LO IDENTIFICARÁ PLENAMENTE"],"a":0,"u":"PROTOCOLO DE ACTUACIÓN INTERINSTITUCIONAL DE PROTECCIÓN E INVESTIGACIÓN DE LA ESCENA DEL CRIMEN. PROCESAMIENTO E INVESTIGACIÓN DE LA ESCENA DEL CRIMEN","m":1,"t":17},{"n":1331,"q":"¿CUÁL ES EL ÁMBITO DE ACTUACIÓN JURISDICCIONAL DE LA INVESTIGACIÓN REALIZADA POR LA POLICÍA NACIONAL DEL PERÚ BAJO LA CONDUCCIÓN JURÍDICA DEL MINISTERIO PÚBLICO SEGÚN LA MODIFICACIÓN DE LA LEY 32130:","o":["LA INVESTIGACIÓN POLICIAL TIENE CARÁCTER JURISDICCIONAL PLENO DESDE SU INICIO, PERMITIENDO A LA POLICÍA NACIONAL RESOLVER ASPECTOS SUSTANTIVOS DEL PROCESO PENAL.","LA INVESTIGACIÓN POLICIAL, BAJO LA CONDUCCIÓN DEL MINISTERIO DEL INTERIOR, ADQUIERE CARÁCTER JURISDICCIONAL ÚNICAMENTE EN CASOS DE FLAGRANCIA DELICTIVA.","LA INVESTIGACIÓN POLICIAL, BAJO CONDUCCIÓN DEL MINISTERIO PÚBLICO, NO TIENE CARÁCTER JURISDICCIONAL, DEBIENDO REQUERIRSE DECISIÓN JURISDICCIONAL AL ÓRGANO COMPETENTE CUANDO SEA INDISPENSABLE.","LA INVESTIGACIÓN POLICIAL ES DE NATURALEZA JURISDICCIONAL SOLO CUANDO INTERVIENEN PERITOS EXTERNOS DESIGNADOS POR EL JUEZ PENAL.","LA INVESTIGACIÓN POLICIAL Y LA FISCALÍA COMPARTEN COMPETENCIA JURISDICCIONAL EN IGUALDAD DE CONDICIONES DURANTE TODA LA ETAPA DE INVESTIGACIÓN PRELIMINAR."],"a":2,"u":"(texto: (ART: UNICO)**Articulo IV. Titular de la accion Penal)**","m":1,"t":18},{"n":1332,"q":"SEGÚN LA LEY 32130, ¿CUÁL ES LA FUNCIÓN PRIMORDIAL DEL MINISTERIO PÚBLICO EN RELACIÓN CON LA POLICÍA NACIONAL DURANTE LA INVESTIGACIÓN PRELIMINAR DE UN DELITO:","o":["EMITIR RESOLUCIONES JURISDICCIONALES REEMPLAZANDO AL JUEZ PENAL EN ACTOS DE URGENCIA.","DIRIGIR JURÍDICAMENTE LA INVESTIGACIÓN ORIENTANDO LEGALMENTE LAS ACCIONES DE LA POLICÍA NACIONAL DEL PERÚ DENTRO DE LOS PARÁMETROS DE LA LEY.","REALIZAR DE MANERA INDEPENDIENTE LA INTERVENCIÓN POLICIAL SIN COORDINACIÓN INTERINSTITUCIONAL.","SUPERVISAR ÚNICAMENTE LA RECOLECCIÓN DE PRUEBAS FÍSICAS Y DOCUMENTALES SIN INDAGAR SOBRE LA INOCENCIA DEL IMPUTADO.","DESIGNAR A LOS ABOGADOS DEFENSORES PÚBLICOS EN TODOS LOS CASOS QUE INVESTIGUE LA POLICÍA."],"a":1,"u":"(texto: (ART: UNICO)**Articulo IV. Titular de la accion Penal)**","m":1,"t":18},{"n":1333,"q":"DE ACUERDO CON LA LEY 32130, ¿CUÁL ES LA RELACIÓN JERÁRQUICA Y FUNCIONAL ENTRE EL MINISTERIO PÚBLICO Y LA POLICÍA NACIONAL EN EL MARCO DE LA INVESTIGACIÓN DEL DELITO:","o":["LA POLICÍA NACIONAL DIRIGE AUTÓNOMAMENTE LA INVESTIGACIÓN Y EL MINISTERIO PÚBLICO SOLO REVISA EL INFORME FINAL.","LA POLICÍA NACIONAL EJERCE INICIATIVA PLENA EN LA PRODUCCIÓN DE PRUEBAS Y EL MINISTERIO PÚBLICO SE LIMITA A AUTORIZARLAS RETROACTIVAMENTE.","EL MINISTERIO PÚBLICO ASUME LA CONDUCCIÓN JURÍDICA DE LA INVESTIGACIÓN Y LA POLICÍA NACIONAL REALIZA LA INVESTIGACIÓN PRELIMINAR CONFORME A SU LEYES Y REGLAMENTOS.","AMBOS ÓRGANOS ACTÚAN EN PIE DE IGUALDAD EN LA TOMA DE DECISIONES JURÍDICAS DURANTE LA INVESTIGACIÓN PRELIMINAR.","LA POLICÍA NACIONAL SOLO INTERVIENE CUANDO EL JUEZ PENAL LO AUTORIZA, ACTUANDO BAJO CONTROL JUDICIAL DIRECTO."],"a":2,"u":"(texto: (ART: UNICO)**Articulo IV. Titular de la accion Penal)**","m":1,"t":18},{"n":1334,"q":"CONFORME AL ARTÍCULO 60 DEL CÓDIGO PROCESAL PENAL TRAS LA MODIFICACIÓN POR LA LEY 32130, ¿BAJO QUÉ PRINCIPIO DEBE EL FISCAL CONDUCIR LA INVESTIGACIÓN PREPARATORIA DEL DELITO:","o":["BAJO EL PRINCIPIO DE OPORTUNIDAD, PROMOVIENDO LA CONCILIACIÓN ENTRE LAS PARTES.","BAJO EL PRINCIPIO DE LEGALIDAD, ASEGURANDO LA CORRECTA APLICACIÓN DE LA NORMA.","BAJO EL PRINCIPIO DE ARBITRARIEDAD, ACTUANDO SEGÚN SU PROPIO CRITERIO.","BAJO EL PRINCIPIO DE EJECUCIÓN DIRECTA Y MATERIAL DE LAS ACCIONES POLICIALES.","BAJO EL PRINCIPIO DE AUTONOMÍA ABSOLUTA DE LA POLICÍA NACIONAL DEL PERÚ SIN INTERVENCIÓN DEL MINISTERIO PÚBLICO."],"a":1,"u":"(texto: (ART: UNICO)**Articulo 60. Funciones)**","m":1,"t":18},{"n":1335,"q":"¿CUÁL ES EL PLAZO MÁXIMO QUE TIENE EL FISCAL PARA DISPONER EL INICIO DE LA INVESTIGACIÓN PRELIMINAR EN CASO DE DELITOS DE TRÁFICO ILÍCITO DE DROGAS, TERRORISMO, SICARIATO, EXTORSIÓN, SECUESTRO, FEMINICIDIO Y CRIMINALIDAD ORGANIZADA:","o":["DOCE HORAS","TREINTA Y SEIS HORAS","CUARENTA Y OCHO HORAS","VEINTICUATRO HORAS","SETENTA Y DOS HORAS"],"a":3,"u":"(texto: (ART: UNICO)**Articulo 61. Atribuciones y obligaciones)**","m":1,"t":18},{"n":1336,"q":"¿CUÁL DE LAS SIGUIENTES ACCIONES ES UNA ATRIBUCIÓN Y/O OBLIGACION DIRECTA DEL FISCAL, CONFORME AL ARTÍCULO 61 DE LA PRESENTE LEY:","o":["EMITIR SENTENCIAS DE PRIMERA INSTANCIA","SOLICITAR AL JUEZ LAS MEDIDAS QUE CONSIDERE NECESARIAS CUANDO CORRESPONDA HACERLO","ORDENAR LA DETENCIÓN SIN INTERVENCIÓN JUDICIAL","OTORGAR PERMISOS DE LIBERTAD PROVISORIA","EJERCER FUNCIONES DE DEFENSOR PÚBLICO"],"a":1,"u":"(texto: (ART: UNICO)**Articulo 61. Atribuciones y obligaciones)**","m":1,"t":18},{"n":1337,"q":"DE ACUERDO CON EL ARTÍCULO 65, CUANDO EL FISCAL DISPONE EL INICIO DE LA INVESTIGACIÓN PRELIMINAR, ¿QUÉ DEBE PRECISARSE NECESARIAMENTE?:","o":["EL OBJETO, LOS PLAZOS Y LAS FORMALIDADES ESPECÍFICAS APLICABLES.","LA DESIGNACIÓN DE UN PERITO OFICIAL.","EL MONTO DE LAS REPARACIONES CIVILES.","EL JUEZ QUE SUPERVISARÁ LA INVESTIGACIÓN.","EL PRONUNCIAMIENTO SOBRE LA CULPABILIDAD DEL IMPUTADO."],"a":0,"u":"(texto: (ART: UNICO)** Articulo 65. La investigacion del delito destinada a ejercitar la accion penal)**","m":1,"t":18},{"n":1338,"q":"SEGÚN LA MODIFICACIÓN INTRODUCIDA POR LA LEY 32130, ¿A QUIÉN CORRESPONDE DEFINIR LA ESTRATEGIA OPERATIVA EN LA INVESTIGACIÓN DEL DELITO?:","o":["AL JUEZ DE GARANTÍAS.","AL FISCAL EN TODO MOMENTO Y SIN EXCEPCIÓN.","A LA POLICÍA NACIONAL DEL PERÚ.","A LA CORTE SUPERIOR DE JUSTICIA.","A LA DEFENSA TÉCNICA DEL IMPUTADO."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 65. La investigacion del delito destinada a ejercitar la accion penal)**","m":1,"t":18},{"n":1339,"q":"¿QUÉ ASPECTO DEBEN GARANTIZAR TANTO EL FISCAL COMO LA POLICÍA NACIONAL DEL PERÚ DURANTE LA INVESTIGACIÓN DEL DELITO, SEGÚN EL ARTÍCULO 65 DE LA LEY N°32130?:","o":["EL RESARCIMIENTO ECONÓMICO DE LA VÍCTIMA.","EL DERECHO DE DEFENSA DEL IMPUTADO Y SUS DEMAS DERECHOS FUNDAMENTALES.","LA OBTENCIÓN DE PRUEBAS SIN LÍMITES LEGALES CUANDO SE TRATE DE DELITOS GRAVES.","LA PARTICIPACIÓN DE LA PRENSA EN TODAS LAS DILIGENCIAS.","EL SECRETO ABSOLUTO DE LAS ACTUACIONES."],"a":1,"u":"(texto: (ART: UNICO)** Articulo 65. La investigacion del delito destinada a ejercitar la accion penal)**","m":1,"t":18},{"n":1340,"q":"¿CUÁL ES LA RELACIÓN ENTRE LA ESTRATEGIA JURÍDICA Y LA ESTRATEGIA OPERATIVA SEGÚN LA LEY 32130?:","o":["AMBAS ESTRATEGIAS SON DIRIGIDAS POR LA POLICÍA NACIONAL DEL PERÚ.","LA ESTRATEGIA JURÍDICA ES COMPETENCIA DEL FISCAL Y LA OPERATIVA DE LA POLICÍA, PERO DEBEN SER PROGRAMADAS Y COORDINADAS EN CONJUNTO.","LA ESTRATEGIA JURÍDICA Y LA OPERATIVA SÓLO LAS DEFINE EL JUEZ PENAL.","EL FISCAL DEFINE LA OPERATIVA Y LA POLICÍA LA JURÍDICA.","AMBAS ESTRATEGIAS NO REQUIEREN COORDINACIÓN."],"a":1,"u":"(texto: (ART: UNICO)** Articulo 65. La investigacion del delito destinada a ejercitar la accion penal)**","m":1,"t":18},{"n":1341,"q":"EN LA INVESTIGACIÓN DEL DELITO CONFORME AL ARTÍCULO 65, ¿QUÉ DEBE HACER EL FISCAL RESPECTO A LAS DILIGENCIAS PRACTICADAS POR LA POLICÍA NACIONAL DEL PERÚ?:","o":["REGISTRAR EN AUDIO Y VIDEO TODAS LAS DILIGENCIAS.","REALIZAR LAS FORMALIDADES ESPECIFICAS QUE DEBEN REUNIR LOS ACTOS DE INVESTIGACION PARA GARANTIZAR SU VALIDEZ.","NO INTERVENIR BAJO NINGUNA CIRCUNSTANCIA.","SOLICITAR LA APROBACIÓN DE LA CORTE SUPREMA ANTES DE CADA DILIGENCIA.","ADMINISTRAR LOS FONDOS PARA QUE SE REALICEN LAS DILIGENCIAS."],"a":1,"u":"(texto: (ART: UNICO)** Articulo 65. La investigacion del delito destinada a ejercitar la accion penal)**","m":1,"t":18},{"n":1342,"q":"¿QUÉ OCURRE SI DURANTE LA INVESTIGACIÓN PRELIMINAR, LA POLICÍA NACIONAL DEL PERÚ REALIZA ACTOS DE INVESTIGACIÓN SIN CUMPLIR LAS FORMALIDADES PRECISADAS POR EL FISCAL?","o":["ESOS ACTOS PODRÍAN CARECER DE VALIDEZ CONFORME A LO DISPUESTO POR LA NORMA.","SE DEBEN REMITIR DE IN
