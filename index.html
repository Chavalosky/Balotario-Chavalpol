MEDIATO A LA FISCALÍA DE LA NACIÓN.","DEBEN SER CORREGIDOS POR LA DEFENSA DEL IMPUTADO.","SON AUTOMÁTICAMENTE VÁLIDOS Y NO REQUIEREN REVISIÓN.","PUEDEN SER SUBSANADOS POR LA CORTE SUPERIOR PENAL."],"a":0,"u":"(texto: (ART: UNICO)** Articulo 65. La investigacion del delito destinada a ejercitar la accion penal)**","m":1,"t":18},{"n":1343,"q":"DE TODAS LAS DILIGENCIAS DE INVESTIGACIÓN REALIZADAS POR LA POLICÍA NACIONAL DEL PERÚ BAJO CONDUCCIÓN FISCAL, ¿QUE DOCUMENTOS FORMULARAN RESPETANDO LAS FORMALIDADES PREVISTAS PARA LA INVESTIGACION?:","o":["SÓLO DEBEN ENVIARSE RESÚMENES EJECUTIVOS AL FISCAL.","LAS ACTAS DETALLADAS LAS QUE ENTREGARA AL FISCAL Y EMITIRA EL INFORME POLICIAL.","LAS ACTAS SÓLO SON REQUERIDAS CUANDO SE TRATA DE DELITOS GRAVES O COMPLEJOS, NO EN DELITOS SIMPLES.","LAS ACTAS E INFORMES DEBEN REMITIRSE EXCLUSIVAMENTE AL JUEZ DE INVESTIGACIÓN PREPARATORIA.","ELABORAR ACTAS DETALLADAS ES OPTATIVO, DEPENDIENDO DEL CRITERIO DEL COMISARIO RESPONSABLE."],"a":1,"u":"(texto: (ART: UNICO)** Articulo 68. Funcion de investigacion de la Policia Nacional del Peru)**","m":1,"t":18},{"n":1344,"q":"DURANTE LA INVESTIGACIÓN PREPARATORIA, ¿QUÉ FUNCIÓN PUEDE EJERCER EL FISCAL RESPECTO A LA ACTUACIÓN DE LA POLICÍA NACIONAL DEL PERÚ SEGÚN LA MODIFICACIÓN LEGAL?","o":["EL FISCAL PUEDE PRESCINDIR COMPLETAMENTE DE LA POLICÍA DURANTE TODA LA INVESTIGACIÓN PREPARATORIA.","EL FISCAL PUEDE REQUERIR LA ACTUACIÓN POLICIAL DENTRO DEL MARCO DE LAS ATRIBUCIONES RECONOCIDAS EN LA LEY.","EL FISCAL SOLO PUEDE RECURRIR A LA POLICÍA CUANDO HAYAN TERMINADO LOS ACTOS DE INVESTIGACIÓN INICIALES.","EL FISCAL SÓLO PUEDE SOLICITAR APOYO POLICIAL SI EXISTE UNA ORDEN DEL JUEZ DE GARANTÍAS.","LA INSTRUCCIÓN DEL FISCAL A LA POLICÍA DEBE CONSTAR EN RESOLUCIÓN JUDICIAL PARA SER VÁLIDA."],"a":1,"u":"(texto: (ART: UNICO)** Articulo 67. Funcion de investigacion de la Policia Nacional del Peru)**","m":1,"t":18},{"n":1345,"q":"EN EL EJERCICIO DE LA FUNCIÓN DE INVESTIGACIÓN, ¿CUÁL ES EL LÍMITE LEGAL DE LA INTERVENCIÓN DE LA POLICÍA NACIONAL DEL PERÚ SEGÚN LA NORMA CITADA?","o":["PUEDE INVESTIGAR DE FORMA AUTÓNOMA SIN NINGUNA INJERENCIA DEL MINISTERIO PÚBLICO.","PUEDE REALIZAR ACTOS DE INVESTIGACIÓN BAJO LA CONDUCCIÓN DEL FISCAL Y RESPETANDO LAS FORMALIDADES LEGALES.","SU PARTICIPACIÓN SE LIMITA A LA CUSTODIA DE EVIDENCIA SIN FACULTAD PARA PRACTICAR DILIGENCIAS.","SOLO INTERVIENE COMO APOYO LOGÍSTICO Y TÉCNICO SIN PODERES DE INVESTIGACIÓN.","ACTÚA ÚNICAMENTE BAJO INSTRUCCIONES ORALES DE LOS JUECES PENALES."],"a":1,"u":"(texto: (ART: UNICO)** Articulo 67. Funcion de investigacion de la Policia Nacional del Peru)**","m":1,"t":18},{"n":1346,"q":"¿CUÁL ES EL DESTINO OBLIGATORIO DE LAS ACTAS DETALLADAS DE LAS DILIGENCIAS ESPECÍFICAS REALIZADAS POR LA POLICÍA NACIONAL DEL PERÚ, SEGÚN LA LEY MODIFICADA?:","o":["DEBEN SER REMITIDAS AL MINISTERIO DEL INTERIOR PARA CONSTANCIA INTERNA.","SE CONSERVAN EN LA COMISARÍA HASTA FINALIZADO EL JUICIO ORAL.","SE ENTREGAN AL FISCAL A CARGO Y SE EMITE INFORME POLICIAL CORRESPONDIENTE.","SON ENTREGADAS ÚNICAMENTE AL ÓRGANO JURISDICCIONAL PENAL.","SE PUBLICAN EN EL PORTAL DE TRANSPARENCIA POLICIAL PARA CONTROL CIUDADANO."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 67. Funcion de investigacion de la Policia Nacional del Peru)**","m":1,"t":18},{"n":1347,"q":"RESPECTO A LA MODIFICACIÓN INTRODUCIDA EN EL CÓDIGO PROCESAL PENAL, ¿QUÉ SUCEDE SI EL DECLARANTE NO CUENTA CON ABOGADO DEFENSOR DE ELECCIÓN O DEFENSOR PÚBLICO EN SU MANIFESTACIÓN ANTE LA POLICÍA NACIONAL DEL PERÚ?:","o":["SE SUSPENDE LA DILIGENCIA Y SE REPROGRAMA.","EL ACTO PUEDE SER SUBSANADO SI EL FISCAL RATIFICA LA ACTUACIÓN POLICIAL A POSTERIORI.","LA MANIFESTACIÓN ES VÁLIDA SIEMPRE QUE SEA VOLUNTARIA, AUN SIN DEFENSA TÉCNICA.","EL DEFECTO SOLO AFECTA EL VALOR PROBATORIO Y NO LA EXISTENCIA DE LA MANIFESTACIÓN.","LA ACTUACIÓN POLICIAL QUEDA SUSPENDIDA AUTOMÁTICAMENTE Y DEBE INFORMARSE AL JUEZ."],"a":0,"u":"(texto: (ART: UNICO)** Articulo 68. Funcion de investigacion de la Policia Nacional del Peru)**","m":1,"t":18},{"n":1348,"q":"SEGÚN EL ARTÍCULO 84 DEL CÓDIGO PROCESAL PENAL, MODIFICADO POR LA LEY 32130, RESPECTO AL ACCESO DEL ABOGADO DEFENSOR A LA INFORMACIÓN DEL PROCESO, SEÑALE LA RESPUESTA CORRECTA:","o":["EL ABOGADO DEFENSOR PUEDE ACCEDER SOLO A LOS DOCUMENTOS DEL ÁMBITO JUDICIAL DESPUÉS DE LA ETAPA DE JUICIO ORAL, POR RESPETO AL PRINCIPIO DE SEGURIDAD PROCESAL.","EL DERECHO DEL ABOGADO DEFENSOR A ACCEDER A LOS DOCUMENTOS ESTÁ RESTRINGIDO ÚNICAMENTE A LAS ETAPAS PREVIAS A LA ACUSACIÓN FISCAL.","EL ACCESO A LOS DOCUMENTOS POR PARTE DEL ABOGADO DEFENSOR DEPENDE DE LA AUTORIZACIÓN EXPRESA DEL MINISTERIO PÚBLICO EN CADA ETAPA PROCESAL.","EL ABOGADO DEFENSOR TIENE DERECHO A ACCEDER A LOS DOCUMENTOS DE ÁMBITO POLICIAL, FISCAL Y JUDICIAL EN TODO EL DESARROLLO DEL PROCESO, SIN MÁS LIMITACIÓN QUE LA PREVISTA EN LA LEY.","EL ABOGADO DEFENSOR PUEDE SOLICITAR LA RESTRICCIÓN DE SU PROPIO ACCESO A LOS DOCUMENTOS COMO ESTRATEGIA DE DEFENSA, DE ACUERDO AL PRINCIPIO DE AUTONOMÍA DE LA VOLUNTAD."],"a":3,"u":"(texto: (ART: UNICO)** Articulo 84. Derechos y deberes del abogado defensor)**","m":1,"t":18},{"n":1349,"q":"SEGÚN LA MODIFICACIÓN DEL ARTÍCULO 160 DEL CÓDIGO PROCESAL PENAL INTRODUCIDA POR LA LEY 32130 (ARTÍCULO ÚNICO), ¿EN CUÁL DE LAS SIGUIENTES SITUACIONES LA CONFESIÓN DE UN IMPUTADO TIENE VALOR PROBATORIO EN EL PROCESO PENAL?:","o":["CUANDO EL IMPUTADO CONFIESA ANTE EL FISCAL O JUEZ, CON PRESENCIA DE SU ABOGADO DEFENSOR, Y DICHA DILIGENCIA ES REGISTRADA EN EQUIPOS AUDIOVISUALES.","CUANDO EL IMPUTADO CONFIESA ANTE LA POLICÍA NACIONAL DURANTE LA INVESTIGACIÓN PRELIMINAR, SIN NECESIDAD DE ABOGADO DEFENSOR NI REGISTRO AUDIOVISUAL.","CUANDO LA CONFESIÓN ES PRESTADA ANTE CUALQUIER SERVIDOR PÚBLICO Y EN CUALQUIER ETAPA DEL PROCESO, SIEMPRE QUE EL IMPUTADO NO LA IMPUGNE POSTERIORMENTE.","CUANDO EL IMPUTADO FIRMA UN ACTA DE CONFESIÓN EXTRAJUDICIAL, AUNQUE NO HAYA REGISTRO AUDIOVISUAL NI PRESENCIA DE DEFENSOR, SIEMPRE QUE EL DOCUMENTO SEA LEGALIZADO.","CUANDO LA CONFESIÓN ES OBTENIDA MEDIANTE ACTA POLICIAL EN CUALQUIER ETAPA DEL PROCESO Y NO SE ALEGUE COACCIÓN."],"a":0,"u":"(texto: (ART: UNICO)**Articulo 160. Valor de prueba de la confesion)**","m":1,"t":18},{"n":1350,"q":"¿BAJO QUÉ CIRCUNSTANCIAS PROCEDERÁ LA CESACIÓN DE LA PRISIÓN PREVENTIVA O DE LAS MEDIDAS DE COMPARECENCIA SEGÚN EL ARTÍCULO 83 DE LA LEY N°32130?:","o":["CUANDO EL IMPUTADO SOLICITE POR PRIMERA VEZ LA CESACIÓN, SIN NECESIDAD DE MÁS REQUISITOS.","CUANDO SE HAYAN CUMPLIDO LOS REQUISITOS DE INVESTIGACIÓN PRELIMINAR.","CUANDO NUEVOS ELEMENTOS DE CONVICCIÓN DEMUESTREN QUE NO CONCURREN O NO SUBSISTEN LOS MOTIVOS QUE ORIGINARON LA MEDIDA Y RESULTE NECESARIO SUSTITUIRLA POR COMPARECENCIA.","SOLO CUANDO EL PROCESO PENAL HAYA SUPERADO LA ETAPA INTERMEDIA.","CUANDO EL MINISTERIO PÚBLICO DECLARE LA INOCENCIA DEL IMPUTADO."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 283. Cesacion de la prision preventiva o de la comparecencia)**","m":1,"t":18},{"n":1351,"q":"PARA LA DETERMINACION DE LA MEDIDA SUSTITUTIVA EL JUEZ TENDRA EN CONSIDERACION ADICIONALMENTE, SEÑALE LA CORRECTA:","o":["LA GRAVEDAD DEL DELITO INVESTIGADO EXCLUSIVAMENTE.","EL MONTO DEL DAÑO CIVIL CAUSADO POR EL IMPUTADO.","LAS CARACTERÍSTICAS PERSONALES DEL IMPUTADO, EL TIEMPO TRANSCURRIDO DESDE LA PRIVACIÓN DE LIBERTAD Y EL ESTADO DE LA CAUSA.","EL OBJETIVO DE IMPONER LA MAYOR RESTRICCIÓN POSIBLE PARA EVITAR LA FUGA.","LA OPINIÓN DEL AGRAVIADO COMO FACTOR DETERMINANTE."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 283. Cesacion de la prision preventiva o de la comparecencia)**","m":1,"t":18},{"n":1352,"q":"¿QUÉ DERECHO LE ASISTE AL IMPUTADO RESPECTO A LA SOLICITUD DE CESACIÓN DE PRISIÓN PREVENTIVA O COMPARECENCIA RESTRICTIVA?:","o":["PUEDE SOLICITAR LA CESACIÓN SÓLO UNA VEZ DURANTE LA INVESTIGACIÓN PREPARATORIA.","PUEDE SOLICITAR LA CESACIÓN TANTAS VECES COMO LO CONSIDERE PERTINENTE.","SOLO PUEDE SOLICITAR LA CESACIÓN SI HAN TRANSCURRIDO DOCE MESES DESDE LA IMPOSICIÓN DE LA MEDIDA.","DEBE PRESENTAR LA SOLICITUD ÚNICAMENTE A TRAVÉS DE SU ABOGADO DEFENSOR.","PUEDE SOLICITAR CESACIÓN ÚNICAMENTE PREVIA AUTORIZACIÓN DEL MINISTERIO PÚBLICO."],"a":1,"u":"(texto: (ART: UNICO)** Articulo 283. Cesacion de la prision preventiva o de la comparecencia)**","m":1,"t":18},{"n":1353,"q":"¿CUÁL ES LA FINALIDAD PRINCIPAL DE LA INVESTIGACIÓN PREPARATORIA SEGÚN EL ARTÍCULO 321?:","o":["FORMULAR ACUSACIÓN DE INMEDIATO CONTRA EL IMPUTADO SIN MAYOR ANÁLISIS.","PROTEGER EXCLUSIVAMENTE LOS DERECHOS DE LA VÍCTIMA.","REUNIR ELEMENTOS DE CONVICCIÓN PARA QUE EL FISCAL DECIDA SI FORMULA O NO ACUSACIÓN Y PERMITIR AL IMPUTADO PREPARAR SU DEFENSA.","SANCIONAR ANTICIPADAMENTE A LOS RESPONSABLES DEL DELITO.","IMPULSAR ACCIONES ADMINISTRATIVAS EN CASO DE DELITOS MENORES."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 321. Finalidad)**","m":1,"t":18},{"n":1354,"q":"SEGÚN EL ARTÍCULO 321 MODIFICADO, ¿QUÉ ROL CORRESPONDE A LA POLICÍA NACIONAL DEL PERÚ EN LA ETAPA PRELIMINAR DE INVESTIGACIÓN?","o":["ES ÚNICAMENTE UNA FUNCIÓN DE APOYO EN EJECUCIÓN DE MANDATOS JUDICIALES.","ACTÚA DIRECTAMENTE EN LA INVESTIGACIÓN PRELIMINAR BAJO LA CONDUCCIÓN JURÍDICA DEL MINISTERIO PÚBLICO.","TIENE COMPETENCIA AUTÓNOMA EN LA DISPOSICIÓN DE DILIGENCIAS FISCALES Y JUDICIALES.","SOLO PUEDE INTERVENIR EN DETENCIONES IN FRAGANTI.","ASUME LA DIRECCIÓN EXCLUSIVA EN TODO EL PROCESO PENAL."],"a":1,"u":"(texto: (ART: UNICO)** Articulo 321. Finalidad)**","m":1,"t":18},{"n":1355,"q":"¿CUÁL DE LOS SIGUIENTES ASPECTOS, NO ES UNA FINALIDAD DE LA INVESTIGACIÓN PREPARATORIA SEGÚN EL ART 321 DE LA LEY N°32130?:","o":["DETERMINAR LA EXISTENCIA DEL DAÑO CAUSADO.","IDENTIFICAR LA IDENTIDAD DEL AUTOR O PARTÍCIPE DEL DELITO.","DETERMINAR SI LA CONDUCTA INCRIMINADA ES DELICTUOSA.","EJECUTAR SANCIONES PENALES DE MANERA ANTICIPADA.","CONOCER LOS MÓVILES DE LA PERPETRACIÓN DEL DELITO."],"a":3,"u":"(texto: (ART: UNICO)** Articulo 321. Finalidad)**","m":1,"t":18},{"n":1356,"q":"¿A QUIÉN CORRESPONDE LA DIRECCIÓN PRINCIPAL DE LA INVESTIGACIÓN PREPARATORIA FORMALIZADA, DE ACUERDO CON LA MODIFICACIÓN AL CÓDIGO PROCESAL PENAL?:","o":["EXCLUSIVAMENTE AL PODER JUDICIAL, CON INTERVENCIÓN PUNTUAL DEL MINISTERIO PÚBLICO.","A LA POLICÍA NACIONAL DEL PERÚ, SIN INJERENCIA DE OTRAS ENTIDADES.","AL MINISTERIO PÚBLICO, CON APOYO EN LAS DILIGENCIAS DE LA POLICÍA NACIONAL DEL PERÚ.","A LOS ABOGADOS DEFENSORES DE LAS PARTES, PARA GARANTIZAR EL CONTRADICTORIO.","A LA DEFENSORÍA DEL PUEBLO, COMO GARANTE DE DERECHOS FUNDAMENTALES."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 321. Finalidad)**","m":1,"t":18},{"n":1357,"q":"SEGÚN EL ARTÍCULO 322 DEL CÓDIGO PROCESAL PENAL TRAS SU MODIFICACIÓN, ¿EN QUÉ SUPUESTO EL MINISTERIO PÚBLICO PUEDE SOLICITAR EL APOYO DE LA POLICÍA NACIONAL DEL PERÚ UNA VEZ FORMALIZADA LA INVESTIGACIÓN PREPARATORIA?:","o":["CUANDO CONSTITUYE UNA GARANTÍA PERSONAL DEL INVESTIGADO.","CUANDO LA INVESTIGACIÓN REQUIERA DILIGENCIAS QUE TENGAN CONTENIDO JURISDICCIONAL, ESPECIALMENTE LAS QUE RESTRINJAN DERECHOS FUNDAMENTALES.","PARA QUE LA POLICÍA REALICE INVESTIGACIONES COMPLEMENTARIAS BAJO LA DIRECCIÓN DEL MINISTERIO PÚBLICO.","SÓLO CUANDO EL CASO HA SIDO ELEVADO A JUICIO ORAL POR EL JUEZ PENAL.","EN CASOS DE FLAGRANCIA DELICTIVA, SIN IMPORTAR ETAPA PROCESAL."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 322. Direccion de la investigacion)**","m":1,"t":18},{"n":1358,"q":"¿CUÁL ES LA FINALIDAD INMEDIATA DE LA INVESTIGACIÓN PRELIMINAR, SEGÚN EL ARTÍCULO 330 MODIFICADO POR LA LEY 32130?:","o":["INDIVIDUALIZAR ÚNICAMENTE A LOS PRESUNTOS AUTORES DEL DELITO PARA SU DETENCIÓN.","GARANTIZAR LOS DERECHOS FUNDAMENTALES DE LOS DETENIDOS EN LA ETAPA INTERMEDIA.","REALIZAR ACTOS URGENTES O INAPLAZABLES PARA DETERMINAR LA EXISTENCIA DE LOS HECHOS, SU DELICTUOSIDAD Y ASEGURAR LOS ELEMENTOS MATERIALES, ASÍ COMO INDIVIDUALIZAR A TODOS LOS INVOLUCRADOS.","DEFINIR EL GRADO DE RESPONSABILIDAD DE LOS PARTÍCIPES DURANTE LA INVESTIGACIÓN PREPARATORIA.","PREPARAR LA ACUSACIÓN FISCAL PARA EL REQUERIMIENTO DE PRISIÓN PREVENTIVA."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 330. Investigacion preliminar)**","m":1,"t":18},{"n":1359,"q":"¿QUIÉN ESTÁ ENCARGADO DE LA INVESTIGACIÓN PRELIMINAR DEL DELITO, CONFORME AL ARTÍCULO 330 DE LA LEY N°32130, MARQUE LA RESPUESTA CORRECTA?:","o":["ÚNICAMENTE EL FISCAL, CON AUXILIO DE LA POLICÍA NACIONAL DEL PERÚ.","EL PODER JUDICIAL, CON APOYO DEL MINISTERIO PÚBLICO.","LA POLICÍA NACIONAL DEL PERÚ, CON LA CONDUCCIÓN JURÍDICA DEL FISCAL.","EL MINISTERIO PÚBLICO, DE MANERA AUTÓNOMA E INDEPENDIENTE.","EL PROCURADOR PÚBLICO, CON INTERVENCIÓN SUBSIDIARIA DEL FISCAL."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 330. Investigacion preliminar)**","m":1,"t":18},{"n":1360,"q":"¿CUÁL DE LOS ENUNCIADOS, NO ES UN PROPÓSITO INMEDIATO DE LA INVESTIGACIÓN PRELIMINAR, SEGÚN EL ART 330 DE LA LEY N°32130?:","o":["IDENTIFICAR Y UBICAR A LOS PRESUNTOS AUTORES Y PARTÍCIPES DEL HECHO DELICTIVO.","ASEGURAR DEBIDAMENTE A LAS PERSONAS INVOLUCRADAS, DENTRO DE LOS LÍMITES DE LA LEY.","IMPEDIR QUE EL DELITO PRODUZCA CONSECUENCIAS ULTERIORES.","ASEGURAR LOS ELEMENTOS MATERIALES DE LA COMISIÓN DEL HECHO.","FORMALIZAR LA ACUSACIÓN ANTE EL ÓRGANO JURISDICCIONAL COMPETENTE."],"a":4,"u":"(texto: (ART: UNICO)** Articulo 330. Investigacion preliminar)**","m":1,"t":18},{"n":1361,"q":"DENTRO DEL MARCO DEL ARTÍCULO 330 REFORMADO, ¿CUÁL ES EL PAPEL DE LA POLICÍA NACIONAL AL TENER CONOCIMIENTO DE UN DELITO DE EJERCICIO PÚBLICO DE LA ACCIÓN PENAL?:","o":["CONDUCIR LA INVESTIGACIÓN PRELIMINAR DE MANERA AUTÓNOMA Y SIN SUPERVISIÓN FISCAL.","PODRA CONSTITUIRSE INMEDIATAMENTE EN EL LUGAR DE LOS HECHOS CON PERSONAL POLICIAL ESPECIALIZADO Y EFECTUAR UN EXAMEN PARA ESTABLECER LA REALIDAD DE LOS HECHOS.","SOLICITAR A LA FISCALÍA LA AUTORIZACIÓN PARA INTERVENIR EN EL LUGAR DEL DELITO.","EMITIR PRONTAMENTE LA ACUSACIÓN PENAL FORMAL SIN INTERVENCIÓN DEL MINISTERIO PÚBLICO.","COORDINAR CON EL PODER JUDICIAL PARA DETERMINAR LAS MEDIDAS CAUTELARES PROVISIONALES."],"a":1,"u":"(texto: (ART: UNICO)** Articulo 330. Investigacion preliminar)**","m":1,"t":18},{"n":1362,"q":"DENTRO DE LA INVESTIGACIÓN PRELIMINAR BAJO LA LEY 32130, ¿QUÉ ACTO ESTÁ JUSTIFICADO COMO FUNCIÓN AUTÓNOMA POLICIAL?:","o":["CONDUCIR TODAS LAS DILIGENCIAS SIN CONTROL DEL FISCAL.","REALIZAR ACTOS URGENTES O INAPLAZABLES NECESARIOS PARA IMPEDIR CONSECUENCIAS ULTERIORES DEL DELITO.","DICTO DE MEDIDAS COERCITIVAS PERSONALES SIN INTERVENCIÓN DEL MINISTERIO PÚBLICO.","INICIAR FORMALMENTE EL PROCESO PENAL ANTE EL JUEZ.","EMITIR SENTENCIA CONDENATORIA LUEGO DE LA INVESTIGACIÓN POLICIAL."],"a":1,"u":"(texto: (ART: UNICO)** Articulo 330. Investigacion preliminar)**","m":1,"t":18},{"n":1363,"q":"SEGÚN EL ARTÍCULO 330, ¿QUÉ FUNCIÓN CUMPLE EL INFORME POLICIAL EMITIDO AL FISCAL AL CONCLUIR LA INVESTIGACIÓN PRELIMINAR?","o":["PERMITE DECIDIR SOBRE LA FORMALIZACIÓN DE LA INVESTIGACIÓN PREPARATORIA.","SUSTITUYE LA IMPUTACIÓN FORMAL ANTE EL PODER JUDICIAL.","DEFINE LA CULPABILIDAD DEL INVESTIGADO.","PRESENTA LOS ALEGATOS DE CIERRE PARA LA SENTENCIA.","ORDENA LA DETENCIÓN JUDICIAL DIRECTA DEL IMPUTADO."],"a":0,"u":"(texto: (ART: UNICO)** Articulo 330. Investigacion preliminar)**","m":1,"t":18},{"n":1364,"q":"SOBRE LA FACULTAD DE CONSTITUIRSE EN EL LUGAR DE LOS HECHOS, ¿EN QUÉ CASOS PUEDEN HACERLO EL FISCAL O LA POLICÍA NACIONAL?:","o":["SOLAMENTE SI EXISTE FLAGRANCIA DELICTIVA GRAVE.","AL TENER CONOCIMIENTO DE CUALQUIER DELITO PERSEGUIBLE POR ACCIÓN PRIVADA.","AL TENER CONOCIMIENTO DE UN DELITO DE EJERCICIO PÚBLICO DE LA ACCIÓN PENAL.","DESPUÉS DE LA FORMALIZACIÓN DE LA ACUSACIÓN PENAL.","SOLO AL RECIBIR DENUNCIA ESCRITA DEL AGRAVIADO."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 330. Investigacion preliminar)**","m":1,"t":18},{"n":1365,"q":"CONFORME AL ART 330 DE LA LEY N°32130, ¿QUÉ ELEMENTO NO ES DESTACADO COMO COMPETENCIA DE LA INVESTIGACIÓN PRELIMINAR DE LA PNP BAJO CONDUCCIÓN FISCAL?:","o":["IMPEDIR QUE EL DELITO PRODUZCA CONSECUENCIAS ULTERIORES.","ASEGURAR LOS ELEMENTOS MATERIALES DEL DELITO.","INDIVIDUALIZAR A LOS AGRAVIADOS.","ASEGURAR DEBIDAMENTE A LAS PERSONAS INVOLUCRADAS.","EMITIR AUTO DE PRISIÓN PREVENTIVA."],"a":4,"u":"(texto: (ART: UNICO)** Articulo 330. Investigacion preliminar)**","m":1,"t":18},{"n":1366,"q":"SEGÚN LA MODIFICACIÓN DEL ARTÍCULO 331, ¿CUÁNDO DEBE LA POLICÍA PONER A DISPOSICIÓN DEL FISCAL TODO LO ACTUADO DURANTE LA INVESTIGACIÓN PRELIMINAR?:","o":["UNA VEZ QUE EL MINISTERIO PÚBLICO LE COMUNIQUE FORMALMENTE UNA ORDEN EXPRESA.","AL FINALIZAR LA INVESTIGACIÓN PRELIMINAR, MEDIANTE EL CORRESPONDIENTE INFORME POLICIAL.","ÚNICAMENTE CUANDO SE HAYA DICTADO PRISIÓN PREVENTIVA PARA EL INVESTIGADO.","SIEMPRE QUE EXISTAN PRUEBAS INCRIMINATORIAS SUFICIENTES, SIN IMPORTAR EL ESTADO DEL PROCEDIMIENTO.","AL MOMENTO EN QUE SE REMITA EL EXPEDIENTE AL PODER JUDICIAL PARA JUZGAMIENTO."],"a":1,"u":"(texto: (ART: UNICO)** Articulo 331. Actuacion policial)**","m":1,"t":18},{"n":1367,"q":"¿QUÉ INFORMACIÓN ADICIONAL DEBE REMITIR LA POLICÍA AL MINISTERIO PÚBLICO, SEGÚN EL ARTÍCULO 331, SIN PERJUICIO DE LA COMUNICACIÓN INMEDIATA?:","o":["SOLO EL ACTA POLICIAL Y LA RELACIÓN DE LOS PRESUNTOS RESPONSABLES.","TODA LA DOCUMENTACIÓN QUE PUDIERA EXISTIR RELACIONADA AL HECHO INVESTIGADO.","ÚNICAMENTE LA DECLARACIÓN DE LOS TESTIGOS PRESENCIALES Y LA EVIDENCIA MATERIAL.","LA PETICIÓN FORMAL DE INICIO DE PROCESO PENAL.","LA SOLICITUD DE AUTORIZACIÓN PARA REALIZAR DILIGENCIAS ADICIONALES."],"a":1,"u":"(texto: (ART: UNICO)** Articulo 331. Actuacion policial)**","m":1,"t":18},{"n":1368,"q":"RESPECTO AL INFORME POLICIAL REGULADO EN EL ARTÍCULO 332, ¿CUÁL DE LOS SIGUIENTES ENUNCIADOS ES CORRECTO EN CUANTO A SU NATURALEZA Y EFECTOS JURÍDICOS ANTE EL FISCAL?:","o":["EL INFORME POLICIAL ES VINCULANTE Y OBLIGA AL FISCAL A ADECUAR SU DECISIÓN CONFORME AL MISMO.","EL INFORME POLICIAL NO ES VINCULANTE.","EL INFORME POLICIAL TIENE CARÁCTER RESOLUTIVO Y PUEDE SUSTITUIR LA ACUSACIÓN FISCAL.","EL INFORME POLICIAL ES OBLIGATORIO TANTO EN SU CONTENIDO COMO EN SUS RECOMENDACIONES PARA EL FISCAL.","EL INFORME POLICIAL DEBE SER CALIFICADO POR EL FISCAL COMO MÉRITO SUFICIENTE PARA ABRIR JUICIO ORAL."],"a":1,"u":"(texto: (ART: UNICO)** Articulo 332. Informe policial)**","m":1,"t":18},{"n":1369,"q":"CONFORME A LO DISPUESTO EN EL ARTÍCULO 332, ¿CUÁLES DE LOS SIGUIENTES ELEMENTOS NO DEBE NECESARIAMENTE CONTENER EL INFORME POLICIAL REMITIDO AL FISCAL?:","o":["LOS ANTECEDENTES QUE MOTIVARON LA INTERVENCIÓN POLICIAL.","LA RELACIÓN DETALLADA DE LAS DILIGENCIAS EFECTUADAS DURANTE LA INVESTIGACIÓN.","UNA VALORACIÓN DEFINITIVA SOBRE LA CULPABILIDAD DEL INVESTIGADO.","LAS PRECALIFICACIONES DE LOS DELITOS PRESUNTAMENTE COMETIDOS.","EL ANÁLISIS DE LOS HECHOS INVESTIGADOS Y LAS CONCLUSIONES RESPECTIVAS."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 332. Informe policial)**","m":1,"t":18},{"n":1370,"q":"EN EL MARCO DE LA LEY 32130, ¿EN QUÉ MOMENTO PROCESAL LA POLICÍA NACIONAL DEBE ELEVAR EL INFORME POLICIAL AL FISCAL?","o":["ÚNICAMENTE AL FINALIZAR LA INVESTIGACIÓN PREPARATORIA.","DENTRO DEL PLAZO OTORGADO POR EL REPRESENTANTE DEL MINISTERIO PÚBLICO DURANTE LA INVESTIGACIÓN PRELIMINAR.","SOLO CUANDO EXISTA DENUNCIA FORMAL DEL AGRAVIADO.","DESPUÉS DE EMITIDA LA SENTENCIA ABSOLUTORIA O CONDENATORIA.","AL MOMENTO DE LA DETENCIÓN EN FLAGRANCIA DEL PRESUNTO AUTOR DEL DELITO."],"a":1,"u":"(texto: (ART: UNICO)** Articulo 332. Informe policial)**","m":1,"t":18},{"n":1371,"q":"¿CUÁL ES LA FUNCIÓN PRINCIPAL DEL INFORME POLICIAL EN EL PROCEDIMIENTO PENAL PERUANO, CONFORME AL ARTÍCULO 332 MODIFICADO POR LA LEY 32130?","o":["SERVIR COMO DICTAMEN PERICIAL PARA RESOLUCIONES JUDICIALES.","CONSTITUIR LA BASE ESENCIAL PARA LA ACUSACIÓN FISCAL EN JUICIO ORAL.","PROPORCIONAR ANTECEDENTES, DILIGENCIAS REALIZADAS, PRECALIFICACIONES Y CONCLUSIONES PARA FUNDAMENTAR LA CONTINUACIÓN O NO DE LA INVESTIGACIÓN PREPARATORIA.","DETERMINAR LA RESPONSABILIDAD PENAL DEL IMPUTADO DIRECTA E IRREVOCABLEMENTE.","VALIDAR ADMINISTRATIVAMENTE LA ACTUACIÓN POLICIAL ANTE EL FISCAL SUPERIOR."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 332. Informe policial)**","m":1,"t":18},{"n":1372,"q":"SEGÚN EL ARTÍCULO 337, ¿EN QUÉ SUPUESTO ESPECÍFICO LA INVESTIGACIÓN PRELIMINAR PUEDE SER AMPLIADA UNA VEZ FORMALIZADA LA INVESTIGACIÓN PREPARATORIA?:","o":["CUANDO LO SOLICITA LA DEFENSA TÉCNICA DEL IMPUTADO, ALEGANDO VULNERACIÓN DE SUS DERECHOS PROCESALES.","SI LA VÍCTIMA PRESENTA UNA NUEVA DENUNCIA SOBRE LOS MISMOS HECHOS.","CUANDO EL FISCAL ADVIERTA UN GRAVE DEFECTO EN LA ACTUACIÓN DE LA DILIGENCIA O SE DEBA COMPLETAR INELUDIBLEMENTE POR LA INCORPORACIÓN DE NUEVOS ELEMENTOS DE CONVICCIÓN.","CADA VEZ QUE LA POLICÍA NACIONAL LO CONSIDERE NECESARIO EN CUMPLIMIENTO DE SU FUNCIÓN INVESTIGADORA.","ANTE LA EXISTENCIA DE CONTRADICCIONES ENTRE TESTIMONIOS RECABADOS DURANTE LA INVESTIGACIÓN PRELIMINAR."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 337. Diligencias de la Investigacion Preparatoria)**","m":1,"t":18},{"n":1373,"q":"EN VIRTUD DEL ARTÍCULO 337 DEL CÓDIGO PROCESAL PENAL PERUANO, TRAS LA FORMALIZACIÓN DE LA INVESTIGACIÓN PREPARATORIA:","o":["LAS DILIGENCIAS PRELIMINARES PUEDEN REPETIRSE ILIMITADAMENTE POR DISPOSICIÓN FISCAL.","SOLO PUEDEN REPETIRSE SI LO ORDENA UN JUEZ CONSTITUCIONAL EN VÍA DE TUTELA DE DERECHOS.","NO PODRÁN REPETIRSE, SALVO QUE ESTÉN JUSTIFICADAS POR LA APARICIÓN DE NUEVA PRUEBA, PERO SOLO BAJO ESTRICTA AUTORIZACIÓN JUDICIAL.","NO PODRÁN REPETIRSE BAJO NINGÚN CONCEPTO, SALVO EN LAS EXCEPCIONES SEÑALADAS EN LA PROPIA NORMA POR DEFECTOS GRAVES O NUEVOS ELEMENTOS DE CONVICCIÓN.","PUEDEN REPETIRSE COMO PARTE DE LA ESTRATEGIA PROCESAL DE ALGUNA DE LAS PARTES EN EL PROCESO."],"a":3,"u":"(texto: (ART: UNICO)** Articulo 337. Diligencias de la Investigacion Preparatoria)**","m":1,"t":18},{"n":1374,"q":"CONFORME AL ARTÍCULO 337, ¿CUÁL DE LOS SIGUIENTES ENUNCIADOS REFLEJA CORRECTAMENTE LA RELACIÓN ENTRE LA ACTUACIÓN FISCAL Y POLICIAL EN LA INVESTIGACIÓN DE DELITOS?:","o":["EL FISCAL ESTÁ AUTORIZADO A DELEGAR EN LA POLICÍA ÚNICAMENTE LA BÚSQUEDA DE ELEMENTOS MATERIALES DE PRUEBA.","LA POLICÍA INVESTIGA SOLO BAJO LA SUPERVISIÓN DEL JUEZ DE LA INVESTIGACIÓN PREPARATORIA.","LA POLICÍA REALIZA DILIGENCIAS QUE CONSIDERE PERTINENTES Y ÚTILES, PERO SIEMPRE DENTRO DE LOS LÍMITES FIJADOS POR LA LEY Y BAJO LAS DISPOSICIONES DEL FISCAL.","LA POLICÍA TIENE FACULTAD AUTÓNOMA DE DECIDIR EL INICIO, EL CONTENIDO Y LA CULMINACIÓN DE LAS DILIGENCIAS DE INVESTIGACIÓN.","EL FISCAL SOLO INTERVIENE SI EXISTE UNA SOLICITUD EXPRESA DE LA VÍCTIMA."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 337. Diligencias de la Investigacion Preparatoria)**","m":1,"t":18},{"n":1375,"q":"SEGÚN EL ARTÍCULO 353 MODIFICADO POR LA LEY 32130, ¿CUÁL ES LA CONDICIÓN ESENCIAL PARA QUE EL AUTO DE ENJUICIAMIENTO PUEDA SER RECURRIDO POR LAS PARTES PROCESALES?:","o":["SI EN EL AUTO DE ENJUICIAMIENTO NO SE CITA EXPRESAMENTE LA LEY QUE SUSTENTA LA ACUSACIÓN FISCAL.","CUANDO EL AUTO DE ENJUICIAMIENTO OMITE IDENTIFICAR A LOS SUJETOS PASIVOS DEL PROCESO PENAL.","SI LA IMPUTACIÓN NECESARIA NO ESTÁ DEBIDAMENTE FORMULADA, ES DECIR, NO SE IDENTIFICAN CORRECTAMENTE LOS HECHOS Y LOS ELEMENTOS PROBATORIOS QUE TIENDEN A ACREDITARLA O LAS OBSERVACIONES ASUMIDAS EN ETAPA INTERMEDIA.","EN TODOS LOS CASOS EN LOS QUE SE DICTE UN AUTO DE ENJUICIAMIENTO, INDEPENDIENTEMENTE DE SU CONTENIDO.","CUANDO EL JUEZ DICTA EL AUTO DE ENJUICIAMIENTO SIN HABER INTERVENIDO EL FISCAL PRINCIPAL EN LA AUDIENCIA PRELIMINAR."],"a":2,"u":"(texto: (ART: UNICO)** Articulo 353. Contenido del auto de enjuiciamiento)**","m":1,"t":18},{"n":1376,"q":"¿CUÁL ES EL ÁMBITO DE APLICACIÓN TERRITORIAL DEL DECRETO LEGISLATIVO 1611 RESPECTO A LA PREVENCIÓN E INVESTIGACIÓN DEL DELITO DE EXTORSIÓN Y SUS DELITOS CONEXOS, SEGÚN EL ARTÍCULO 2?","o":["SE APLICA ÚNICAMENTE EN ZONAS URBANAS DEL TERRITORIO NACIONAL, EXCLUYENDO ÁREAS RURALES Y ZONAS DE FRONTERA.","SE APLICA EN TODO EL TERRITORIO DE LA REPÚBLICA, INCLUYENDO ÁREAS DE EXCLUSIÓN, RÉGIMEN ESPECIAL ADMINISTRATIVO Y EL CIBERESPACIO, SALVO LAS EXCEPCIONES EXPRESAMENTE PREVISTAS.","SE LIMITA EXCLUSIVAMENTE A LOS ESPACIOS GEOGRÁFICOS SUJETOS A ESTADO DE EMERGENCIA DECRETADO POR EL EJECUTIVO.","ALCANZA SOLO PROPIEDAD PÚBLICA, EXCLUYENDO DE MANERA PERMANENTE LA INVESTIGACIÓN EN ESPACIOS PRIVADOS SIN EXCEPCIÓN ALGUNA.","OPERA SOLAMENTE EN CIRCUNSCRIPCIONES DONDE EXISTAN ANTECEDENTES DE DELITOS DE EXTORSIÓN VERIFICADOS EN LOS ÚLTIMOS CINCO AÑOS."],"a":1,"u":"(texto: (ART: 2)** Articulo 2.- Ambito de Aplicacion)**","m":1,"t":19},{"n":1377,"q":"DE ACUERDO AL TEXTO ANALIZADO, ¿QUÉ FUNCIÓN CUMPLE LA POLICÍA NACIONAL DEL PERÚ RESPECTO AL DELITO DE EXTORSIÓN Y SUS DELITOS CONEXOS?","o":["DIRIGE LA INVESTIGACIÓN JUDICIAL A CARGO DEL PODER JUDICIAL.","PREVIENE, INVESTIGA Y COMBATE LA DELINCUENCIA EN GENERAL, Y REALIZA LA INVESTIGACIÓN DEL DELITO DE EXTORSIÓN EN MATERIA PROCESAL PENAL.","SOLICITA DE MANERA EXCLUSIVA ÓRDENES DE ALLANAMIENTO EN INVESTIGACIONES DE EXTORSIÓN.","ELABORA Y EJECUTA SENTENCIAS EN CASOS DE EXTORSIÓN.","SUSTITUYE AL MINISTERIO PÚBLICO CUANDO ESTE SE DECLARE IMPEDIDO."],"a":1,"u":"(texto: (ART: 3)** Articulo 3.- Alcance)**","m":1,"t":19},{"n":1378,"q":"¿QUÉ REQUISITO DEBEN CUMPLIR LAS VERSIONES EXPUSTAS POR LOS INTERVENIDOS PARA QUE MOTIVEN DILIGENCIAS INMEDIATAS DE CORROBORACIÓN?","o":["SER MANIFESTADAS EN PRESENCIA OBLIGATORIA DEL FISCAL SUPERIOR.","HABER SIDO PRESTADAS LIBREMENTE, EN ESTADO NORMAL DE LAS FACULTADES PSÍQUICAS, Y HABIENDO SIDO ADVERTIDO EL DERECHO A GUARDAR SILENCIO.","ESTAR GRABADAS EN AUDIO Y VIDEO CON FIRMA LEGALIZADA.","EXPRESARSE POR ESCRITO Y EN PRESENCIA DE TESTIGOS CIVILES.","CONTENER INFORMACIÓN SOBRE TODAS LAS ETAPAS DEL ILÍCITO PENAL."],"a":1,"u":"(texto: (ART: 6)** Articulo 6.- Diligencias urgentes e imprescindibles por la comision de delito de extorsion y delitos conexos)**","m":1,"t":19},{"n":1379,"q":"¿EL LEVANTAMIENTO DE LAS ACTAS EN FORMA CRONOLOGICAS Y DE MANERA COHERENTE, SUSCRIBIENDOLA QUIENES PARTICIPARON EN LAS RESPECTIVAS DILIGENCIAS, EN EL MISMO LUGAR DE LOS HECHOS SALVO IMPEDIMENTO DEBIDAMENTE ACREDITADO Y EXPRESADO?","o":["SI POR RAZONES DE SEGURIDAD O CAUSAS AJENAS A LA VOLUNTAD DEL PERSONAL POLICIAL, NO ES POSIBLE LEVANTAR LAS ACTAS EN EL LUGAR DE LOS HECHOS.","LA DILIGENCIA SE ANULA AUTOMÁTICAMENTE POR INCUMPLIMIENTO DE FORMALIDAD.","SE TOMA COMO VÁLIDA CUALQUIER VERSIÓN ORAL DE LOS INTERVINIENTES, SIN NECESIDAD DE ACTA ESCRITA.","EL FISCAL COMPETENTE DEBE ASUMIR LA REDACCIÓN DE LAS ACTAS EN SU DESPACHO SIN INFORMACIÓN POLICIAL.","NO EXISTE SOLUCIÓN LEGALMENTE PREVISTA Y DEBE REPETIRSE LA DILIGENCIA EN OTRO MOMENTO."],"a":0,"u":"(texto: (ART: 6)** Articulo 6.- Diligencias urgentes e imprescindibles por la comision de delito de extorsion y delitos conexos)**","m":1,"t":19},{"n":1380,"q":"¿CUÁL ES LA COMPETENCIA DE LA POLICÍA EN LAS PESQUISAS E INDAGACIONES URGENTES, CONFORME EL ARTÍCULO 6?","o":["REALIZAR SOLO INDAGACIONES PRELIMINARES SIN ACTUACIÓN ALGUNA EN EL LUGAR DE LOS HECHOS.","LLEVAR A CABO PESQUISAS PARA IDENTIFICAR Y LOCALIZAR AUTORES, VÍCTIMAS, MEDIOS E INSTRUMENTOS DEL DELITO, ASÍ COMO OTROS ELEMENTOS DE CONVICCIÓN.","EXCLUSIVAMENTE PROTEGER LOS DERECHOS HUMANOS DE LOS IMPUTADOS DURANTE LA DILIGENCIA.","DEDICAR SUS FUNCIONES A LA ORGANIZACIÓN DE OPERATIVOS PREVENTIVOS FUERA DE LA ESCENA DEL DELITO.","REMITIR TODA SOSPECHA DIRECTAMENTE AL PODER JUDICIAL SIN DILIGENCIA PREVIA."],"a":1,"u":"(texto: (ART: 6)** Articulo 6.- Diligencias urgentes e imprescindibles por la comision de delito de extorsion y delitos conexos)**","m":1,"t":19},{"n":1381,"q":"¿CUÁL DE LOS SIGUIENTES MÉTODOS UTILIZADOS PARA LA IDENTIFICACIÓN DE PRESUNTOS AUTORES Y PARTÍCIPES DE DELITOS DE EXTORSIÓN Y CONEXOS ES EXPRESAMENTE MENCIONADO EN EL ARTÍCULO 7 DEL D.LEG 1611?","o":["RECONOCIMIENTO DE HUELLAS DACTILARES A TRAVÉS DE INTELIGENCIA ARTIFICIAL.","EXÁMENES PERICIALES PAPILOSCÓPICOS, MORFOLÓGICOS, FACIALES, CINÉTICOS (GAIT), BIOMÉTRICOS O ANTROPOMÉTRICOS.","ENTREVISTAS PSICOLÓGICAS A FAMILIARES DEL IMPUTADO.","INTERCEPTACIÓN DE LLAMADAS TELEFÓNICAS SIN AUTORIZACIÓN JUDICIAL.","ANÁLISIS DE SOLVENCIA ECONÓMICA DEL IMPUTADO."],"a":1,"u":"(texto: (ART: 7)** Articulo 7.- Identificacion y localizacion de presuntos autores y participes)**","m":1,"t":19},{"n":1382,"q":"¿QUIÉNES ESTÁN OBLIGADOS A OTORGAR PRIORIDAD AL REQUERIMIENTO DE LOCALIZACIÓN Y GEOLOCALIZACIÓN EN LAS INVESTIGACIONES DE EXTORSIÓN Y DELITOS CONEXOS, SEGÚN EL ARTÍCULO 7?","o":["ÚNICAMENTE LA POLICÍA NACIONAL DEL PERÚ.","LAS AUTORIDADES POLICIALES, FISCALES Y JUDICIALES, ASÍ COMO LOS CONCESIONARIOS DE SERVICIOS PÚBLICOS DE TELECOMUNICACIONES.","EL MINISTERIO DE DEFENSA Y LA FISCALÍA DE LA NACIÓN.","SOLO LAS AUTORIDADES JUDICIALES CON COMPETENCIA EN MATERIA PENAL.","LAS EMPRESAS DE TRANSPORTE PÚBLICO Y TAXISTAS REGISTRADOS."],"a":1,"u":"(texto: (ART: 7)** Articulo 7.- Identificacion y localizacion de presuntos autores y participes)**","m":1,"t":19},{"n":1383,"q":"SEGÚN EL TEXTO DEL ARTÍCULO 7, ¿QUÉ ELEMENTO ES OBJETO DE LOCALIZACIÓN O UBICACIÓN MEDIANTE MEDIOS TECNOLÓGICOS EN PROCESOS DE EXTORSIÓN Y DELITOS CONEXOS?","o":["SOLO LOS PRESUNTOS AUTORES Y PARTÍCIPES.","PRESUNTOS AUTORES O PARTÍCIPES, VÍCTIMAS E INSTRUMENTOS, MEDIOS, EFECTOS U OBJETO MATERIAL DEL DELITO.","TESTIGOS PROTEGIDOS Y ABOGADOS DEFENSORES.","FUNCIONARIO PÚBLICO QUE NO COLABORA CON LA INVESTIGACIÓN.","TODA PERSONA VINCULADA ADMINISTRATIVA O CONTRACTUALMENTE A LA VÍCTIMA."],"a":1,"u":"(texto: (ART: 7)** Articulo 7.- Identificacion y localizacion de presuntos autores y participes)**","m":1,"t":19},{"n":1384,"q":"¿EN CUÁL DE LOS SIGUIENTES SUPUESTOS LAS ENTIDADES PÚBLICAS Y PRIVADAS ESTÁN OBLIGADAS A COOPERAR CON LA AUTORIDAD POLICIAL EN INVESTIGACIONES SOBRE EXTORSIÓN, SEGÚN EL ARTÍCULO 9 DEL D. LEG. 1611?","o":["SOLO EN PRESENCIA DE ORDEN JUDICIAL DEBIDAMENTE MOTIVADA.","ÚNICAMENTE CUANDO EXISTA FLAGRANCIA DELICTIVA RELACIONADA CON EXTORSIÓN O DELITOS CONEXOS.","SIEMPRE QUE LA AUTORIDAD POLICIAL LO SOLICITE, SIN NECESIDAD DE NINGÚN TIPO DE ACTO PROCESAL.","SOLO CUANDO LA FISCALÍA ASÍ LO REQUIERA, CON INDEPENDENCIA DE LA FLAGRANCIA.","EN CUALQUIER INVESTIGACIÓN CRIMINAL, INDEPENDIENTEMENTE DEL TIPO DELICTIVO."],"a":1,"u":"(texto: (ART: 9)** Articulo 9.- Apoyo de las entidades publicas y privadas)**","m":1,"t":19},{"n":1385,"q":"¿QUÉ PROCEDIMIENTO DEBE OBSERVARSE PARA OBTENER INFORMACIÓN DE ABONADOS DE TELEFONÍA MÓVIL UTILIZADOS EN LA COMISIÓN DE DELITOS DE EXTORSIÓN SEGÚN EL CITADO ARTÍCULO?","o":["LA ENTREGA DEBE REALIZARSE EXTRAJUDICIALMENTE SIN PROCEDIMIENTO ESTABLECIDO.","LA INFORMACIÓN SE PROPORCIONA MEDIANTE UN PROCEDIMIENTO DEBIDAMENTE ESTABLECIDO EN EL CÓDIGO PROCESAL PENAL.","SE REQUIERE APROBACIÓN DEL MINISTERIO DEL INTERIOR.","SOLO PUEDE SOLICITARSE BAJO SUPERVISIÓN DE LA CONTRALORÍA GENERAL DE LA REPÚBLICA.","ES SUFICIENTE UNA SOLICITUD INFORMAL POR PARTE DE LA POLICÍA NACIONAL."],"a":1,"u":"(texto: (ART: 9)** Articulo 9.- Apoyo de las entidades publicas y privadas)**","m":1,"t":19},{"n":1386,"q":"RESPECTO AL ACCESO A DATOS MIGRATORIOS DE EXTRANJEROS EN EL CONTEXTO DE INVESTIGACIONES POR EXTORSIÓN, ¿CUÁL ES UNA OBLIGACIÓN DE LA AUTORIDAD DE MIGRACIONES SEGÚN LO DISPUESTO?","o":["NEGAR EL ACCESO A LA INFORMACIÓN MIGRATORIA SI NO HAY SENTENCIA FIRME.","FACILITAR EL ACCESO O ENTREGAR DATOS SOBRE MOVIMIENTOS MIGRATORIOS Y SITUACIÓN LEGAL EN EL PAÍS A LA AUTORIDAD POLICIAL, PARA EL ESCLARECIMIENTO DEL DELITO EXCLUSIVAMENTE.","SOLICITAR AUTORIZACIÓN PREVIA DEL MINISTERIO DEL EXTERIOR.","PROVEER INFORMACIÓN SOLO AL PODER JUDICIAL.","REMITIR LA INFORMACIÓN EXCLUSIVAMENTE A LA UIF-PERÚ."],"a":1,"u":"(texto: (ART: 9)** Articulo 9.- Apoyo de las entidades publicas y privadas)**","m":1,"t":19},{"n":1387,"q":"¿CUÁL DE LAS SIGUIENTES ENTIDADES NO SE MENCIONA EXPRESAMENTE EN EL ARTÍCULO 9 COMO HABILITADA PARA INTEGRAR EL MECANISMO PÚBLICO-PRIVADO DE INTERCAMBIO DE INFORMACIÓN?","o":["SUPERINTENDENCIA DE BANCA, SEGUROS Y AFP.","MINISTERIO PÚBLICO.","CONTRALORÍA GENERAL DE LA REPÚBLICA.","MINISTERIO DE JUSTICIA Y DERECHOS HUMANOS.","SUPERINTENDENCIA NACIONAL DE ADUANAS Y DE ADMINISTRACIÓN TRIBUTARIA."],"a":3,"u":"(texto: (ART: 9)** Articulo 9.- Apoyo de las entidades publicas y privadas)**","m":1,"t":19},{"n":1388,"q":"EN EL INTERCAMBIO DE INFORMACIÓN DENTRO DEL MECANISMO PÚBLICO-PRIVADO, ¿QUÉ RESTRICCIÓN SE IMPONE RESPECTO AL USO DE LA MISMA?","o":["PUEDE SER UTILIZADA PARA FUTURAS INVESTIGACIONES DISTINTAS.","SOLO PUEDE UTILIZARSE PARA LOS HECHOS QUE MOTIVARON LA INVESTIGACIÓN ORIGINAL.","DEBE SER DIFUNDIDA PÚBLICAMENTE SI SE CONSIDERA DE INTERÉS SOCIAL.","LA RESTRICCIÓN SOLO APLICA A INFORMACIÓN FINANCIERA.","LA INFORMACIÓN CARECE DE CUALQUIER RESTRICCIÓN SI PROVIENE DEL MINISTERIO PÚBLICO."],"a":1,"u":"(texto: (ART: 9)** Articulo 9.- Apoyo de las entidades publicas y privadas)**","m":1,"t":19},{"n":1389,"q":"¿CUÁL ES EL ROL DE LA UIF-PERÚ RESPECTO AL MECANISMO PÚBLICO-PRIVADO DE LUCHA CONTRA LA EXTORSIÓN Y DELITOS CONEXOS SEGÚN EL ARTÍCULO 9?","o":["SUPERVISAR A LAS ENTIDADES BANCARIAS EXCLUSIVAMENTE.","EJERCER LA ARTICULACIÓN DEL MECANISMO Y ESTABLECER MEDIANTE RESOLUCIÓN LOS ALCANCES Y PROCEDIMIENTOS.","EMITIR SENTENCIAS VINCULANTES.","LIDERAR LAS INVESTIGACIONES JUDICIALES DE EXTORSIÓN.","DETERMINAR LA SANCIÓN PENAL DE LOS INVESTIGADOS."],"a":1,"u":"(texto: (ART: 9)** Articulo 9.- Apoyo de las entidades publicas y privadas)**","m":1,"t":19},{"n":1390,"q":"DE ACUERDO CON EL ARTÍCULO ANALIZADO, ¿QUÉ FINALIDAD TIENE EL INTERCAMBIO DE INFORMACIÓN ENTRE ENTIDADES PÚBLICAS Y PRIVADAS?","o":["GARANTIZAR LA CONFIDENCIALIDAD TOTAL DE LAS OPERACIONES FINANCIERAS.","OBSTRUIR LA LABOR INVESTIGATIVA DEL MINISTERIO PÚBLICO.","FORTALECER LA LUCHA CONTRA LA EXTORSIÓN Y DELITOS CONEXOS.","PERMITIR LA COOPERACIÓN INTERNACIONAL EN CUALQUIER DELITO.","CREAR UNA BASE DE DATOS PÚBLICA SOBRE LOS INVESTIGADOS."],"a":2,"u":"(texto: (ART: 9)** Articulo 9.- Apoyo de las entidades publicas y privadas)**","m":1,"t":19},{"n":1391,"q":"SEGÚN EL ARTÍCULO 9, ¿CUÁLES SUJETOS PRIVADOS PUEDEN INTEGRARSE AL MECANISMO PÚBLICO-PRIVADO DE INTERCAMBIO DE INFORMACIÓN?","o":["ÚNICAMENTE BANCOS NACIONALES.","ÚNICAMENTE LAS PERSONAS JURÍDICAS INSCRITAS ANTE SUNAT.","LOS SUJETOS OBLIGADOS A INFORMAR A LA UIF-PERÚ EN MATERIA DE PREVENCIÓN DEL LAVADO DE ACTIVOS Y FINANCIAMIENTO DEL TERRORISMO.","CUALQUIER CIUDADANO INTERESADO EN LA PREVENCIÓN DEL DELITO.","SOLAMENTE EMPRESAS DE TELECOMUNICACIONES."],"a":2,"u":"(texto: (ART: 9)** Articulo 9.- Apoyo de las entidades publicas y privadas)**","m":1,"t":19},{"n":1392,"q":"¿CUÁL ES LA FUNCIÓN PRINCIPAL DE LA POLICÍA NACIONAL DEL PERÚ EN LA INVESTIGACIÓN DEL DELITO DE EXTORSIÓN Y SUS DELITOS CONEXOS SEGÚN EL ARTÍCULO 10 DEL D.LEG 1611?","o":["TOMAR DECISIONES AUTÓNOMAS SOBRE MEDIDAS RESTRICTIVAS DE DERECHOS DURANTE LA INVESTIGACIÓN.","DIRIGIR Y CONDUCIR ÍNTEGRAMENTE LA INVESTIGACIÓN FISCAL Y POLICIAL.","RECOMENDAR LA ESTRATEGIA DE LA INVESTIGACIÓN AL FISCAL Y EJECUTAR ACCIONES TÉCNICAS NECESARIAS BAJO CONDUCCIÓN FISCAL.","EMITIR RESOLUCIONES JUDICIALES FRENTE A HALLAZGOS RELEVANTES.","DICTAR MEDIDAS CAUTELARES ADMINISTRATIVAS SOBRE BIENES INCAUTADOS."],"a":2,"u":"(texto: (ART: 10)** Articulo 10.- Sobre la investigacion de la Policia Nacional del Peru)**","m":1,"t":19},{"n":1393,"q":"FRENTE A LA INCAUTACIÓN DE VEHÍCULOS O BIENES INMUEBLES VINCULADOS A DELITOS DE EXTORSIÓN Y CONEXOS, ¿QUÉ PROCEDIMIENTO SE DEBE SEGUIR SEGÚN EL ARTÍCULO 10?","o":["REMITIR EL BIEN DE MANERA INMEDIATA A LA MUNICIPALIDAD CORRESPONDIENTE.","LA INCAUTACIÓN DEBE SER CONFIRMADA POR UN JUEZ A SOLICITUD DEL FISCAL EN UN PLAZO DE 48 HORAS DESDE LA INCAUTACIÓN.","ESPERAR AUTORIZACIÓN EXPRESA DEL PROPIETARIO LEGÍTIMO ANTES DE INCAUTAR EL BIEN.","ORDENAR LA DESTRUCCIÓN DEL BIEN INCAUTADO EN LAS PRIMERAS 24 HORAS.","DISPONER LA INMEDIATA VENTA PÚBLICA DEL BIEN INCAUTADO PARA EVITAR SU DETERIORO."],"a":1,"u":"(texto: (ART: 10)** Articulo 10.- Sobre la investigacion de la Policia Nacional del Peru)**","m":1,"t":19},{"n":1394,"q":"¿CUÁL DE LOS SIGUIENTES PRESUPUESTOS NO ES REQUISITO PARA LA INCAUTACIÓN DE VEHÍCULOS O INMUEBLES SEGÚN EL ARTÍCULO 10 DEL D.LEG 1611?","o":["EXISTENCIA DE VINCULACIÓN ENTRE EL HECHO INDICADOR Y EL BIEN.","TITULARIDAD DE LA PROPIEDAD DEL BIEN RECAYENDO EN PRESUNTOS AUTORES O PARTÍCIPES.","CAPACIDAD ECONÓMICA DEL TITULAR PARA ADQUIRIR EL BIEN.","POSIBILIDAD DE CONOCIMIENTO DEL USO ILÍCITO DEL BIEN POR PARTE DEL TITULAR AJENO Y SU OMISIÓN EN DENUNCIAR O RESOLVER EL CONTRATO.","EL BIEN HAYA SIDO UTILIZADO COMO CENTRO DE OPERACIONES CRIMINALES O REFUGIO DE DELINCUENTES."],"a":2,"u":"(texto: (ART: 10)** Articulo 10.- Sobre la investigacion de la Policia Nacional del Peru)**","m":1,"t":19},{"n":1395,"q":"¿CUÁL DE LAS SIGUIENTES TÉCNICAS ESPECIALES DE INVESTIGACIÓN MENCIONADAS NO REQUIERE NECESARIAMENTE AUTORIZACIÓN JUDICIAL SEGÚN EL ARTÍCULO 10 DEL D.LEG 1611?","o":["INTERVENCIÓN LEGAL DE LAS COMUNICACIONES MEDIANTE LEVANTAMIENTO JUDICIAL DEL SECRETO.","OBSERVACIÓN, VIGILANCIA Y SEGUIMIENTO.","LEVANTAMIENTO DEL SECRETO BANCARIO.","LEVANTAMIENTO DE LA RESERVA TRIBUTARIA.","GEOLOCALIZACIÓN Y RASTREO VINCULADOS A ACTIVIDADES INTERNACIONALES."],"a":1,"u":"(texto: (ART: 10)** Articulo 10.- Sobre la investigacion de la Policia Nacional del Peru)**","m":1,"t":19},{"n":1396,"q":"¿EN QUÉ SUPUESTO EL TITULAR DE UN BIEN INMUEBLE PODRÍA VERSE COMPROMETIDO EN LA INVESTIGACIÓN DE EXTORSIÓN SIN SER AUTOR DIRECTO, DE ACUERDO AL ARTÍCULO 10 DEL D.LEG 1611?","o":["CUANDO NO REALIZA EL PAGO OPORTUNO DE IMPUESTOS PREDIALES.","CUANDO FACILITA EL USO DEL BIEN CON FINES LÍCITOS DOCUMENTADOS.","CUANDO, AUN SIN SER AUTOR, TENÍA POSIBILIDAD DE CONOCER EL USO ILÍCITO Y NO DENUNCIÓ NI ACTUÓ PARA RESOLVER EL CONTRATO O DESALOJAR.","CUANDO ALQUILA EL BIEN A UNA EMPRESA RECONOCIDA LEGALMENTE.","CUANDO TRANSFIERE LA PROPIEDAD MEDIANTE ESCRITURA PÚBLICA Y YA NO TIENE POSESIÓN."],"a":2,"u":"(texto: (ART: 10)** Articulo 10.- Sobre la investigacion de la Policia Nacional del Peru)**","m":1,"t":19},{"n":1397,"q":"RESPECTO A LOS BIENES INCAUTADOS POR LA POLICÍA NACIONAL DEL PERÚ, ¿QUÉ CARACTERÍSTICA DEBEN CUMPLIR PARA SER INCAUTADOS SEGÚN EL ARTÍCULO 10 DEL D.LEG 1611?","o":["SOLO PUEDEN INCAUTARSE SI HAN SIDO ROBADOS DE UNA DEPENDENCIA ESTATAL.","DEBEN SER BIENES AUTOMOTORES Y, EN CASO DE COMPUTADORAS, SÓLO SI SON NUEVAS.","PUEDEN SER INCAUTADOS SI SE DUDA DE LA LEGALIDAD DE SU ORIGEN Y SE ENCUENTRAN VINCULADOS A DELITOS INVESTIGADOS.","ES IRRELEVANTE LA DOCUMENTACIÓN DEL BIEN A INCAUTAR.","PUEDEN SER DECOMISADOS POR CUALQUIER AGENTE PÚBLICO SIN REQUISITOS ADICIONALES."],"a":2,"u":"(texto: (ART: 10)** Articulo 10.- Sobre la investigacion de la Policia Nacional del Peru)**","m":1,"t":19},{"n":1398,"q":"¿QUÉ ACCIÓN PUEDE TOMAR LA POLICÍA NACIONAL DEL PERÚ RESPECTO A CENTROS DE OPERACIONES ILÍCITAS CONFORME AL ARTÍCULO 10 DEL D.LEG 1611?","o":["SOLICITAR SU CLAUSURA ADMINISTRATIVA POR PARTE DE LA MUNICIPALIDAD.","EJECUTAR VIGILANCIA Y SEGUIMIENTO PARA IDENTIFICACIÓN, INDIVIDUALIZACIÓN Y DOCUMENTACIÓN DE LAS ACTIVIDADES CRIMINALES.","REMITIR UN INFORME PRO FORMA SIN INTERVENCIÓN DIRECTA.","ORDENAR JUDICIALMENTE EL DESALOJO INMEDIATO.","APROPIAR TEMPORALMENTE LOS BIENES DEL LUGAR CON FINES RECAUDATORIOS."],"a":1,"u":"(texto: (ART: 10)** Articulo 10.- Sobre la investigacion de la Policia Nacional del Peru)**","m":1,"t":19},{"n":1399,"q":"¿QUÉ TÉCNICA ESPECIAL DE INVESTIGACIÓN PERMITE A LA POLICÍA NACIONAL DEL PERÚ CONOCER INTERNAMENTE LAS OPERACIONES ILÍCITAS DE UNA ORGANIZACIÓN, SEGÚN EL ARTÍCULO 10 DEL D.LEG 1611?","o":["OBSERVACIÓN INDIRECTA MEDIANTE CIRCUITOS CERRADOS DE TERCEROS.","USO DE AGENTES ENCUBIERTOS O AGENTES ESPECIALES.","LEVANTAMIENTO DEL SECRETO BANCARIO SIN ORDEN JUDICIAL.","EMISIÓN DE ALERTAS PREVENTIVAS EN MEDIOS MASIVOS.","RECOLECCIÓN DE TESTIMONIOS ANÓNIMOS EXCLUSIVAMENTE."],"a":1,"u":"(texto: (ART: 10)** Articulo 10.- Sobre la investigacion de la Policia Nacional del Peru)**","m":1,"t":19},{"n":1400,"q":"CUANDO LA POLICÍA REQUIERE INFORMACIÓN DE REGISTROS OFICIALES O PRIVADOS DURANTE LA INVESTIGACIÓN, ¿CUÁL ES EL PROCEDIMIENTO CORRECTO SEGÚN EL ARTÍCULO 10 DEL D.LEG 1611?","o":["SOLICITAR SIEMPRE INFORMACIÓN EN DOCUMENTOS EN PAPEL FIRMADOS ANTE NOTARIO.","LOS REQUERIDOS DEBEN SUMINISTRAR DATOS SIN DILACIÓN A TRAVÉS DE SOPORTES MAGNÉTICOS O ELECTRÓNICOS, SALVO EXCEPCIONES LEGALES.","EXIGIR LA PRESENCIA FÍSICA DE TODOS LOS TITULARES EN LA ENTREGA DE INFORMACIÓN.","COORDINAR LA ENTREGA CON LA DEFENSORÍA DEL PUEBLO.","PERMITIR QUE LA ENTIDAD REQUERIDA ENTREGUE LOS DATOS EN UN PLAZO NO MENOR A 30 DÍAS HÁBILES."],"a":1,"u":"(texto: (ART: 10)** Articulo 10.- Sobre la investigacion de la Policia Nacional del Peru)**","m":1,"t":19},{"n":1401,"q":"EL NIVEL DE FUERZA A EMPLEAR ES UNO DE LOS ASPECTOS IMPORTANTES QUE SE TIENEN QUE TENER EN CUENTA EN LAS TECNICAS DE INTERVENCION, Y SE REFIERE A:","o":["SE DEBE CONSIDERAR LAS CARACTERÍSTICAS DEL LUGAR DE LA INTERVENCIÓN (UBICACIÓN, ESTRUCTURAS DESCONOCIDAS, CALLEJONES, EDIFICACIONES, ILUMINACIÓN, ENTRE OTROS) QUE PUEDAN REPRESENTAR UN RIESGO PARA LA INTEGRIDAD DEL EFECTIVO POLICIAL O DE TERCEROS, ASÍ COMO EL POSIBLE APOYO DE OTRAS PERSONAS AL INFRACTOR.","EL EFECTIVO POLICIAL DEBE TENER EN CUENTA EL COMPORTAMIENTO DE LA PERSONA A INTERVENIR, QUE PUEDE SER DE COLABORACIÓN, RESISTENCIA PASIVA O ACTIVA, LLEGANDO INCLUSIVE A LA AGRESIÓN LETAL.","ESTA INTERVENCIÓN SE DEBE INICIAR CON LA VERBALIZACIÓN.","LUEGO DE UNA APRECIACIÓN DE LA SITUACIÓN Y LAS CIRCUNSTANCIAS QUE SE PRESENTAN EN LA INTERVENCIÓN, EL EFECTIVO POLICIAL EMPLEARÁ LA FUERZA, DE ACUERDO AL NIVEL DE RESISTENCIA DE LA PERSONA A INTERVENIR.","FORMAR EL CONO DE SEGURIDAD, TOMANDO UNA DISTANCIA APROXIMADA DE DOS BRAZOS EXTENDIDOS, QUE IMPIDA AL INTERVENIDO ATENTAR CONTRA LA INTEGRIDAD FÍSICA DEL O LOS EFECTIVOS POLICIALES; DE EXISTIR UNA PARED (INMUEBLE), EL EFECTIVO QUE DA LA SEGURIDAD DEBE UBICARSE DE ESPALDAS A ÉSTA."],"a":3,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1402,"q":"INTERVENCIÓN A PERSONAS EN LA VÍA POR EFECTIVOS POLICIALES A PIE.- SE HAN CONSIDERADO DOS SITUACIONES QUE SE PRESENTAN EN FORMA COTIDIANA EN EL SERVICIO POLICIAL: LA PRIMERA, CON FINES DE IDENTIFICACIÓN, Y LA SEGUNDA, CUANDO SE TRATE DE UN PRESUNTO INFRACTOR. SIN EMBARGO ...:","o":["UNA NO ES EXCLUYENTE DE LA OTRA.","UNA ES EXCLUYENTE DE LA OTRA.","UNA NO ES INCLUYENTE DE LA OTRA.","UNA ES INCLUYENTE DE LA OTRA.","EN OCASIONES AMBAS SITUACIONES NO SE CUMPLEN."],"a":0,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1403,"q":"LA PERCEPCIÓN DEL RIESGO ES UNO DE LOS ASPECTOS IMPORTANTES QUE SE TIENEN QUE TENER EN CUENTA EN LAS TÉCNICAS DE INTERVENCIÓN, DONDE SE DEBE CONSIDERAR LAS CARACTERÍSTICAS DEL LUGAR DE LA INTERVENCIÓN (UBICACIÓN, ESTRUCTURAS DESCONOCIDAS, CALLEJONES, EDIFICACIONES, ILUMINACIÓN, ENTRE OTROS) QUE PUEDAN REPRESENTAR UN RIESGO PARA LA INTEGRIDAD DEL PERSONAL POLICIAL O DE TERCEROS, ASÍ COMO EL POSIBLE....:","o":["APOYO POLICIAL.","INCREMENTO DE LAS FUERZAS AMIGAS.","EVENTO DE FUGA DE LA PERSONA INTERVENIDA.","APOYO DE OTRAS PERSONAS AL INFRACTOR.","ATAQUE TERRORISTA."],"a":3,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1404,"q":"EL NIVEL DE FUERZA A EMPLEAR ES UNO DE LOS ASPECTOS IMPORTANTES QUE SE TIENEN QUE TENER EN CUENTA EN LAS TECNICAS DE INTERVENCION, EN LA CUAL, LUEGO DE UNA APRECIACIÓN DE LA SITUACIÓN Y LAS CIRCUNSTANCIAS QUE SE PRESENTAN EN LA INTERVENCIÓN, EL PERSONAL POLICIAL EMPLEARÁ LA FUERZA, DE ACUERDO.....:","o":["A LA FUERZA QUE SE PUEDA EJERCER SOBRE LA PERSONA A INTERVENIR.","A LA EDAD DEL EFECTIVO POLICIAL.","A LA CONDICIÓN FISICA DEL EFECTIVO POLICIAL.","A LA EDAD DE LA PERSONA A INTERVENIR.","AL NIVEL DE RESISTENCIA DE LA PERSONA A INTERVENIR."],"a":4,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1405,"q":"INTERVENCIÓN A PERSONAS EN LA VÍA POR EFECTIVOS POLICIALES A PIE.- RESPECTO A LA INTERVENCIÓN CON FINES DE IDENTIFICACIÓN, ES CONVENIENTE TENER EN CONSIDERACIÓN LOS SIGUIENTES ASPECTOS:","o":["IDENTIFICARSE (SALUDO, GRADO, APELLIDOS, UNIDAD EN LA QUE PRESTA SERVICIO), HACIÉNDOLE CONOCER EL MOTIVO DE LA INTERVENCIÓN.","PUEDEN PRESENTARSE DURANTE EL PATRULLAJE O A MÉRITO DE UNA COMUNICACIÓN RADIAL O TELEFÓNICA DE LA UNIDAD POLICIAL.","ESTAS INTERVENCIONES SON LAS QUE REPRESENTAN UN MAYOR NIVEL DE RIESGO PARA LOS EFECTIVOS POLICIALES","ES DE SUMA IMPORTANCIA QUE LA INFORMACIÓN QUE RECABEN LOS EFECTIVOS QUE VAN A INTERVENIR SEA DETALLADA CON LA FINALIDAD DE TOMAR CONOCIMIENTO DE LA SITUACIÓN.","EL POLICÍA DEBE IDENTIFICARSE COMO TAL EXPRESANDO EN VOZ ALTA: ¡ALTO POLICÍA!"],"a":0,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1406,"q":"¿QUÉ ASPECTOS IMPORTANTES SE TIENEN QUE TENER EN CUENTA EN LAS TÉCNICAS DE INTERVENCIÓN?","o":["EL NÚMERO DE EFECTIVOS.","EL CONO DE SEGURIDAD.","LA ZONA DE RIESGO Y LA ZONA DE SEGURIDAD.","EL NIVEL DE FUERZA A EMPLEAR","LA LÍNEA IMAGINARIA QUE DIVIDE LA ZONA DE RIESGO Y LA ZONA DE SEGURIDAD"],"a":3,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1407,"q":"INTERVENCIÓN A PERSONAS EN LA VÍA POR EFECTIVOS POLICIALES A PIE.- INDIQUE LA ALTERNATIVA QUE FORMA PARTE DE LOS PASOS QUE SE DEBEN TENER EN CUENTA AL MOMENTO DE UNA INTERVENCIÓN A UN PRESUNTO INFRACTOR:","o":["CULMINADA LA INTERVENCIÓN SIN NOVEDAD, EL POLICÍA DE CONTACTO (P1) AGRADECERÁ SU COLABORACIÓN, DESPLAZÁNDOSE LUEGO HACIA LA UBICACIÓN DEL POLICÍA DE SEGURIDAD (P2), PARA QUE EL CIUDADANO REINICIE SU CAMINO ACOMPAÑÁNDOLO CON LA MIRADA HASTA CIERTA DISTANCIA.","EFECTUAR PREGUNTAS RELACIONADAS A LOS DATOS CONSIGNADOS EN EL DOCUMENTO DE IDENTIDAD CON LA FINALIDAD DE CONTRASTARLOS, O FORMULAR PREGUNTAS MODIFICANDO ALGUNOS DATOS QUE PERMITAN ESTABLECER LA TITULARIDAD DE LOS MISMOS; POR EJEMPLO, MENCIONARLE COMO SU SEGUNDO NOMBRE UNO QUE NO LE CORRESPONDE.","SOLICITARLE SUS DOCUMENTOS DE IDENTIFICACIÓN PERSONAL, PERMANECIENDO SIEMPRE EN UNA ACTITUD VIGILANTE, SIN DESCUIDAR EL CONTACTO VISUAL.","AL VERIFICAR LOS DOCUMENTOS, HACERLO EN UNA POSICIÓN TAL QUE NO OBSTACULICE EL DOMINIO VISUAL, PRINCIPALMENTE DE LAS MANOS DEL INTERVENIDO.","HACERLE SABER EL MOTIVO DE LA INTERVENCIÓN, POR EJEMPLO: ES USTED SOSPECHOSO DE .....; O HA COMETIDO EL DELITO DE ........;"],"a":4,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1408,"q":"INTERVENCIÓN A PERSONAS EN LA VÍA POR EFECTIVOS POLICIALES A PIE.- RESPECTO A LA INTERVENCIÓN A UN PRESUNTO INFRACTOR, INDIQUE EL ENUNCIADO CORRECTO:","o":["ESTAS INTERVENCIONES SON LAS QUE REPRESENTAN UN MAYOR NIVEL DE RIESGO PARA EL PERSONAL POLICIAL. PUEDEN PRESENTARSE DURANTE EL PATRULLAJE O A MÉRITO DE UNA COMUNICACIÓN RADIAL O TELEFÓNICA DE LA UNIDAD POLICIAL. EN ESE SENTIDO, ES DE SUMA IMPORTANCIA QUE LA INFORMACIÓN QUE RECABE EL PERSONAL POLICIAL QUE VA A INTERVENIR SEA DETALLADA CON LA FINALIDAD DE TOMAR CONOCIMIENTO DE LA SITUACIÓN.","SE INDIVIDUALIZA CLARAMENTE A LA PERSONA A INTERVENIR (VESTIMENTA, CARACTERÍSTICAS FÍSICAS, SEXO, ETC.)","SE RECIBE LOS DOCUMENTOS CON LA MANO QUE NO PORTE EL ARMA DE FUEGO; ESTO PARA PERMITIR QUE ANTE UNA EVENTUAL REACCIÓN PUEDA USARLA CON LIBERTAD DE ACCIÓN.","IDENTIFICARSE (GRADO, APELLIDOS Y UNIDAD EN LA QUE PRESTA SERVICIO), HACIÉNDOLE CONOCER EL MOTIVO DE LA INTERVENCIÓN.","SE SOLICITA SUS DOCUMENTOS DE IDENTIFICACIÓN PERSONAL, PERMANECIENDO SIEMPRE EN UNA ACTITUD VIGILANTE, SIN DESCUIDAR EL CONTACTO VISUAL."],"a":0,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1409,"q":"INTERVENCIÓN A PERSONAS EN LA VÍA POR EFECTIVOS POLICIALES A PIE.- RESPECTO A LA INTERVENCIÓN A UN PRESUNTO INFRACTOR, INDIQUE EL ENUNCIADO CORRECTO.","o":["SE FORMAR EL CONO DE SEGURIDAD, TOMANDO UNA DISTANCIA APROXIMADA DE DOS BRAZOS EXTENDIDOS, QUE IMPIDA AL INTERVENIDO ATENTAR CONTRA LA INTEGRIDAD FÍSICA DEL O LOS EFECTIVOS POLICIALES; DE EXISTIR UNA PARED (INMUEBLE), EL EFECTIVO QUE DA LA SEGURIDAD DEBE UBICARSE DE ESPALDAS A ÉSTA.","SE INDIVIDUALIZA CLARAMENTE A LA PERSONA A INTERVENIR (VESTIMENTA, CARACTERÍSTICAS FÍSICAS, SEXO, ETC.)","ESTA INTERVENCION SON LA QUE REPRESENTA UN MAYOR NIVEL DE RIESGO PARA EL PERSONAL POLICIAL.","IDENTIFICARSE (GRADO, APELLIDOS Y UNIDAD EN LA QUE PRESTA SERVICIO), HACIÉNDOLE CONOCER EL MOTIVO DE LA INTERVENCIÓN.","SE SOLICITA SUS DOCUMENTOS DE IDENTIFICACIÓN PERSONAL, PERMANECIENDO SIEMPRE EN UNA ACTITUD VIGILANTE, SIN DESCUIDAR EL CONTACTO VISUAL."],"a":2,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1410,"q":"INTERVENCIÓN A PERSONAS EN LA VÍA POR EFECTIVOS POLICIALES A PIE.- INDIQUE LA ALTERNATIVA QUE NO FORMA PARTE DE LOS PASOS QUE SE DEBEN TENER EN CUENTA AL MOMENTO DE UNA INTERVENCIÓN A UN PRESUNTO INFRACTOR:","o":["EL POLICÍA DEBE IDENTIFICARSE COMO TAL EXPRESANDO EN VOZ ALTA: ¡ALTO POLICÍA!","¡LEVANTE LAS MANOS, MÍREME!","HACERLE SABER EL MOTIVO DE LA INTERVENCIÓN, POR EJEMPLO: ES USTED SOSPECHOSO DE ..... O HA COMETIDO EL DELITO DE ........","INDICARLE QUE SE LE VA A IDENTIFICAR Y REGISTRAR, PARA QUE ASÍ PUEDA COLABORAR CON LA INTERVENCIÓN. DE SER NECESARIO, ORDENAR QUE ADOPTE UNA POSICIÓN APROPIADA PARA LA INMOVILIZACIÓN TEMPORAL (COLOCÁNDOLE LOS GRILLETES) Y REALIZAR EL REGISTRO PRELIMINAR.","CULMINADA LA INTERVENCIÓN SIN NOVEDAD, EL POLICÍA DE CONTACTO (P1) AGRADECERÁ SU COLABORACIÓN, DESPLAZÁNDOSE LUEGO HACIA LA UBICACIÓN DEL POLICÍA DE SEGURIDAD (P2), PARA QUE EL CIUDADANO REINICIE SU CAMINO ACOMPAÑÁNDOLO CON LA MIRADA HASTA CIERTA DISTANCIA."],"a":4,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1411,"q":"INTERVENCIÓN A PERSONAS EN LA VÍA POR EFECTIVOS POLICIALES A PIE.- COMPLETE CORRECTAMENTE RESPECTO A LA INTERVENCIÓN A UN PRESUNTO INFRACTOR: UNA ACCIÓN QUE AYUDARÁ A MINIMIZAR LOS RIESGOS ES (.................). ELLO NOS PERMITIRÁ UBICAR CUALQUIER TIPO DE AMENAZA (ARMA U OBJETO). ESTA ACCIÓN SE EFECTÚA EN EL MOMENTO QUE EL INTERVENIDO SE ENCUENTRA FRENTE AL EFECTIVO POLICIAL QUE REALIZA EL CONTACTO VERBAL, DESDE LA LÍNEA IMAGINARIA QUE DIVIDE EL ÁREA DE SEGURIDAD Y LA DE RIESGO.","o":["EFECTUAR UN REGISTRO CORPORAL DEL INTERVENIDO.","EFECTUAR UN ALLANAMIENTO AL DOMICILIO DEL INTERVENIDO.","EFECTUAR UN REGISTRO AL DOMICILIO DEL INTERVENIDO.","EFECTUAR UN REGISTRO PERSONAL DEL INTERVENIDO.","EFECTUAR UN REGISTRO VISUAL DEL INTERVENIDO."],"a":4,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1412,"q":"INTERVENCIÓN A PERSONAS EN LA VÍA POR EFECTIVOS POLICIALES A PIE.- COMPLETE CORRECTAMENTE RESPECTO A LA INTERVENCIÓN A UN PRESUNTO INFRACTOR: UNA ACCIÓN QUE AYUDARÁ A MINIMIZAR LOS RIESGOS ES EFECTUAR UN REGISTRO VISUAL DEL INTERVENIDO. ELLO NOS PERMITIRÁ UBICAR CUALQUIER TIPO DE AMENAZA (ARMA U OBJETO). ESTA ACCIÓN SE EFECTÚA (...................), DESDE LA LÍNEA IMAGINARIA QUE DIVIDE EL ÁREA DE SEGURIDAD Y LA DE RIESGO.","o":["EN EL MOMENTO QUE EL INTERVENIDO SE ENCUENTRA FRENTE AL POLICÍA QUE REALIZA EL CONTACTO VERBAL.","EN EL MOMENTO QUE EL INTERVENIDO SE ENCUENTRA FRENTE AL EFECTIVO POLICIAL QUE REALIZA EL CONTACTO VISUAL.","DESPUÉS QUE SE REALIZA EL CONTACTO VISUAL.","EN EL MOMENTO QUE EL INTERVENIDO SE ENCUENTRA DISTANTE AL EFECTIVO POLICIAL QUE REALIZA EL CONTACTO VERBAL.","EN EL MOMENTO QUE EL INTERVENIDO SE ENCUENTRA LEJOS AL EFECTIVO POLICIAL QUE REALIZA EL CONTACTO VERBAL."],"a":0,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1413,"q":"INTERVENCIÓN A PERSONAS EN LA VÍA POR EFECTIVOS POLICIALES A PIE.- INTERVENCIÓN A UN PRESUNTO INFRACTOR: PARA EFECTUAR EL ARRESTO, EL EFECTIVO POLICIAL PUEDE UTILIZAR BÁSICAMENTE TRES POSICIONES, LAS CUALES SON: DE PIE, DE RODILLAS, Y TENDIDO O ECHADO. ELIJA LA ALTERNATIVA QUE SE RELACIONE CON LA POSICIÓN DE PIE:","o":["ES RECOMENDABLE EMPLEAR ESTA TÉCNICA CUANDO EL INFRACTOR SE ENCUENTRA EN UN AMBIENTE ABIERTO.","ESTA POSICIÓN ES RECOMENDABLE CUANDO EN EL LUGAR DE LA INTERVENCIÓN EXISTE UN MURO, PARED, ETC. DONDE EL INFRACTOR SE PUEDA APOYARSE.","EFECTUADO EL CONTACTO VISUAL E INICIADA LA VERBALIZACIÓN, SE ORDENARÁ AL INTERVENIDO COLOCARSE FRENTE A LOS POLICÍAS, A UNA DISTANCIA QUE PERMITA DOMINAR LA SITUACIÓN, FORMANDO EL CONO DE SEGURIDAD; SE LE INDICA QUE LEVANTE LOS BRAZOS, CON LAS MANOS TOTALMENTE ALEJADAS UNA DE OTRA Y LOS DEDOS SEPARADOS.","ESTA POSICIÓN ES LA MÁS SEGURA, REPRESENTA MENOS RIESGO O POSIBILIDAD DE REACCIÓN DEL INFRACTOR. ES LA MÁS RECOMENDABLE CUANDO EXISTA MÁS DE UN INTERVENIDO.","UTILIZANDO LA VERBALIZACIÓN SE ORDENARÁ AL INTERVENIDO UBICARSE FRENTE A LOS EFECTIVOS POLICIALES, A UNA DISTANCIA QUE LES PERMITA DOMINAR LA SITUACIÓN Y FORMAR EL CONO DE SEGURIDAD, INDICÁNDOLE QUE LEVANTE LOS BRAZOS, CON LAS MANOS TOTALMENTE ALEJADAS UNA DE OTRA Y LOS DEDOS SEPARADOS."],"a":1,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1414,"q":"¿QUÉ ASPECTOS IMPORTANTES SE TIENEN QUE TENER EN CUENTA EN LAS TÉCNICAS DE INTERVENCIÓN?","o":["EL NÚMERO DE EFECTIVOS POLICIALES.","LA ACTITUD DE LA PERSONA A SER INTERVENIDA.","LA ZONA DE RIESGO Y LA ZONA DE SEGURIDAD.","LA LÍNEA IMAGINARIA QUE DIVIDE LA ZONA DE RIESGO Y LA ZONA DE SEGURIDAD.","EL CONO DE SEGURIDAD."],"a":1,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1415,"q":"INTERVENCIÓN A PERSONAS EN LA VÍA POR EFECTIVOS POLICIALES A PIE.- INTERVENCIÓN A UN PRESUNTO INFRACTOR: PARA EFECTUAR EL ARRESTO, EL EFECTIVO POLICIAL PUEDE UTILIZAR BÁSICAMENTE TRES POSICIONES, LAS CUALES SON: DE PIE, DE RODILLAS, Y TENDIDO O ECHADO. SI DURANTE LA EJECUCIÓN DEL PROCEDIMIENTO DEL ARRESTO EN LA POSICIÓN TENDIDO O ECHADO, EL INTERVENIDO SE TORNA VIOLENTO, EL EFECTIVO POLICIAL DE CONTACTO SE ALEJARA RÁPIDAMENTE DE ÉL, RETORNANDO A SU ÁREA DE SEGURIDAD EMPUÑANDO SU ARMA, Y REINICIANDO LA (...............) PARA RETOMAR EL PROCEDIMIENTO.","o":["INTERVENCIÓN.","VERBALIZACIÓN.","TÉCNICA DE CONDUCCIÓN.","TÉCNICA DE INTERVENCIÓN.","SECUENCIA DE INTERVENCIÓN."],"a":1,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1416,"q":"INTERVENCIÓN A PERSONAS EN LA VÍA POR EFECTIVOS POLICIALES A PIE.- INTERVENCIÓN A UN PRESUNTO INFRACTOR: PARA EFECTUAR EL ARRESTO, EL EFECTIVO POLICIAL PUEDE UTILIZAR BÁSICAMENTE TRES POSICIONES, LAS CUALES SON: DE PIE, DE RODILLAS, Y TENDIDO O ECHADO. SI DURANTE LA EJECUCIÓN DEL PROCEDIMIENTO DEL ARRESTO EN LA POSICIÓN TENDIDO O ECHADO, EL INTERVENIDO SE TORNA VIOLENTO, EL (.................) SE ALEJARA RÁPIDAMENTE DE ÉL, RETORNANDO A SU ÁREA DE SEGURIDAD EMPUÑANDO SU ARMA, Y REINICIANDO LA VERBALIZACIÓN PARA RETOMAR EL PROCEDIMIENTO.","o":["POLICÍA DE CONTACTO.","INTERVENIDO.","EFECTIVO POLICIAL QUE INTERVIENE.","EFECTIVO POLICIAL DE SEGURIDAD.","EFECTIVO POLICIAL DE APOYO."],"a":0,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1417,"q":"LA PERCEPCIÓN DEL RIESGO ES UNO DE LOS ASPECTOS IMPORTANTES QUE SE TIENEN QUE TENER EN CUENTA EN LAS TECNICAS DE INTERVENCION, Y SE REFIERE A:","o":["SE DEBE CONSIDERAR LAS CARACTERÍSTICAS DEL LUGAR DE LA INTERVENCIÓN (UBICACIÓN, ESTRUCTURAS DESCONOCIDAS, CALLEJONES, EDIFICACIONES, ILUMINACIÓN, ENTRE OTROS) QUE PUEDAN REPRESENTAR UN RIESGO PARA LA INTEGRIDAD DEL EFECTIVO POLICIAL O DE TERCEROS, ASÍ COMO EL POSIBLE APOYO DE OTRAS PERSONAS AL INFRACTOR.","EL EFECTIVO POLICIAL DEBE TENER EN CUENTA EL COMPORTAMIENTO DE LA PERSONA A INTERVENIR, QUE PUEDE SER DE COLABORACIÓN, RESISTENCIA PASIVA O ACTIVA, LLEGANDO INCLUSIVE A LA AGRESIÓN LETAL.","INTERVENCIONES CON ARMA DE FUEGO.","LUEGO DE UNA APRECIACIÓN DE LA SITUACIÓN Y LAS CIRCUNSTANCIAS QUE SE PRESENTAN EN LA INTERVENCIÓN, EL EFECTIVO POLICIAL EMPLEARÁ LA FUERZA, DE ACUERDO AL NIVEL DE RESISTENCIA DE LA PERSONA A INTERVENIR.","EL POLICÍA DEBE IDENTIFICARSE COMO TAL EXPRESANDO EN VOZ ALTA: !ALTO POLICÍA!"],"a":0,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1418,"q":"INTERVENCIÓN A PERSONAS EN LA VÍA POR EFECTIVOS POLICIALES A PIE.- INTERVENCIÓN A UN PRESUNTO INFRACTOR: PARA EFECTUAR EL ARRESTO, EL EFECTIVO POLICIAL PUEDE UTILIZAR BÁSICAMENTE TRES POSICIONES, LAS CUALES SON: DE PIE, DE RODILLAS, Y TENDIDO O ECHADO. DURANTE LA EJECUCIÓN DEL PROCEDIMIENTO DEL ARRESTO EN LA POSICIÓN DE RODILLAS, EFECTUADO EL CONTACTO VISUAL E INICIADA LA VERBALIZACIÓN, SE ORDENARÁ AL INTERVENIDO COLOCARSE FRENTE A LOS POLICÍAS, A UNA DISTANCIA (............), FORMANDO EL TRIÁNGULO DE SEGURIDAD; SE LE INDICA QUE LEVANTE LOS BRAZOS, CON LAS MANOS TOTALMENTE ALEJADAS UNA DE OTRA Y LOS DEDOS SEPARADOS.","o":["DE 10 METROS.","DE 5 METROS.","DE UN METRO.","DE OCHO METROS.","QUE PERMITA DOMINAR LA SITUACIÓN."],"a":4,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1419,"q":"INTERVENCIÓN A PERSONAS EN LA VÍA POR EFECTIVOS POLICIALES A PIE.- INTERVENCIÓN A UN PRESUNTO INFRACTOR: PARA EFECTUAR EL ARRESTO, EL EFECTIVO POLICIAL PUEDE UTILIZAR BÁSICAMENTE TRES POSICIONES, LAS CUALES SON: DE PIE, DE RODILLAS, Y TENDIDO O ECHADO. DURANTE LA EJECUCIÓN DEL PROCEDIMIENTO DEL ARRESTO EN LA POSICIÓN DE RODILLAS, LUEGO DE COLOCARLE LAS GRILLETES SE PROCEDERÁ ....:","o":["A LA VERBALIZACIÓN.","AL REGISTRO MINUCIOSO DEL INFRACTOR.","A LA CONDUCCIÓN INMEDIATA DEL INFRACTOR.","A LEERLE SUS DERECHOS AL INFRACTOR.","A IDENTIFICAR AL INFRACTOR."],"a":1,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1420,"q":"LA POLICÍA DE SEGURIDAD EN LA POSICIÓN DE TENDIDO O ECHADO DEBE VERBALIZAR PARA OBTENER INFORMACIÓN Y NO PERMITIR QUE EL INTERVENIDO SE CONCENTRE EN:","o":["PLANIFICAR UNA RESPUESTA VIOLENTA CONTRA SU INTEGRIDAD FÍSICA.","PLANIFICAR SU FUGA.","SU FAMILIA.","PLANIFICAR UNA RESPUESTA VIOLENTA CONTRA LA ACCIÓN DEL POLICÍA DE CONTACTO.","PLANIFICAR UNA RESPUESTA PACÍFICA CONTRA LA ACCIÓN DEL POLICÍA DE SEGURIDAD."],"a":3,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1421,"q":"RESPECTO A LAS TÉCNICAS DE INTERVENCIÓN, EN CASO QUE LA INTERVENCIÓN SEA EJECUTADA POR DOS POLICIAS A PIE, ÉSTOS DEBEN FORMAR EN LO POSIBLE UN (.....................), EN CUYA BASE DEBEN UBICARSE LOS POLICÍAS INTERVENTORES, Y EN EL VÉRTICE O PUNTO MEDIO PROYECTADO DEL TRIÁNGULO.","o":["TRIÁNGULO DE RESPUESTA.","TRIÁNGULO DE SEGURIDAD.","LÍNEA IMAGINARIA.","TRIÁNGULO IMAGINARIO.","ÁREA DE SEGURIDAD."],"a":1,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1422,"q":"AL SER COMUNICADO DE UNA INTERVENCIÓN EN INMUEBLES O EN OTROS LUGARES QUE AMERITEN DESPLAZARSE POR UNA ZONA NO RECONOCIDA E INSEGURA, SE DEBE UTILIZAR LOS PRINCIPIOS DEL PENSAMIENTO TÁCTICO PARA EVALUAR LAS POSIBLES ÁREAS DE RIESGO. SE DEBEN ANTICIPAR LAS SITUACIONES PELIGROSAS Y MANTENERSE LISTOS PARA DEFENDERSE. EL ENUNCIADO ANTERIOR CORRESPONDE A:","o":["INTERVENCIÓN EN INMUEBLES: INGRESO.","INTERVENCIÓN EN INMUEBLES: DESPLAZAMIENTOS.","INTERVENCIÓN EN INMUEBLES: RECONOCIMIENTO.","INTERVENCIÓN EN INMUEBLES: PASADIZOS.","INTERVENCIÓN EN INMUEBLES: ESCALERAS."],"a":1,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1423,"q":"SE DEBE TENER SIEMPRE PRESENTE QUE POR MÁS INFORMACIÓN QUE SE OBTENGA DEL INMUEBLE, LOS AMBIENTES INTERIORES CONSTITUYEN ZONAS DE RIESGO PERMANENTE. ESTAS ZONAS SON CONTROLADAS Y CONVERTIDAS EN ÁREAS SEGURAS UNA POR UNA. OTRO ASPECTO A CONSIDERAR ES EL DISEÑO Y MATERIAL EMPLEADOS EN SU CONSTRUCCIÓN, ELLO CONLLEVA UN TRABAJO PROFESIONAL ALTAMENTE COORDINADO, DONDE PRIME LA SEGURIDAD COMO NORMA BÁSICA Y SE LA EJECUTE CON SIGILO, DINAMISMO, DESTREZA Y CONTROL EMOCIONAL. EL ENUNCIADO ANTERIOR CORRESPONDE A:","o":["INTERVENCIÓN EN INMUEBLES: INGRESO.","INTERVENCIÓN EN INMUEBLES: DESPLAZAMIENTOS.","INTERVENCIÓN EN INMUEBLES: RECONOCIMIENTO.","INTERVENCIÓN EN INMUEBLES: PASADIZOS.","INTERVENCIÓN EN INMUEBLES: ESCALERAS."],"a":2,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1424,"q":"EN CASO QUE LA INTERVENCIÓN SEA EJECUTADA POR DOS POLICÍAS A PIE, ÉSTOS DEBEN FORMAR EN LO POSIBLE UN TRIÁNGULO DE SEGURIDAD, EN CUYA BASE DEBEN UBICARSE:","o":["LAS VÍCTIMAS.","LOS VEHÍCULOS POLICIALES.","LOS PRESUNTOS INFRACTORES.","LOS VEHÍCULOS DE LOS PRESUNTOS INFRACTORES.","LOS POLICÍAS INTERVENTORES."],"a":4,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1425,"q":"DENTRO DE UN INMUEBLE EL CONTROL DE UNA ESCALERA ES UNA ACCIÓN DE GRAN RIESGO Y PELIGRO. LA COORDINACIÓN, COMUNICACIÓN Y COOPERACIÓN SON ABSOLUTAMENTE NECESARIAS. LA TÉCNICA A EMPLEARSE SE DEBERÁ ACONDICIONAR AL TIPO, ESTRUCTURA Y UBICACIÓN ESPECÍFICA DE LA ESCALERA, TENIENDO ESPECIAL CUIDADO EN LOS DESCANSOS. SI SE TIENE HERRAMIENTAS DE OBSERVACIÓN DEBERÁN SER EMPLEADAS. EL ENUNCIADO ANTERIOR CORRESPONDE A:","o":["INTERVENCIÓN EN INMUEBLES: CONFORMACIÓN DE LOS EQUIPOS.","INTERVENCIÓN EN INMUEBLES: DESPLAZAMIENTOS.","INTERVENCIÓN EN INMUEBLES: INTERVENCIÓN EN EQUIPO.","INTERVENCIÓN EN INMUEBLES: PASADIZOS.","INTERVENCIÓN EN INMUEBLES: ESCALERAS."],"a":4,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1426,"q":"INTERVENCIÓN EN INMUEBLES.- RECONOCIMIENTO.- ¿CUÁL ES EL MAYOR PROBLEMA EN LA INTERVENCIÓN EN INMUEBLES?","o":["LA EXISTENCIA DE MASCOTAS.","EL TIPO DE INMUEBLE.","EL CERCO PERIMÉTRICO EXTERIOR.","LOS PUNTOS DE ENTRADA O INGRESO.","EL CERCO PERIMÉTRICO INTERIOR."],"a":3,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1427,"q":"INTERVENCIÓN EN INMUEBLES.- INDIQUE LA ALTERNATIVA QUE SE RELACIONE CON LA SIGUIENTE TÉCNICA DE INGRESO A INMUEBLES: EL PERONAL POLICIAL INTERVINIENTES SE DEBEN UBICAR A AMBOS LADOS DE LA PUERTA, ORIENTANDO SUS ARMAS HACIA ÉSTA. EL MÁS CARACTERIZADO SEÑALA CUÁNDO HAY QUE MOVERSE. RECORDAR: EL QUE INGRESE PRIMERO DEBERÁ CUBRIR LA PARTE DE LA HABITACIÓN QUE GENERALMENTE ESTÁ DEL LADO DE LAS BISAGRAS.","o":["INGRESO EN X.","INGRESO EN J.","INGRESO POR EL LADO LARGO.","INGRESO DINÁMICO.","INGRESO POR EL LADO CORTO."],"a":0,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1428,"q":"INTERVENCIÓN EN INMUEBLES.- INDIQUE LOS TIPOS DE INGRESO, QUE PUEDE APLICAR UN EFECTIVO PNP AL MOMENTO QUE PARTICIPA EN LA INTERVENCIÓN A UN INMUEBLE:","o":["INGRESO DINÁMICO, INGRESO EN Y, INGRESO EN J, INGRESO POR EL LADO LARGO, INGRESÓ POR EL LADO CORTO, INGRESO POR BARRIDA O GANADA DE ÁNGULO (CORTE PASTEL).","INGRESO DINÁMICO, INGRESO EN X, INGRESO EN J, INGRESO POR EL LADO LARGO, INGRESÓ POR EL LADO CORTO, INGRESO POR BARRIDA O GANADA DE ANGULO(CORTE PASTEL).","INGRESO DINÁMICO, INGRESO EN X, INGRESO EN G, INGRESO POR EL LADO LARGO, INGRESÓ POR EL LADO CORTO, INGRESO POR BARRIDA O GANADA DE ÁNGULO (CORTE PASTEL).","INGRESO DINÁMICO, INGRESO EN PEINE, INGRESO EN X, INGRESO EN J, INGRESO POR EL LADO LARGO, INGRESÓ POR EL LADO CORTO, INGRESO POR BARRIDA O GANADA DE ÁNGULO (CORTE PASTEL).","INGRESO RÁPIDO, INGRESO EN X, INGRESO EN G, INGRESO POR EL LADO LARGO, INGRESÓ POR EL LADO CORTO, INGRESO POR BARRIDA O GANADA DE ÁNGULO (CORTE PASTEL)."],"a":1,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1429,"q":"INTERVENCIÓN EN INMUEBLES.- INDIQUE LA ALTERNATIVA QUE SE RELACIONE CON LA SIGUIENTE TÉCNICA DE INGRESO A INMUEBLES: SE ENTIENDE POR LADO LARGO, LA MAYOR EXTENSIÓN DE PARED EN LA QUE ESTÁ LA PUERTA; LOS DOS EFECTIVOS POLICIALES ESTÁN EN EL MISMO LADO DE LA PARED; EL PRIMER EFECTIVO POLICIAL DEBE ASEGURARSE QUE LA PUERTA NO ESTÉ CERRADA O TRANCADA.","o":["INGRESO EN X.","INGRESO EN J.","INGRESO POR EL LADO LARGO.","INGRESO DINÁMICO.","INGRESO POR EL LADO CORTO."],"a":2,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1430,"q":"¿QUÉ ASPECTOS IMPORTANTES SE TIENEN QUE TENER EN CUENTA EN LAS TÉCNICAS DE INTERVENCIÓN?","o":["EL NÚMERO DE EFECTIVOS POLICIALES","EL CONO DE SEGURIDAD.","LA ZONA DE RIESGO Y LA ZONA DE SEGURIDAD.","LA LÍNEA IMAGINARIA QUE DIVIDE LA ZONA DE RIESGO Y LA ZONA DE SEGURIDAD.","LA PERCEPCIÓN DEL RIESGO."],"a":4,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1431,"q":"¿BAJO QUÉ CIRCUNSTANCIAS SE PUEDE QUEBRANTAR LOS PRINCIPIOS DE DERECHO NACIONAL E INTERNACIONAL QUE REGULAN LA RESPUESTA A UNA CRISIS?","o":["EN SITUACIÓN PÚBLICA DE EMERGENCIA.","EN GRAVE SITUACIÓN PÚBLICA DE EMERGENCIA.","EN GRAVE SITUACIÓN PÚBLICA DE EMERGENCIA QUE JUSTIFIQUE LOS MEDIOS EMPLEADOS.","BAJO NINGUNA CIRCUNSTANCIA.","CUANDO ESTÁ EN RIESGO LA PROPIEDAD PÚBLICA Y PRIVADA."],"a":3,"u":"(texto: II-V)** [PARTE SEGUNDA] [CAPITULO V]","m":1,"t":20},{"n":1432,"q":"CON FRECUENCIA LOS EFECTIVOS POLICIALES SON LESIONADOS POR ALGO QUE NO ANTICIPARON, NO RESPONDIERON NI ESTABAN MENTALMENTE PREPARADOS PARA ENFRENTAR;. EL SIGUIENTE ENUNCIADO CORRESPONDE AL:","o":["NIVEL DE REACCIÓN.","NIVEL DE SEGURIDAD.","NIVEL DE ALERTA MÁXIMA.","NIVEL DE DISTRACCIÓN.","NIVEL DE ATENCIÓN."],"a":4,"u":"(texto: II-I)** [PARTE SEGUNDA] [CAPITULO I]","m":1,"t":20},{"n":1433,"q":"DEBEN GARANTIZAR UNA ALTA PROFESIONALIZACIÓN, INDIVIDUAL Y COLECTIVA, INCIDIENDO EN ASPECTOS IMPORTANTES PARA EL DESARROLLO DE LA FUNCIÓN POLICIAL COMO SON: USO DE LA FUERZA, ARMAS DE FUEGO, TÉCNICAS DE INTERVENCIÓN POLICIAL, TÁCTICAS DEFENSIVAS NO LETALES, CONTROL FÍSICO DE INTERVENIDOS, ÉTICA EN LA FUNCIÓN POLICIAL. ESTA INSTRUCCIÓN SE DEBE MANTENER EN LOS DIFERENTES NIVELES EDUCATIVOS. TAMBIÉN SE DEBE GARANTIZAR UNA EVALUACIÓN REAL SOSTENIDA QUE PERMITA APRECIAR LA CALIFICACIÓN DE LA APTITUD Y ACTITUD PARA CUMPLIR CON LA FUNCIÓN POLICIAL. EL PÁRRAFO ANTERIOR SE REFIERE A:","o":["USO DE ARMAS DE FUEGO.","LOS PLANES Y PROGRAMAS DE LA INSTITUCIÓN POLICIAL.","EL PLANEAMIENTO OPERATIVO DE LOS SERVICIOS POLICIALES.","LA INSTRUCCIÓN BÁSICA POLICIAL.","LOS PLANES Y PROGRAMAS DEL SISTEMA EDUCATIVO POLICIAL."],"a":4,"u":"(texto: II-I)** [PARTE SEGUNDA] [CAPITULO I]","m":1,"t":20},{"n":1434,"q":"VERIFICAR QUE EL PERSONAL ESTÉ ADECUADAMENTE EQUIPADO. EL ENUNCIADO ANTERIOR CORRESPONDE A:","o":["MANTENIMIENTO DEL ORDEN PÚBLICO: PREPARACIÓN.","MANTENIMIENTO DEL ORDEN PÚBLICO: COMUNICACIÓN.","ANTES DE LA EJECUCIÓN DE LAS OPERACIONES.","MANTENIMIENTO DEL ORDEN PÚBLICO: APARIENCIA.","MANTENIMIENTO DEL ORDEN PÚBLICO: EMPLEO DE LA FUERZA."],"a":2,"u":"(texto: II-IV)** [PARTE SEGUNDA] [CAPITULO IV]","m":1,"t":20},{"n":1435,"q":"A QUE NIVEL DE ALERTA CORRESPONDE EL SIGUIENTE ENUNCIADO: SE DISTRAE CON LO QUE ESTÁ SUCEDIENDO A SU ALREDEDOR, LO QUE PUEDE SER OCASIONADO POR EL CANSANCIO O LA CREENCIA DE QUE NO HAY POSIBILIDAD DE PROBLEMAS.","o":["NIVEL DE ATENCIÓN.","NIVEL DE SEGURIDAD.","NIVEL DE DISTRACCIÓN.","NIVEL DE ALERTA MÁXIMA.","NIVEL DE REACCIÓN."],"a":2,"u":"(texto: II-I)** [PARTE SEGUNDA] [CAPITULO I]","m":1,"t":20},{"n":1436,"q":"LAS EMOCIONES COMO LA CÓLERA, LA IRA, LA COMPASIÓN, EL MIEDO, ENTRE OTRAS, SON ESTADOS DE ÁNIMO QUE INFLUYEN DIRECTAMENTE EN EL ACCIONAR DEL PERSONAL POLICIAL. ESTE ENUNCIADO ESTÁ RELACIONADO A:","o":["VERBALIZACIÓN.","USO DE LA FUERZA.","MANEJO DE EQUIPO.","CONTROL DE EMOCIONES E INTELIGENCIA EMOCIONAL.","ENTRENAMIENTO FÍSICO."],"a":3,"u":"(texto: II-I)** [PARTE SEGUNDA] [CAPITULO I]","m":1,"t":20},{"n":1437,"q":"INTERVENCIÓN EN INMUEBLES.- INDIQUE LA ALTERNATIVA QUE SE RELACIONE CON LA SIGUIENTE TÉCNICA DE INGRESO A INMUEBLES: UBICADOS A UN SOLO LADO DE LA PUERTA O NIVEL DE LA PARED; ES NECESARIO ADOPTAR UNA POSICIÓN CÓMODA Y SEGURA, PUES SE ESTÁ PRESUMIENDO QUE AL DETECTAR UNA AMENAZA SE TENDRÁ QUE EMPLEAR EL ARMA DE FUEGO PARA NEUTRALIZARLE O CONTROLARLA; AMBOS EFECTIVOS POLICIALES DEBERÁN ALEJARSE DE LOS NIVELES DEL MARCO CENTRAL O PARED, PARA EVITAR QUE UNA PERSONA ESCONDIDA DETRÁS DE ELLOS LES PUEDA ARREBATAR EL ARMA.","o":["INGRESO EN X.","INGRESO EN J.","INGRESO POR EL LADO LARGO.","INGRESO DINÁMICO.","INGRESO POR BARRIDA O GANADA DE ÁNGULO (CORTE PASTEL)."],"a":4,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1438,"q":"RESPECTO A LA DISTRIBUCIÓN TÁCTICA EN EL MANEJO DE CRISIS: ¿POR DÓNDE INGRESAN O SALEN LAS PERSONAS INVOLUCRADAS?","o":["POR EL CORDÓN EXTERIOR.","POR EL PUNTO DE CONTROL ANTERIOR.","POR EL PUNTO DE ENCUENTRO.","POR EL PUNTO DE CONTROL POSTERIOR.","POR EL CORDÓN INTERIOR."],"a":2,"u":"(texto: II-V)** [PARTE SEGUNDA] [CAPITULO V]","m":1,"t":20},{"n":1439,"q":"CRISIS ES ...:","o":["UNA FORMA DE ALTERACIÓN GRAVE DEL ORDEN INTERNO.","ES LA ALTERACIÓN GRAVE DEL ORDEN CONSTITUCIONAL, DEMANDANDO UNA RESPUESTA ESPECIAL DE LA POLICÍA.","ES LA ALTERACIÓN GRAVE DEL ORDEN INTERNO, ECONÓMICO Y SOCIAL.","ES LA ALTERACIÓN GRAVE DEL ORDEN PÚBLICO.","ES LA ALTERACIÓN GRAVE DEL ORDEN INTERNO Y PÚBLICO."],"a":3,"u":"(texto: II-V)** [PARTE SEGUNDA] [CAPITULO V]","m":1,"t":20},{"n":1440,"q":"RESPECTO A LA INSTRUCCIÓN BÁSICA: LA PREPARACIÓN DE LOS Y LAS POLICÍAS CONSTITUYA UN PROCESO PERMANENTE DE CAPACITACIÓN Y ENTRENAMIENTO QUE DEBE PERMITIRLES DESEMPEÑARSE ADECUADAMENTE ANTE LOS DIVERSOS REQUERIMIENTOS QUE EL CONTEXTO SOCIAL PRESENTA DURANTE EL CUMPLIMIENTO DE:","o":["SUS ATRIBUCIONES.","SU FUNCIÓN.","SU MISIÓN.","SU SERVICIO.","SUS FACULTADES."],"a":2,"u":"(texto: II-I)** [PARTE SEGUNDA] [CAPITULO I]","m":1,"t":20},{"n":1441,"q":"RESPECTO A LA INSTRUCCIÓN BÁSICA: ESTA INSTRUCCIÓN SE DEBE MANTENER EN LOS DIFERENTES NIVELES EDUCATIVOS. TAMBIÉN SE DEBE GARANTIZAR UNA EVALUACIÓN REAL SOSTENIDA QUE PERMITA APRECIAR LA CALIFICACIÓN DE LA APTITUD Y ACTITUD PARA CUMPLIR CON:","o":["EL SERVICIO POLICIAL.","LA FUNCIÓN PRIMORDIAL.","LA MISIÓN.","LA FUNCIÓN POLICIAL.","LAS DISPOSICIONES DEL COMANDO."],"a":3,"u":"(texto: II-I)** [PARTE SEGUNDA] [CAPITULO I]","m":1,"t":20},{"n":1442,"q":"RESPECTO A LA PREPARACIÓN PSICOLÓGICA: SI USTED NO SE PREPARA MENTALMENTE PARA LAS SITUACIONES O LO QUE RESULTE DE ELLAS, MUY PROBABLEMENTE TENDRÁ UN DESEMPEÑO NO DESEADO, PUDIENDO INCLUSO QUEDARSE PARALIZADO Y SER VÍCTIMA ....:","o":["DE LAS FUERZAS OPONENTES.","DEL ENEMIGO","DE LOS DD.CC.","DE LOS ACONTECIMIENTOS.","DE SU PROPIO MIEDO."],"a":3,"u":"(texto: II-I)** [PARTE SEGUNDA] [CAPITULO I]","m":1,"t":20},{"n":1443,"q":"INTERVENCIÓN EN INMUEBLES.- DESPLAZAMIENTOS.- INDIQUE LA ALTERNATIVA QUE COMPLETE CORRECTAMENTE EL SIGUIENTE ENUNCIADO: DESPLAZARSE A TRAVÉS DE LA RUTA MÁS SEGURA Y CORTA, BUSCANDO LA PROTECCIÓN DE ABRIGOS (PARAPETOS) SUCESIVOS Y EVITANDO EXPONERSE A RIESGOS INNECESARIOS, ESPECIALMENTE EN ......:","o":["ÁREAS SEGURAS.","ÁREAS CONFLICTIVAS.","ÁREAS LARGAS.","ÁREAS CORTAS.","ÁREAS LIBRES."],"a":4,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1444,"q":"CONTROL DE EMOCIONES E INTELIGENCIA EMOCIONAL: ¿DE QUÉ DEPENDERÁ SU NIVEL DE ALERTA?","o":["DE SU CONTROL DE EMOCIONES E INTELIGENCIA EMOCIONAL.","DE SU PREPARACION MENTAL.","DE SU CAPACIDAD DE ANTICIPACIÓN AL PELIGRO.","DEL CONOCIMIENTO DE LA SITUACIÓN PREEXISTENTE.","DEL CONOCIMIENTO DE LAS ACCIONES DEL ENEMIGO."],"a":2,"u":"(texto: II-I)** [PARTE SEGUNDA] [CAPITULO I]","m":1,"t":20},{"n":1445,"q":"¿CUÁL DE LAS ALTERNATIVAS SE RELACIONA CON UN NIVEL DE SEGURIDAD?","o":["EL RIESGO ES REAL Y LA REACCIÓN DEBE SER INSTANTÁNEA.","CUANDO EL PELIGRO SE MANTIENE POR UN TIEMPO PROLONGADO O EL EFECTIVO POLICIAL ENFRENTA UN PELIGRO PARA EL CUAL NO ESTÁ PREPARADO.","ES EL NIVEL DE ALERTA QUE USTED DEBE TENER EN TODO MOMENTO CUANDO ESTÁ PATRULLANDO.","SE DISTRAE CON LO QUE ESTÁ SUCEDIENDO A SU ALREDEDOR, LO QUE PUEDE SER OCASIONADO POR EL CANSANCIO O LA CREENCIA DE QUE NO HAY POSIBILIDAD DE PROBLEMAS.","HAY CONCIENCIA DE LA EXISTENCIA DE UN PELIGRO. SIN EMBARGO, EL ENTRENAMIENTO, EXPERIENCIA, EDUCACIÓN Y BUEN SENTIDO LE PERMITEN EFECTUAR UN PLANEAMIENTO TÁCTICO A SEGUIR."],"a":4,"u":"(texto: II-I)** [PARTE SEGUNDA] [CAPITULO I]","m":1,"t":20},{"n":1446,"q":"¿CUÁL DE LAS ALTERNATIVAS SE RELACIONA CON EL NIVEL DE ALERTA, NIVEL DE ATENCIÓN?","o":["CUANDO EL PELIGRO SE MANTIENE POR UN TIEMPO PROLONGADO O EL EFECTIVO POLICIAL ENFRENTA UN PELIGRO PARA EL CUAL NO ESTÁ PREPARADO.","HAY CONCIENCIA DE LA EXISTENCIA DE UN PELIGRO, SIN EMBARGO SU ENTRENAMIENTO, EXPERIENCIA, EDUCACIÓN Y BUEN SENTIDO LE PERMITEN EFECTUAR UN PLANEAMIENTO TÁCTICO A SEGUIR.","SU ESTADO MENTAL NO ESTÁ PREPARADO PARA UN EVENTUAL ENFRENTAMIENTO, AUMENTANDO SU PROPIA INSEGURIDAD Y TAMBIÉN LA DE SU EQUIPO DURANTE EL SERVICIO POLICIAL.","EL RIESGO ES REAL Y LA REACCIÓN DEBE SER INSTANTÁNEA.","ES EL NIVEL DE ALERTA QUE EL PERSONAL POLICIAL DEBE TENER EN TODO MOMENTO CUANDO ESTÁ PATRULLANDO, DANDO PRIORIDAD A LA BÚSQUEDA DE UNA AMENAZA POTENCIAL."],"a":4,"u":"(texto: II-I)** [PARTE SEGUNDA] [CAPITULO I]","m":1,"t":20},{"n":1447,"q":"INTERVENCIÓN EN INMUEBLES.- ESCALERAS.- ELIJA LA ALTERNATIVA QUE COMPLETE CORRECTAMENTE EL SIGUIENTE ENUNCIADO: EXISTE MAYOR RIESGO EN CONTROLAR UNA ESCALERA (.....................).","o":["HACIA ABAJO.","HACIA ARRIBA.","CARACOL.","MARINERO.","DE METAL."],"a":1,"u":"(texto: II-III)** [PARTE SEGUNDA] [CAPITULO III]","m":1,"t":20},{"n":1448,"q":"¿CUÁL DE LAS ALTERNATIVAS SE RELACIONA CON EL NIVEL DE ALERTA, NIVEL DE REACCIÓN POSITIVA?","o":["EN ESTE ESTADO SUS OJOS PUEDEN VER LA AMENAZA, PERO SU MENTE NO ESTARÁ PREPARADA PARA SUMINISTRAR LAS RESPUESTAS CORRECTAS DE REACCIÓN.","EL NIVEL DE SEGURIDAD DISMINUYE LOS RIESGOS DE USTED Y SU EQUIPO. SI SON SORPRENDIDOS SE ENCONTRARÁN LISTOS PARA DAR LAS RESPUESTAS QUE LA SITUACIÓN EXIJA.","HAY CONCIENCIA DE LA EXISTENCIA DE UN PELIGRO, SIN EMBARGO SU ENTRENAMIENTO, EXPERIENCIA, EDUCACIÓN Y BUEN SENTIDO LE PERMITEN EFECTUAR UN PLANEAMIENTO TÁCTICO A SEGUIR.","ES EL NIVEL DE ALERTA QUE USTED DEBE TENER EN TODO MOMENTO CUANDO ESTÁ PATRULLANDO.","EL RIESGO ES REAL Y LA REACCIÓN DEBE SER INSTANTÁNEA."],"a":4,"u":"(texto: II-I)** [PARTE SEGUNDA] [CAPITULO I]","m":1,"t":20},{"n":1449,"q":"¿CUÁLES SON LAS DOS ÁREAS QUE SE DEBE DELIMITAR OBJETIVAMENTE PARA UN BUEN PENSAMIENTO TÁCTICO?","o":["ÁREA DE SEGURIDAD Y ÁREA DE ACCIÓN.","ÁREA DE SEGURIDAD Y ÁREA DE RIESGO.","ÁREA DE SEGURIDAD Y ÁREA DE INTERVENCIÓN.","ÁREA DE SEGURIDAD Y CORDÓN DE SEGURIDAD.","ÁREA DE SEGURIDAD Y ÁREA DE COMANDO."],"a":1,"u":"(texto: II-I)** [PARTE SEGUNDA] [CAPITULO I]","m":1,"t":20},{"n":1450,"q":"EL ÁREA DE RIESGO YA DOMINADA SE CONVIERTE EN:","o":["ÁREA CONTROLADA.","ÁREA DESPEJADA.","ÁREA DE SEGURIDAD.","ÁREA DOMINADA.","ÁREA CONFLICTIVA."],"a":2,"u":"(texto: II-I)** [PARTE SEGUNDA] [CAPITULO I]","m":1,"t":20},{"n":1451,"q":"INDIQUE LA ALTERNATIVA CORRECTA RESPECTO A LA VERBALIZACIÓN:","o":["EL ENSEÑAR EL ARMA AL INTERVENIDO TAMBIÉN AYUDA EN LA 56,"q":"RESPECTO A LOS NIVELES DE RESPUESTA DEL MANEJO DE UNA CRISIS, INDIQUE DONDE SE ENMARCAN LOS NIVELES DE RESPUESTA DE LA POLICÍA:","o":["EN LOS PRINCIPIOS DEL USO DE LA FUERZA.","EN LO PRINCIPIOS BÁSICOS DE LOS DERECHOS HUMANOS.","EN EL CÓDIGO PENAL.","EN LA CARTA DE LAS NACIONES UNIDAS.","EN EL CORRECTO USO DEL ARMA DE FUEGO."],"a":0,"u":"(texto: II-V)** [PARTE SEGUNDA] [CAPITULO V]","m":1,"t":20},{"n":1457,"q":"INDIQUE, ¿CUÁL DE LAS SIGUIENTES ALTERNATIVAS CORRESPONDE PROCEDIMIENTO PARA EL MANEJO DE CRISIS?","o":["AGRUPAR.","COORDINAR.","CONTENER.","COMUNICAR.","TRATAR."],"a":2,"u":"(texto: II-V)** [PARTE SEGUNDA] [CAPITULO V]","m":1,"t":20},{"n":1458,"q":"¿CUÁL DE LAS SIGUIENTES ALTERNATIVAS CORRESPONDE AL PROCEDIMIENTO PARA EL MANEJO DE CRISIS?","o":["NEGOCIAR.","AGRUPAR.","VERBALIZAR.","TRATAR.","PLANIFICAR."],"a":0,"u":"(texto: II-V)** [PARTE SEGUNDA] [CAPITULO V]","m":1,"t":20},{"n":1459,"q":"¿EN QUÉ PASO DEL PROCEDIMIENTO PARA EL MANEJO DE CRISIS SE IMPEDIRÁ EL ACCESO DE PERSONAS AJENAS AL EVENTO, FACILITANDO LA SALIDA Y EVACUACIÓN DE LA ZONA DE RIESGO?","o":["NEGOCIAR.","COMUNICAR.","AISLAR.","CONTENER.","VERBALIZAR."],"a":2,"u":"(texto: II-V)** [PARTE SEGUNDA] [CAPITULO V]","m":1,"t":20},{"n":1460,"q":"RESPECTO AL MANEJO DE UNA CRISIS INDIQUE: A FALTA DE UN NEGOCIADOR PROFESIONAL DE LA POLICÍA ¿QUIÉN DEBE ESTAR A CARGO DE LAS NEGOCIACIONES?","o":["EL EFECTIVO POLICIAL MÁS ANTIGUO.","EL RESPONSABLE DEL GRUPO","EL EFECTIVO POLICIAL QUE REÚNA LAS CONDICIONES PARA DESEMPEÑARSE COMO TAL.","EL EFECTIVO POLICIAL CON MÁS EXPERIENCIA.","UN REPRESENTANTE DE LA DEFENSORÍA DEL PUEBLO."],"a":2,"u":"(texto: II-V)** [PARTE SEGUNDA] [CAPITULO V]","m":1,"t":20},{"n":1461,"q":"RESPECTO A LA GUÍA PARA NEGOCIADORES NO ENTRENADOS INDIQUE QUE ES LO QUE NO SE DEBE HACER CON EL CAUSANTE:","o":["IDENTIFICARSE CON SU NOMBRE, SIN GRADO.","NOMBRAR A UN SEGUNDO NEGOCIADOR.","ELABORAR EL PLAN DE CONTINGENCIA ANTE UNA POSIBLE RENDICIÓN.","TRANSMITIR CON LA VOZ SENTIMIENTOS DE COMP
